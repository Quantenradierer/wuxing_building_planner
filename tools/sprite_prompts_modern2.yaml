# Modern sprite set, second round (tools/sprite_studio.py --set modern2): one file for
# every object and every wealth tier, cut to data/sprites/modern2/<name>.png.
#
#   <kind>           middle, designed from a guide (every non-procedural object kind)
#   <kind>.high      rich, designed from its own guide (furniture only)
#   <kind>.luxury    luxury, designed from its own guide (furniture only)
#   <kind>.low       poor: the picked middle sprite worn down (`derived:` below)
#   <kind>.squatter  ruin: the picked middle sprite wrecked (`derived:` below)
#
# The renderer falls back towards middle, so kinds without high/luxury use the plain sprite.
# Sprites face south like the Midjourney set: the back of the object at the TOP of the image.
#
# Text alone gives no true top-down view, so every job is img2img from a guide: a rough
# plan-view drawing of the object in its main colours. `guide` lists shapes in object
# coordinates (0..1 across the object's footprint, y down = towards the front):
#   [rect, x0, y0, x1, y1, colour, radius]   radius as a fraction of the shorter side
#   [ellipse, x0, y0, x1, y1, colour]
#   [line, x0, y0, x1, y1, colour, width]    width as a fraction of the shorter side
# `base` is the footprint itself ([rect|ellipse|none, colour, radius]); default a grey box.
# Prompt shape follows leto-60's proven recipe: the fixed score/topdown tags plus a plain
# material description (no "modern"/"cyberpunk" words). The modern look comes from the guide
# colours and the materials named per subject, not from style adjectives.
look: "modern contemporary interior, clean, realistic materials, not sci-fi"
style: >-
  score_9, score_8_up, score_7_up, m3p4ss3ts, top down, from above, white background,
  simple background, {subject}
negative: >-
  front view, side view, perspective, isometric, cropped, text, watermark, sci-fi, cyberpunk,
  neon, glowing, people
lora: "topdown-map-assets-scifi-pony.safetensors"
# Flat objects follow the guide at 0.6; tall objects (fridge, vending) need 0.7-0.75 or they
# stay a flat box. Override per subject with `denoise:`.
denoise: 0.6
seeds: 4  # one 2x2 grid per attempt, like a Midjourney job

derived:
  tiers:
    low:
      denoise: 0.55
      prompt: >-
        {subject}, old and worn out, scratched and stained, faded colours, cheap, slightly
        damaged
    squatter:
      denoise: 0.7
      prompt: >-
        {subject}, wrecked and abandoned, broken, torn and dirty, stains, rust, dust, debris
        around it

