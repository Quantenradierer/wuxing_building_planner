# Cyberpunk sprite set for tools/sprite_studio.py:
#
#   uv run python tools/sprite_studio.py --set cyberpunk
#
# Three designed tiers per kind, each drawn from its own guide: `<kind>` (middle), `<kind>.high`
# and `<kind>.luxury`. The poorer tiers are not designed but worn down from the picked middle
# sprite (`derived:` below): img2img from that picture, so low and squatter stay recognisably
# the same object. All cut to data/sprites/cyberpunk/<name>.png; the renderer falls back
# towards middle.
#   middle    gunmetal and matte polymer, thin cyan LED strips
#   high      rich: corporate, black glass, chrome, glowing cyan lines
#   luxury    elite: black marble, gold, magenta neon
#   low       the middle object worn: grimy, scratched, a dim LED
#   squatter  the middle object wrecked: broken, rusted, duct tape, dead neon
# Guide format as in sprite_prompts_modern.yaml. Unlike the modern set this keeps the LoRA's
# sci-fi tag `sc1f1` and allows neon; the bright guide lines seed the glow.
look: "cyberpunk, dark gunmetal, black glass, chrome, cyan and magenta neon accents"
style: >-
  score_9, score_8_up, score_7_up, m3p4ss3ts, sc1f1, top down, from above, white background,
  simple background, {subject}
negative: >-
  front view, side view, perspective, isometric, cropped, text, watermark, people, blurry
lora: "topdown-map-assets-scifi-pony.safetensors"
denoise: 0.7
seeds: 4

derived:
  tiers:
    low:
      denoise: 0.55
      prompt: >-
        {subject}, old and worn out, grimy, scratched and stained, faded, one dim flickering LED
    squatter:
      denoise: 0.7
      prompt: >-
        {subject}, wrecked and looted, broken, rusted, torn, patched with duct tape, dirt and
        debris, dead neon

