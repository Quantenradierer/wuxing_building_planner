# Cyberpunk sprite set for tools/sprite_studio.py, every kind in all five wealth tiers:
#
#   uv run python tools/sprite_studio.py --set cyberpunk
#
# `<kind>` is the middle tier; `<kind>.<tier>` the others, cut to
# data/sprites/cyberpunk/<name>.png. The renderer falls back towards middle.
#   squatter  ruin: scavenged scrap, rust, duct tape, one broken neon tube
#   low       poor: cheap plastic, grimy, a weak cyan LED
#   middle    gunmetal and matte polymer, thin cyan LED strips
#   high      rich: corporate, black glass, chrome, glowing cyan lines
#   luxury    elite: black marble, gold, magenta neon
# Guide format as in sprite_prompts_modern.yaml. Unlike the modern set this keeps the LoRA's
# sci-fi tag `sc1f1` and allows neon; the bright guide lines seed the glow.
style: >-
  score_9, score_8_up, score_7_up, m3p4ss3ts, sc1f1, top down, from above, white background,
  simple background, {subject}
negative: >-
  front view, side view, perspective, isometric, cropped, text, watermark, people, blurry
lora: "topdown-map-assets-scifi-pony.safetensors"
denoise: 0.62
seeds: 4

