# Neon sprite set, second round (tools/sprite_studio.py --set neon2): the modern2 guides (their
# shapes were good) redrawn cyberpunk, cut to data/sprites/neon2/<name>.png. Made from
# sprite_prompts_modern2.yaml: guide colours darkened to gunmetal and cool greys (coloured parts
# keep their hue), a thin neon strip along the back edge of wall-backed tech and furniture (beds,
# desks, counters, racks, machines; both short ends of a shipping container) to seed the glow, and every
# description ends in its tier's cyberpunk materials:
#   middle    dark gunmetal and matte black polymer, thin cyan LED strips
#   high      corporate: black glass, brushed chrome, glowing cyan lines
#   luxury    elite: black lacquer, gold trim, magenta neon
#   low       the middle object worn: grimy, scratched, a dim flickering LED
#   squatter  the middle object wrecked: rusted, duct tape, dead neon
# Tiers, guide format and facing as in sprite_prompts_modern2.yaml. Unlike modern2 this keeps
# the LoRA's sci-fi tag `sc1f1` and allows neon.
look: "cyberpunk, dark gunmetal, black glass, chrome, cyan and magenta neon accents, grimy"
style: >-
  score_9, score_8_up, score_7_up, m3p4ss3ts, sc1f1, top down, from above, white background,
  simple background, {subject}
negative: >-
  front view, side view, perspective, isometric, cropped, text, watermark, people, blurry
lora: "topdown-map-assets-scifi-pony.safetensors"
# A little more freedom than modern2 so the neon look can come through; tall objects keep
# their own `denoise:`.
denoise: 0.65
seeds: 4

derived:
  tiers:
    low:
      denoise: 0.55
      prompt: >-
        {subject}, old and worn out, grimy, scratched and stained, faded, one dim flickering LED
    squatter:
      denoise: 0.7
      prompt: >-
        {subject}, wrecked and looted, broken, rusted, torn, patched with duct tape, dirt and
        debris, dead neon

