# Wealth tiers of the modern sprite set, for tools/sprite_studio.py:
#
#   uv run python tools/sprite_studio.py --prompts tools/sprite_prompts_modern_wealth.yaml
#
# The plain modern sprites (tools/sprite_prompts_modern.yaml) are the middle tier. `high` and
# `luxury` are designed here, each from its own guide. The poorer tiers are worn down from the
# picked middle sprite (`derived:` below): img2img from that picture, so low and squatter stay
# recognisably the same object. All cut to data/sprites/modern/<kind>.<tier>.png; the renderer
# falls back towards middle.
#   high      rich: walnut, leather, glass, brushed steel, crisp
#   luxury    marble, brass, velvet, dark walnut, designer pieces
#   low       the middle object worn: scratched, stained, faded
#   squatter  the middle object wrecked: broken, torn, dirty, abandoned
# Guide format and recipe as in sprite_prompts_modern.yaml.
look: "modern contemporary interior, clean, realistic materials, not sci-fi"
style: >-
  score_9, score_8_up, score_7_up, m3p4ss3ts, top down, from above, white background,
  simple background, {subject}
negative: >-
  front view, side view, perspective, isometric, cropped, text, watermark, sci-fi, cyberpunk,
  neon, glowing, people
lora: "topdown-map-assets-scifi-pony.safetensors"
denoise: 0.6
seeds: 4

derived:
  source: tools/sprite_prompts_modern.yaml  # the middle tier's prompts
  tiers:
    low:
      denoise: 0.55
      prompt: >-
        {subject}, old and worn out, scratched and stained, faded colours, cheap, slightly
        damaged
    squatter:
      denoise: 0.7
      prompt: >-
        {subject}, wrecked and abandoned, broken, torn and dirty, stains, rust, dust, debris
        around it

