# Wealth variants of the modern sprite set, for tools/sprite_studio.py:
#
#   uv run python tools/sprite_studio.py --prompts tools/sprite_prompts_modern_wealth.yaml
#
# Names are `<kind>.<tier>` and are cut to data/sprites/modern/<kind>.<tier>.png. The plain
# modern sprites (tools/sprite_prompts_modern.yaml) are the middle tier. The renderer falls
# back towards middle: luxury -> high -> plain, squatter -> low -> plain.
#   squatter  ruin: makeshift, scavenged, dirty, torn
#   low       poor: cheap, worn, laminate and plastic, faded
#   high      rich: walnut, leather, glass, brushed steel, crisp
#   luxury    marble, brass, velvet, dark walnut, designer pieces
# Guide format and recipe as in sprite_prompts_modern.yaml; the guide colours drive the look
# as much as the words, so each tier has its own palette.
style: >-
  score_9, score_8_up, score_7_up, m3p4ss3ts, top down, from above, white background,
  simple background, {subject}
negative: >-
  front view, side view, perspective, isometric, cropped, text, watermark, sci-fi, cyberpunk,
  neon, glowing, people
lora: "topdown-map-assets-scifi-pony.safetensors"
denoise: 0.6
seeds: 4

