<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Studio</title>
<style>
  :root { --bg: #f3f4f6; --card: #fff; --ink: #1f2328; --muted: #6b7280; --line: #d9dce1;
          --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px;
           align-items: center; padding: 10px 16px; background: var(--card);
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  .stat { color: var(--muted); }
  .filters button { border: 1px solid var(--line); background: var(--card); padding: 4px 10px;
                    border-radius: 6px; cursor: pointer; }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pause { border: 1px solid var(--line); background: var(--card); padding: 4px 10px;
           border-radius: 6px; cursor: pointer; }
  .pause.paused { background: var(--warn); color: #fff; border-color: var(--warn); }
  input[type=search] { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
  main { padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .top .info { flex: 1; min-width: 0; }
  .kind { font-weight: 600; font-size: 15px; }
  .prompt { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-left: 6px; color: #fff; }
  .badge.rendering { background: var(--accent); } .badge.queued { background: var(--warn); }
  .badge.failed { background: var(--bad); } .badge.picked { background: var(--ok); }
  .badge.waiting { background: var(--muted); }
  .derived { font-size: 11px; color: var(--accent); margin-top: 2px; }
  .buttons { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .describe { border: 1px solid var(--line); background: none; padding: 5px 12px;
              border-radius: 6px; cursor: pointer; }
  .describe:disabled { opacity: .5; cursor: default; }
  .editor textarea { width: 100%; min-height: 70px; margin-top: 6px; font: 13px/1.4 system-ui, sans-serif;
                     padding: 6px 8px; border: 1px solid var(--accent); border-radius: 6px; resize: vertical; }
  .editor .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .guide { width: 72px; height: 72px; object-fit: contain; border: 1px dashed var(--line); border-radius: 6px;
           background: #f5f5f5; }
  .tune { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 6px;
          align-items: center; flex-wrap: wrap; }
  .tune input { width: 160px; }
  .tune .value { color: var(--ink); }
  .editor button { border: 1px solid var(--line); background: none; padding: 4px 10px; border-radius: 6px;
                   cursor: pointer; }
  .editor button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .current { width: 72px; height: 72px; object-fit: contain; }
  .current.floor { width: 144px; height: 144px; background-size: 72px 72px; border-radius: 6px;
                   flex: none; }
  .retry { border: 1px solid var(--accent); color: var(--accent); background: none;
           padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .retry:disabled { opacity: .4; cursor: default; }
  .attempt { margin-top: 10px; }
  .attempt .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 160px)); gap: 8px; }
  .tiles img { width: 100%; aspect-ratio: 1; object-fit: contain; cursor: pointer; border-radius: 6px;
               border: 3px solid transparent;
               background: repeating-conic-gradient(#e5e7eb 0 25%, #f9fafb 0 50%) 0 0 / 16px 16px; }
  .tiles img:hover { border-color: #93c5fd; }
  .tiles img.picked { border-color: var(--ok); }
  .empty { color: var(--muted); font-style: italic; margin-top: 8px; }
  @media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<header>
  <h1>Sprite Studio</h1>
  <span class="stat" id="stat"></span>
  <button id="pause" class="pause" title="Stops after the image that is rendering now">Pause queue</button>
  <span class="filters" id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="open">Not picked</button>
    <button data-f="busy">In queue</button>
    <button data-f="waiting">Waiting for pick</button>
  </span>
  <input type="search" id="search" placeholder="Filter objects">
</header>
<main id="list"></main>
<script>
let state = { kinds: [] }, filter = "all", search = "";
const cards = new Map();
const editing = new Set();  // cards with an open editor are not rebuilt by the refresh

async function post(path, body) {
  await fetch(path, { method: "POST", body: JSON.stringify(body) });
  refresh();
}

function visible(k) {
  if (search && !k.kind.includes(search)) return false;
  if (filter === "open") return !k.pick;
  if (filter === "busy") return k.status === "queued" || k.status === "rendering";
  if (filter === "waiting") return k.status === "waiting";
  return true;
}

function card(k) {
  const el = document.createElement("section");
  el.className = "card";
  const label = k.status === "waiting" ? `waiting for ${k.base} pick` : k.status;
  const badge = k.status !== "idle" ? `<span class="badge ${k.status}">${label}</span>`
    : k.pick ? `<span class="badge picked">picked</span>` : "";
  const src = k.pick ? `/sprite/${k.kind}?v=${k.pick.attempt}-${k.pick.quadrant}` : "";
  // A floor texture is shown repeated 2x2, so a seam would show.
  const current = !k.pick ? "" : k.floor
    ? `<div class="current floor" title="seamless tile, repeated" style="background-image:url('${src}')"></div>`
    : `<img class="current" src="${src}" alt="">`;
  const busy = ["queued", "rendering", "waiting"].includes(k.status);
  const derived = k.base ? `<div class="derived">worn down from the picked ${k.base}</div>` : "";
  const describe = k.base ? "" : `<button class="describe edit">Edit description</button>
      <button class="describe gpt">Recreate text description</button>`;
  const guide = k.base ? "" : `<img class="guide" src="/guide/${k.kind}?v=${k.guide}" alt=""
      title="Guide drawing: fixes shape and colours; the description adds detail">`;
  el.innerHTML = `<div class="top">${current}${guide}<div class="info">
      <div class="kind">${k.kind}${badge}</div>${derived}<div class="prompt"></div>
      <div class="tune"><span>${k.base ? "Keep picked" : "Guide"}</span>
        <input type="range" min="0.3" max="0.95" step="0.05" value="${k.denoise}">
        <span>${k.base ? "More wear" : "Text"}</span><span class="value"></span></div></div>
      <div class="buttons"><button class="retry" ${busy ? "disabled" : ""}>
      ${k.attempts.length ? "Retry" : "Generate"}</button>${describe}</div></div>`;
  el.querySelector(".prompt").textContent = k.prompt;
  el.querySelector(".retry").onclick = () => post("/api/retry", { kind: k.kind });
  setupTune(el, k);
  const edit = el.querySelector(".edit");
  if (edit) edit.onclick = () => openEditor(el, k);
  const button = el.querySelector(".gpt");
  if (button) button.onclick = async () => {
    button.disabled = true;
    button.textContent = "Asking GPT…";
    const response = await fetch("/api/describe", { method: "POST", body: JSON.stringify({ kind: k.kind }) });
    const result = await response.json();
    if (result.error) {
      alert(`Description failed: ${result.error}`);
      button.disabled = false;
      button.textContent = "Recreate text description";
    }
    refresh();
  };
  if (!k.attempts.length) el.insertAdjacentHTML("beforeend", `<div class="empty">no images yet</div>`);
  for (const a of [...k.attempts].reverse()) {
    const row = document.createElement("div");
    row.className = "attempt";
    const idle = k.idle[a] !== undefined ? ` · made while idle, denoise ${k.idle[a]}` : "";
    row.innerHTML = `<div class="label">attempt ${a}${idle}</div><div class="tiles"></div>`;
    for (let q = 0; q < 4; q++) {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = `/tile/${k.kind}/${a}/${q}`;
      if (k.pick && k.pick.attempt === a && k.pick.quadrant === q) img.className = "picked";
      img.title = "Use this one";
      img.onclick = () => post("/api/pick", { kind: k.kind, attempt: a, quadrant: q });
      row.querySelector(".tiles").append(img);
    }
    el.append(row);
  }
  return el;
}

function tuneLabel(k, v) {
  if (k.base) return `denoise ${v.toFixed(2)}` + (v < 0.5 ? " · barely worn" : v < 0.65 ? " · worn" :
    v < 0.8 ? " · wrecked" : " · may stop looking like the picked object");
  return `denoise ${v.toFixed(2)}` + (v < 0.6 ? " · keeps the guide's shape" : v < 0.75 ? " · balanced" :
    v < 0.85 ? " · mostly the text" : " · text only, may lose the top-down view");
}

function setupTune(el, k) {
  const slider = el.querySelector(".tune input");
  const shown = el.querySelector(".tune .value");
  const label = () => { shown.textContent = tuneLabel(k, Number(slider.value)); };
  label();
  // Hold the card while dragging, so a refresh doesn't rebuild it under the mouse.
  slider.onpointerdown = () => editing.add(k.kind);
  slider.oninput = label;
  slider.onchange = async () => {
    const response = await fetch("/api/denoise", { method: "POST",
      body: JSON.stringify({ kind: k.kind, denoise: Number(slider.value) }) });
    const result = await response.json();
    if (result.error) alert(`Not saved: ${result.error}`);
    editing.delete(k.kind);
    cards.delete(k.kind);
    refresh();
  };
}

function openEditor(el, k) {
  if (editing.has(k.kind)) return;
  editing.add(k.kind);
  const prompt = el.querySelector(".prompt");
  const editor = document.createElement("div");
  editor.className = "editor";
  editor.innerHTML = `<textarea></textarea>
    <div class="row">
    <button class="primary save-retry">Save &amp; retry</button><button class="save">Save</button>
    <button class="cancel">Cancel</button></div>`;
  const area = editor.querySelector("textarea");
  area.value = k.prompt;
  prompt.replaceWith(editor);
  area.focus();
  const close = () => { editing.delete(k.kind); cards.delete(k.kind); refresh(); };
  const save = async retry => {
    const response = await fetch("/api/prompt", { method: "POST",
      body: JSON.stringify({ kind: k.kind, prompt: area.value }) });
    const result = await response.json();
    if (result.error) { alert(`Not saved: ${result.error}`); return; }
    if (retry) await fetch("/api/retry", { method: "POST", body: JSON.stringify({ kind: k.kind }) });
    close();
  };
  editor.querySelector(".save-retry").onclick = () => save(true);
  editor.querySelector(".save").onclick = () => save(false);
  editor.querySelector(".cancel").onclick = close;
  area.onkeydown = e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) save(true);
    if (e.key === "Escape") close();
  };
}

function render() {
  const list = document.getElementById("list");
  const picked = state.kinds.filter(k => k.pick).length;
  document.getElementById("stat").textContent =
    `${picked}/${state.kinds.length} picked · ${state.queue} queued` +
    (state.rendering ? ` · rendering ${state.rendering}${state.rendering_idle ? " (idle variation)" : ""}` : "") +
    (state.paused ? (state.rendering ? " · pausing after this one" : " · paused") : "");
  const pause = document.getElementById("pause");
  pause.textContent = state.paused ? "Resume queue" : "Pause queue";
  pause.classList.toggle("paused", state.paused);
  const shown = [];
  for (const k of state.kinds) {
    if (!visible(k)) continue;
    const key = JSON.stringify(k);
    let entry = cards.get(k.kind);
    if (!entry || (entry.key !== key && !editing.has(k.kind))) {
      entry = { key, el: card(k) };
      cards.set(k.kind, entry);
    }
    shown.push(entry.el);
  }
  // Reuse unchanged cards so images don't reload and the scroll position holds.
  shown.forEach((el, i) => { if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null); });
  while (list.children.length > shown.length) list.lastChild.remove();
}

async function refresh() {
  try { state = await (await fetch("/api/state")).json(); render(); } catch (e) {}
}

document.getElementById("pause").onclick = () => post("/api/pause", { paused: !state.paused });

document.getElementById("filters").onclick = e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  for (const b of e.currentTarget.children) b.classList.toggle("on", b === e.target);
  render();
};
document.getElementById("search").oninput = e => { search = e.target.value.trim(); render(); };
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
