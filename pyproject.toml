[project]
name = "roomplanner"
version = "0.1.0"
description = "Generator for Shadowrun/cyberpunk building battle maps"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "typer>=0.16",
]

[project.scripts]
roomplanner = "roomplanner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.135",
    "ruff>=0.12",
    "pyright>=1.1.403",
    "types-pyyaml>=6.0.12.20260906",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
