<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wuxing Building planner</title>
<style>
  :root {
    --bg: #14161b; --panel: #1c1f26; --line: #2c313b; --text: #d9dde5; --muted: #8a91a0;
    --accent: #3fd1c4; --error: #ff6b6b; --warn: #f5c35b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  aside {
    width: 270px; flex: none; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line); padding: 12px 14px 20px;
  }
  h1 { font-size: 15px; margin: 0 0 10px; letter-spacing: .04em; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 16px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px;
  }
  label.field { display: grid; grid-template-columns: 96px 1fr; align-items: center;
    gap: 6px; margin: 4px 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pair label.field { grid-template-columns: 1fr; gap: 1px; }
  input, select, button {
    font: inherit; color: var(--text); background: #12141a; border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 6px; min-width: 0; width: 100%;
  }
  input[type=checkbox] { width: auto; margin: 0; }
  button { cursor: pointer; width: auto; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b1514; border-color: var(--accent);
    font-weight: 600; width: 100%; padding: 7px; margin-top: 12px; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 6px; align-items: center; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .checks label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .layers label { display: flex; gap: 6px; align-items: center; margin: 3px 0; cursor: pointer; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  #status { color: var(--muted); }
  #status.error { color: var(--error); }
  #viewport { flex: 1; overflow: auto; position: relative; }
  #stage { position: relative; margin: 16px; }
  #stage img, #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage img { image-rendering: auto; }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
  #warnings { margin: 0; padding: 6px 12px 6px 28px; color: var(--warn);
    border-top: 1px solid var(--line); max-height: 90px; overflow-y: auto; }
  #warnings:empty { display: none; }
  #tip {
    position: fixed; pointer-events: none; background: rgba(12,14,18,.95); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; max-width: 280px;
    display: none; z-index: 10; font-size: 12px;
  }
  #tip b { color: var(--accent); }
  svg text { font-family: system-ui, sans-serif; pointer-events: none; }
  .room-hit { fill: transparent; cursor: crosshair; }
  .room-hit:hover { fill: rgba(63, 209, 196, .18); }
</style>
</head>
<body>
<aside>
  <h1 data-i18n="title">Wuxing Building planner</h1>
  <label class="field"><span data-i18n="language">Language</span> <select id="language"></select></label>
  <form id="form">
    <h2 data-i18n="h_building">Building</h2>
    <label class="field"><span data-i18n="type">Type</span> <select name="building_type"></select></label>
    <label class="field"><span data-i18n="room">Room</span> <select name="room"></select></label>
    <div class="pair">
      <label class="field"><span data-i18n="width">Width (cells)</span> <input name="width" type="number" min="1" value="48"></label>
      <label class="field"><span data-i18n="depth">Depth (cells)</span> <input name="depth" type="number" min="1" value="30"></label>
    </div>
    <div class="pair">
      <label class="field"><span data-i18n="floors_above">Floors above</span> <input name="floors_above" type="number" min="1" value="1"></label>
      <label class="field"><span data-i18n="basements">Basements</span> <input name="floors_below" type="number" min="0" value="0"></label>
    </div>
    <label class="field"><span data-i18n="layout">Layout</span> <select name="layout"></select></label>
    <label class="field"><span data-i18n="shape">Shape</span> <select name="shape"></select></label>
    <p id="osm-credit" hidden style="color:var(--muted);font-size:12px;margin:4px 0 8px"><span data-i18n="osm_credit">Shapes taken from real buildings:</span> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors (ODbL)</a></p>
    <label class="field"><span data-i18n="wealth">Wealth</span> <select name="wealth"></select></label>
    <label class="field"><span data-i18n="condition">Condition</span> <select name="condition"></select></label>
    <label class="field"><span data-i18n="security">Security</span> <select name="security"></select></label>

    <h2 data-i18n="h_site">Site</h2>
    <label class="field"><span data-i18n="street_side">Street side</span> <select name="street_side"></select></label>
    <label class="field"><span data-i18n="service_side">Service side</span> <select name="service_side"></select></label>
    <div class="row" style="margin:6px 0 2px">
      <input type="checkbox" id="entrances-override"><label for="entrances-override" data-i18n="override_entrances">Override entrances</label>
    </div>
    <div class="checks" id="entrances"></div>

    <h2 data-i18n="h_seed">Seed</h2>
    <div class="row">
      <input name="seed" type="number" min="0" placeholder="random" data-i18n-placeholder="random">
      <button type="button" class="reroll" data-target="seed" data-i18n-title="reroll">🎲</button>
    </div>
    <div class="row">
      <input name="rooms_seed" type="number" min="0" placeholder="Room seed = seed" data-i18n-placeholder="rooms_seed_ph">
      <button type="button" class="reroll" data-target="rooms_seed" data-i18n-title="reroll">🎲</button>
    </div>
    <div class="row">
      <input name="furniture_seed" type="number" min="0" placeholder="Furniture seed = seed" data-i18n-placeholder="furniture_seed_ph">
      <button type="button" class="reroll" data-target="furniture_seed" data-i18n-title="reroll">🎲</button>
    </div>
    <div class="row">
      <input name="security_seed" type="number" min="0" placeholder="Security seed = seed" data-i18n-placeholder="security_seed_ph">
      <button type="button" class="reroll" data-target="security_seed" data-i18n-title="reroll">🎲</button>
    </div>

    <h2 data-i18n="h_image">Image</h2>
    <label class="field"><span data-i18n="theme">Theme</span> <select name="theme"></select></label>
    <label class="field"><span data-i18n="cell_px">Pixels / cell</span> <input name="cell_px" type="number" min="4" max="100"></label>
    <div class="checks"><label><input type="checkbox" name="lighting" checked> <span data-i18n="lighting">Baked lighting</span></label></div>

    <button class="primary" id="go" type="submit" data-i18n="generate">Generate</button>
  </form>

  <h2 data-i18n="h_layers">Layers</h2>
  <div class="layers" id="layers"></div>
  <label class="field"><span data-i18n="grid_every">Grid every</span> <input id="grid-step" type="number" min="1" value="3"></label>
</aside>

<main>
  <header>
    <div class="tabs" id="floors"></div>
    <span class="spacer"></span>
    <span id="status"></span>
    <button type="button" id="zoom-out" data-i18n-title="zoom_out">−</button>
    <button type="button" id="zoom-fit" data-i18n="fit">Fit</button>
    <button type="button" id="zoom-in" data-i18n-title="zoom_in">+</button>
    <button type="button" id="dl-png" disabled data-i18n="image">Image</button>
    <button type="button" id="dl-json" disabled>JSON</button>
    <button type="button" id="dl-foundry" disabled
      data-i18n-title="foundry_title">Foundry</button>
  </header>
  <div id="viewport">
    <div id="empty" data-i18n="empty"></div>
    <div id="stage" hidden>
      <img id="map" alt="">
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <ul id="warnings"></ul>
</main>
<div id="tip"></div>

<script>
"use strict";
const SVG = "http://www.w3.org/2000/svg";
const M2_PER_CELL = 0.25;
const ROOM_LABEL_PX = 12;
const LAYERS = [  // key, on by default, swatch; the title is the UI text `layer_<key>`
  ["image", true, "#888"],
  ["rooms", false, "#6aa9ff"],
  ["walls", false, "#e8e8e8"],
  ["labels", true, "#ffffff"],
  ["units", false, "#c792ea"],
  ["openings", false, "#f5c35b"],
  ["locks", false, "#ff6b6b"],
  ["objects", false, "#9be37a"],
  ["devices", false, "#ff8a3d"],
  ["lights", false, "#fff3a0"],
  ["grid", false, "#7a8190"],
];
const $ = (id) => document.getElementById(id);
const form = $("form");
const state = { data: null, request: null, level: 0, zoom: null, layers: {}, lang: "en", i18n: {}, options: null, status: null };

// Texts: UI strings by key, names (rooms, objects, parameter values) by id, English as the fallback.
const humanize = (id) => String(id).replace(/_/g, " ");
const cat = () => state.i18n[state.lang] || {};
const t = (key) => cat().ui?.[key] ?? key;
const roomName = (id) => cat().rooms?.[id] ?? humanize(id);
const objectName = (id) => cat().objects?.[id] ?? humanize(id);
const term = (group, id) => cat().terms?.[group]?.[id] ?? humanize(id);
const levelName = (level) => {
  const f = cat().terms?.floor ?? {};
  return level === 0 ? f.ground : level > 0 ? f.above.replace("{n}", level) : f.basement.replace("{n}", -level);
};
function applyStaticTexts() {
  document.documentElement.lang = state.lang;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  for (const node of document.querySelectorAll("[data-i18n-title]")) node.title = t(node.dataset.i18nTitle);
  for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
  document.title = t("title");
}

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function recall(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }

// `label` turns a value into its text in the current language.
function fillSelect(name, values, selected, label = humanize, blank = null) {
  const select = form.elements[name];
  select.length = 0;
  if (blank) select.add(new Option(blank, ""));
  for (const v of values) select.add(new Option(label(v), v));
  select.value = selected;
}

// The selects whose texts depend on the language; `keep` overrides the values they keep.
function fillChoices(keep = {}) {
  const o = state.options;
  const pick = (name) => keep[name] ?? form.elements[name].value;
  const termOf = (group) => (v) => term(group, v);
  fillSelect("building_type", o.building_types, pick("building_type"), termOf("building_type"));
  fillSelect("shape", o.shape, pick("shape"), termOf("shape"));
  fillSelect("wealth", o.wealth, pick("wealth"), termOf("wealth"));
  fillSelect("condition", o.condition, pick("condition"), termOf("condition"));
  fillSelect("security", o.security, pick("security"), termOf("security"));
  fillSelect("street_side", o.sides, pick("street_side"), termOf("side"));
  fillSelect("service_side", o.sides, pick("service_side"), termOf("side"), t("opposite_of_street"));
  fillSelect("theme", o.themes, pick("theme"));
  fillSelect("layout", o.layouts, pick("layout"), (v) => t(`layout_${v}`), t("layout_default"));
  fillRooms(pick("room"));
  syncCredit();
  for (const label of $("entrances").querySelectorAll("label")) {
    label.lastChild.textContent = ` ${term("entrance", label.querySelector("input").value)}`;
  }
}

function renderLayerTitles() {
  for (const [key] of LAYERS) $("layers").querySelector(`[data-layer="${key}"] .title`).textContent = t(`layer_${key}`);
}

function setLanguage(lang) {
  state.lang = lang;
  store("roomplanner.lang", lang);
  $("language").value = lang;
  applyStaticTexts();
  if (state.options) { fillChoices(); renderLayerTitles(); }
  showStatus();
  if (state.data) { renderTabs(); renderWarnings(); draw(); }
}

async function init() {
  const options = await (await fetch("/api/options")).json();
  state.options = options;
  state.i18n = options.i18n;
  for (const lang of options.languages) $("language").add(new Option(lang.toUpperCase(), lang));
  const savedLang = recall("roomplanner.lang");
  state.lang = options.languages.includes(savedLang) ? savedLang
    : navigator.language.startsWith("de") && options.languages.includes("de") ? "de" : options.defaults.language;
  $("language").value = state.lang;
  applyStaticTexts();
  form.elements.cell_px.value = options.defaults.cell_px;
  for (const kind of options.entrances) {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" value="${kind}" ${kind === "main" ? "checked" : ""}> `;
    label.append(document.createTextNode(""));
    $("entrances").append(label);
  }
  rooms = options.rooms;
  fillChoices({ building_type: "office", shape: "rectangle", wealth: "middle", condition: "maintained",
    security: "low", street_side: "S", service_side: "", theme: options.defaults.theme, room: "", layout: "" });
  restoreForm();
  fillRooms(recall("roomplanner.form")?.room || "");
  syncEntrances();
  showStatus();

  const saved = recall("roomplanner.layers") || {};
  for (const [key, on, swatch] of LAYERS) {
    state.layers[key] = key in saved ? saved[key] : on;
    const label = document.createElement("label");
    label.dataset.layer = key;
    label.innerHTML = `<input type="checkbox" ${state.layers[key] ? "checked" : ""}>
      <span class="swatch" style="background:${swatch}"></span><span class="title"></span>`;
    label.querySelector("input").addEventListener("change", (e) => {
      state.layers[key] = e.target.checked;
      store("roomplanner.layers", state.layers);
      draw();
    });
    $("layers").append(label);
  }
  renderLayerTitles();
}
$("language").addEventListener("change", (e) => setLanguage(e.target.value));

let rooms = {};

// The building type's room types; one picked generates only that room, width x depth.
function fillRooms(selected = form.elements.room.value) {
  const select = form.elements.room;
  fillSelect("room", rooms[form.elements.building_type.value] || [], "", roomName, t("whole_building"));
  if ([...select.options].some((o) => o.value === selected)) select.value = selected;
  syncRoom();
}
function syncRoom() {
  const lone = form.elements.room.value !== "";
  for (const name of ["floors_above", "floors_below", "shape"]) form.elements[name].disabled = lone;
}
// Layout and footprint taken from OpenStreetMap need its credit (ODbL).
function syncCredit() {
  $("osm-credit").hidden = form.elements.layout.value !== "partition_osm" && form.elements.shape.value !== "osm";
}
form.elements.layout.addEventListener("change", syncCredit);
form.elements.shape.addEventListener("change", syncCredit);
form.elements.building_type.addEventListener("change", () => fillRooms());
form.elements.room.addEventListener("change", syncRoom);

function syncEntrances() {
  const on = $("entrances-override").checked;
  for (const box of $("entrances").querySelectorAll("input")) box.disabled = !on;
  $("entrances").style.opacity = on ? 1 : .45;
}
$("entrances-override").addEventListener("change", syncEntrances);

function formValues() {
  const f = form.elements;
  const params = {
    building_type: f.building_type.value,
    width: +f.width.value, depth: +f.depth.value,
    floors_above: +f.floors_above.value, floors_below: +f.floors_below.value,
    shape: f.shape.value, wealth: f.wealth.value, condition: f.condition.value,
    security: f.security.value, street_side: f.street_side.value,
    service_side: f.service_side.value || null,
    room: f.room.value || null,
    layout: f.layout.value || null,
    seed: f.seed.value === "" ? null : +f.seed.value,
    rooms_seed: f.rooms_seed.value === "" ? null : +f.rooms_seed.value,
    furniture_seed: f.furniture_seed.value === "" ? null : +f.furniture_seed.value,
    security_seed: f.security_seed.value === "" ? null : +f.security_seed.value,
  };
  if ($("entrances-override").checked) {
    params.entrances = [...$("entrances").querySelectorAll("input:checked")].map((b) => b.value);
  }
  return {
    params, theme: f.theme.value, cell_px: +f.cell_px.value, lighting: f.lighting.checked,
    lang: state.lang,
  };
}

function saveForm() {
  const values = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    values[el.name] = el.type === "checkbox" ? el.checked : el.value;
  }
  values.entrances_override = $("entrances-override").checked;
  values.entrances = [...$("entrances").querySelectorAll("input:checked")].map((b) => b.value);
  store("roomplanner.form", values);
}

function restoreForm() {
  const values = recall("roomplanner.form");
  if (!values) return;
  for (const el of form.elements) {
    if (!el.name || !(el.name in values)) continue;
    if (el.type === "checkbox") el.checked = values[el.name]; else el.value = values[el.name];
  }
  $("entrances-override").checked = !!values.entrances_override;
  for (const box of $("entrances").querySelectorAll("input")) {
    box.checked = (values.entrances || []).includes(box.value);
  }
}

async function generate() {
  const request = formValues();
  saveForm();
  $("go").disabled = true;
  setStatus("generating");
  const started = performance.now();
  try {
    const response = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(request),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || response.statusText);
    const levels = body.building.floors.map((f) => f.level);
    state.data = body;
    state.request = { ...request, params: { ...request.params, seed: body.building.seed } };
    if (!levels.includes(state.level)) state.level = levels.includes(0) ? 0 : levels[0];
    const b = body.building;
    const ms = Math.round(performance.now() - started);
    setStatus(() => `${term("building_type", b.params.building_type)} · ${b.width}×${b.height} ${t("cells")} ` +
      `(${b.width * 0.5}×${b.height * 0.5} m) · ${t("seed_word")} ${b.seed} · ${ms} ms`);
    renderTabs();
    renderWarnings();
    $("dl-png").disabled = $("dl-json").disabled = $("dl-foundry").disabled = false;
    $("empty").hidden = true;
    $("stage").hidden = false;
    draw();
  } catch (error) {
    setStatus(() => error.message, true);
  } finally {
    $("go").disabled = false;
  }
}

form.addEventListener("submit", (e) => { e.preventDefault(); generate(); });
document.querySelectorAll(".reroll").forEach((button) => button.addEventListener("click", () => {
  form.elements[button.dataset.target].value = Math.floor(Math.random() * 2 ** 32);
  generate();
}));

// `text` is a UI key or a function making the message; it is redrawn when the language changes.
function setStatus(text, error = false) {
  state.status = { text, error };
  showStatus();
}
function showStatus() {
  const { text, error } = state.status || { text: "status_idle", error: false };
  $("status").textContent = typeof text === "function" ? text() : t(text);
  $("status").classList.toggle("error", error);
}

function renderTabs() {
  const tabs = $("floors");
  tabs.innerHTML = "";
  const floors = [...state.data.building.floors].sort((a, b) => b.level - a.level);
  for (const floor of floors) {
    const button = document.createElement("button");
    button.textContent = levelName(floor.level);
    button.title = floor.role ? `${t("role")}: ${floor.role}` : "";
    button.classList.toggle("active", floor.level === state.level);
    button.addEventListener("click", () => { state.level = floor.level; renderTabs(); draw(); });
    tabs.append(button);
  }
}

function renderWarnings() {
  const list = $("warnings");
  list.innerHTML = "";
  for (const warning of state.data.building.warnings) {
    const item = document.createElement("li");
    item.textContent = warning;
    list.append(item);
  }
}

// --- drawing ----------------------------------------------------------------------------

function hue(text) {
  let h = 0;
  for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}

function el(name, attrs = {}, parent = null) {
  const node = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.append(node);
  return node;
}

function cellsPath(cells) {
  return cells.map(([x, y]) => `M${x} ${y}h1v1h-1z`).join("");
}

function edgeCoords([x, y, axis]) {
  return axis === "h" ? [x, y, x + 1, y] : [x, y, x, y + 1];
}

function edgesPath(edges) {
  return edges.map((e) => { const [a, b, c, d] = edgeCoords(e); return `M${a} ${b}L${c} ${d}`; })
    .join("");
}

function centre(cells) {
  const cx = cells.reduce((s, c) => s + c[0], 0) / cells.length;
  const cy = cells.reduce((s, c) => s + c[1], 0) / cells.length;
  let best = cells[0], dist = Infinity;
  for (const c of cells) {
    const d = (c[0] + .5 - cx) ** 2 + (c[1] + .5 - cy) ** 2;
    if (d < dist) { dist = d; best = c; }
  }
  return [best[0] + .5, best[1] + .5];
}

function bounds(cells) {
  const xs = cells.map((c) => c[0]), ys = cells.map((c) => c[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs) + 1, Math.max(...ys) + 1];
}

function label(group, x, y, lines, size, colour = "#fff") {
  const text = el("text", {
    x, y, "font-size": size, "text-anchor": "middle", fill: colour,
    stroke: "rgba(0,0,0,.75)", "stroke-width": size * .18, "paint-order": "stroke",
  }, group);
  lines.forEach(([content, scale, weight], i) => {
    const span = el("tspan", {
      x, dy: i === 0 ? `${-(lines.length - 1) * .55}em` : "1.1em",
      "font-size": size * scale, "font-weight": weight || "normal",
    }, text);
    span.textContent = content;
  });
}

function draw() {
  const data = state.data;
  if (!data) return;
  const b = data.building;
  const floor = b.floors.find((f) => f.level === state.level);
  const pad = data.padding;
  const cols = b.width + 2 * pad, rows = b.height + 2 * pad;
  if (state.zoom === null) fit();
  const stage = $("stage");
  stage.style.width = `${cols * state.zoom}px`;
  stage.style.height = `${rows * state.zoom}px`;

  const img = $("map");
  img.src = data.images[String(floor.level)];
  img.hidden = !state.layers.image;

  const svg = $("overlay");
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `${-pad} ${-pad} ${cols} ${rows}`);
  if (!state.layers.image) el("rect", { x: -pad, y: -pad, width: cols, height: rows, fill: "#101217" }, svg);
  const L = state.layers;

  if (L.rooms) {
    const g = el("g", { "fill-opacity": L.image ? .35 : .55 }, svg);
    for (const room of floor.rooms) {
      el("path", { d: cellsPath(room.cells), fill: `hsl(${hue(room.type)} 55% 50%)` }, g);
    }
  }
  if (L.units) {
    const g = el("g", {}, svg);
    for (const room of floor.rooms) {
      if (!room.unit) continue;
      el("path", { d: cellsPath(room.cells), fill: `hsl(${hue(room.unit)} 70% 60%)`,
        "fill-opacity": .3 }, g);
    }
  }
  if (L.grid) {
    const step = Math.max(1, +$("grid-step").value || 1);
    let d = "";
    for (let x = 0; x <= b.width; x += step) d += `M${x} 0V${b.height}`;
    for (let y = 0; y <= b.height; y += step) d += `M0 ${y}H${b.width}`;
    el("path", { d, stroke: "rgba(200,210,230,.35)", "stroke-width": .05, fill: "none" }, svg);
  }
  if (L.lights) {
    const g = el("g", {}, svg);
    for (const light of floor.lights) {
      const id = `l${Math.random().toString(36).slice(2)}`;
      const grad = el("radialGradient", { id }, g);
      const alpha = light.state === "off" ? 0 : .45 * light.intensity;
      el("stop", { offset: 0, "stop-color": light.colour, "stop-opacity": alpha }, grad);
      el("stop", { offset: 1, "stop-color": light.colour, "stop-opacity": 0 }, grad);
      el("circle", { cx: light.x, cy: light.y, r: light.radius, fill: `url(#${id})` }, g);
      el("circle", { cx: light.x, cy: light.y, r: .25, fill: light.colour,
        stroke: light.state === "on" ? "#000" : "#f00", "stroke-width": .08,
        "stroke-dasharray": light.state === "flicker" ? ".1 .1" : "none" }, g)
        .append(title(`${humanize(light.kind)} ${t("light_word")} · ${light.state} · r ${light.radius}`));
    }
  }
  if (L.objects) {
    const g = el("g", {}, svg);
    for (const obj of floor.objects) {
      el("rect", { x: obj.x + .05, y: obj.y + .05, width: obj.w - .1, height: obj.h - .1,
        fill: obj.blocking === false ? "rgba(155,227,122,.08)" : "rgba(155,227,122,.22)",
        stroke: "#9be37a", "stroke-width": .06, rx: .1 }, g)
        .append(title(`${objectName(obj.kind)} (${obj.w}×${obj.h}, ${t("faces")} ${term("side", obj.facing)})`));
      // Front marker: a tick on the side the object faces.
      const [fx, fy] = { N: [obj.x + obj.w / 2, obj.y], S: [obj.x + obj.w / 2, obj.y + obj.h],
        E: [obj.x + obj.w, obj.y + obj.h / 2], W: [obj.x, obj.y + obj.h / 2] }[obj.facing];
      el("circle", { cx: fx, cy: fy, r: .12, fill: "#9be37a" }, g);
      const name = objectName(obj.kind);
      const size = Math.min(.55, (obj.w * 1.6) / Math.max(4, name.length));
      if (size >= .22) {
        label(g, obj.x + obj.w / 2, obj.y + obj.h / 2 + size * .35,
          [[name, 1]], size, "#d8f7c6");
      }
    }
  }
  if (L.walls) {
    el("path", { d: edgesPath(floor.walls), stroke: "#e8e8e8", "stroke-width": .18,
      "stroke-linecap": "square", fill: "none" }, svg);
  }
  if (L.openings) {
    const g = el("g", { fill: "none", "stroke-linecap": "butt" }, svg);
    for (const o of floor.openings) {
      const colour = { door: "#f5c35b", window: "#5ec8ff", breach: "#c08a5b" }[o.kind];
      const path = el("path", { d: edgesPath(o.edges), stroke: colour, "stroke-width": .32,
        "stroke-dasharray": o.kind === "breach" || o.state === "missing" ? ".2 .15" : "none",
        opacity: o.state === "blocked" ? .5 : 1 }, g);
      path.append(title(describeOpening(o)));
      if (o.kind === "door" && o.state === "blocked") {
        const [x0, y0, x1, y1] = runCoords(o.edges);
        el("path", { d: `M${x0} ${y0}L${x1} ${y1}`, stroke: "#ff3b3b", "stroke-width": .1 }, g);
      }
    }
  }
  if (L.devices) {
    const g = el("g", {}, svg);
    for (const d of floor.devices) {
      const cx = d.x + .5, cy = d.y + .5;
      const [dx, dy] = { N: [0, -1], S: [0, 1], E: [1, 0], W: [-1, 0] }[d.facing];
      el("path", { d: `M${cx} ${cy}L${cx + dx * .7} ${cy + dy * .7}`, stroke: "#ff8a3d",
        "stroke-width": .1 }, g);
      el("circle", { cx, cy, r: .38, fill: "#2a1508", stroke: "#ff8a3d", "stroke-width": .08 }, g)
        .append(title(`${humanize(d.kind)} · ${t("rating")} ${d.rating} · ${t("faces")} ${term("side", d.facing)}`));
      label(g, cx, cy + .16, [[d.kind[0].toUpperCase(), 1, "bold"]], .45, "#ffb27a");
    }
  }
  if (L.locks) {
    const g = el("g", {}, svg);
    for (const o of floor.openings) {
      if (o.kind !== "door" || (!o.lock && !o.entrance)) continue;
      const [x0, y0, x1, y1] = runCoords(o.edges);
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
      const text = [o.entrance ? term("entrance", o.entrance).toUpperCase() : null,
        o.lock ? `${o.lock}${o.rating ? " " + o.rating : ""}` : null].filter(Boolean).join(" · ");
      el("circle", { cx: mx, cy: my, r: .2, fill: o.lock ? "#ff6b6b" : "#f5c35b" }, g);
      label(g, mx, my - .45, [[text, 1, "bold"]], .5, o.entrance ? "#ffe08a" : "#ffb0b0");
    }
  }
  if (L.labels) {
    const g = el("g", {}, svg);
    const size = ROOM_LABEL_PX / state.zoom;  // the same on screen for every room and zoom
    for (const room of floor.rooms) {
      const name = roomName(room.type);
      const [cx, cy] = centre(room.cells);
      const lines = [[name, 1, "600"], [`${room.id} · ${room.cells.length * M2_PER_CELL} m²`, .8]];
      if (room.unit) lines.push([`${t("unit")} ${room.unit}`, .8]);
      label(g, cx, cy, lines, size);
    }
  }
  // Hover targets for the room tooltip, on top of everything.
  const hits = el("g", {}, svg);
  for (const room of floor.rooms) {
    const path = el("path", { d: cellsPath(room.cells), class: "room-hit" }, hits);
    path.addEventListener("mousemove", (e) => showTip(e, roomInfo(room, floor)));
    path.addEventListener("mouseleave", hideTip);
  }
}

function runCoords(edges) {
  const first = edgeCoords(edges[0]), last = edgeCoords(edges[edges.length - 1]);
  return [first[0], first[1], last[2], last[3]];
}

function describeOpening(o) {
  const parts = [`${term("word", o.kind)} (${o.edges.length} ${t("cells")})`];
  if (o.state) parts.push(o.state);
  if (o.material) parts.push(o.material);
  if (o.lock) parts.push(`${t("lock")}: ${o.lock}${o.rating ? " " + o.rating : ""}`);
  if (o.entrance) parts.push(`${term("entrance", o.entrance)} (${t("entrance_word")})`);
  return parts.join(" · ");
}

function title(text) {
  const node = document.createElementNS(SVG, "title");
  node.textContent = text;
  return node;
}

function roomInfo(room, floor) {
  const counts = {};
  for (const obj of floor.objects) {
    if (obj.room === room.id) counts[obj.kind] = (counts[obj.kind] || 0) + 1;
  }
  const devices = floor.devices.filter((d) => d.room === room.id).map((d) => humanize(d.kind));
  const [x0, y0, x1, y1] = bounds(room.cells);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  let html = `<b>${esc(roomName(room.type))}</b> <span style="color:var(--muted)">${esc(room.id)}</span><br>` +
    `${room.cells.length} ${t("cells")} · ${room.cells.length * M2_PER_CELL} m² · ` +
    `${(x1 - x0) * .5}×${(y1 - y0) * .5} m ${t("box")}`;
  if (room.unit) html += `<br>${esc(t("unit"))} ${esc(room.unit)}`;
  const furniture = Object.entries(counts).map(([k, n]) => (n > 1 ? `${n}× ` : "") + objectName(k));
  if (furniture.length) html += `<br>${esc(furniture.join(", "))}`;
  if (devices.length) html += `<br><span style="color:#ff8a3d">${esc(devices.join(", "))}</span>`;
  return html;
}

function showTip(event, html) {
  const tip = $("tip");
  tip.innerHTML = html;
  tip.style.display = "block";
  const x = Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = Math.min(event.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}
function hideTip() { $("tip").style.display = "none"; }

// --- zoom & downloads -------------------------------------------------------------------

function fit() {
  const b = state.data.building, pad = state.data.padding;
  const vp = $("viewport");
  const zx = (vp.clientWidth - 32) / (b.width + 2 * pad);
  const zy = (vp.clientHeight - 32) / (b.height + 2 * pad);
  state.zoom = Math.max(2, Math.min(zx, zy));
}
function zoomBy(factor) {
  if (!state.data) return;
  state.zoom = Math.max(2, Math.min(200, state.zoom * factor));
  draw();
}
$("zoom-in").addEventListener("click", () => zoomBy(1.25));
$("zoom-out").addEventListener("click", () => zoomBy(1 / 1.25));
$("zoom-fit").addEventListener("click", () => { if (state.data) { fit(); draw(); } });
$("viewport").addEventListener("wheel", (e) => {
  if (!e.ctrlKey || !state.data) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });
$("grid-step").addEventListener("input", draw);

function download(name, href) {
  const a = document.createElement("a");
  a.href = href;
  a.download = name;
  a.click();
}
function stem() {
  const b = state.data.building;
  return `${b.params.building_type}_${b.seed}`;
}
$("dl-json").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state.data.building)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  download(`${stem()}.json`, url);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$("dl-png").addEventListener("click", () => {
  const level = state.level;
  const tag = level >= 0 ? `F${level}` : `B${-level}`;
  download(`${stem()}_${tag}.webp`, state.data.images[String(level)]);
});

$("dl-foundry").addEventListener("click", async () => {
  const button = $("dl-foundry");
  button.disabled = true;
  setStatus("exporting");
  try {
    // The same parameters with the seed that was used: the same building, rendered for a VTT.
    const response = await fetch("/api/export/foundry", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...state.request, lang: state.lang }),
    });
    if (!response.ok) throw new Error((await response.json()).error || response.statusText);
    const name = /filename="([^"]+)"/.exec(response.headers.get("Content-Disposition"))[1];
    const url = URL.createObjectURL(await response.blob());
    download(name, url);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus(() => `${name}: ${t("exported")}`);
  } catch (error) {
    setStatus(() => error.message, true);
  } finally {
    button.disabled = false;
  }
});

init().catch((error) => setStatus(() => `${t("options_failed")}: ${error.message}`, true));
</script>
</body>
</html>
