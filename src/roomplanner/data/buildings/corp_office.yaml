# Units are cells: lengths in cells, areas in number of cells.
# Corp branch office: checkpoint lobby, cubicle floors, server room, executive suite on top.
building: corp_office
catalogs: [common, office, industry]
layout: corridor

corridor:
  width: 4
  hallway_width: 3
strip_depth: [10, 16]
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [4, 4], when: "floors_total >= 2"}
  - {room: elevator, size: [4, 4], when: "floors_total >= 2 and width + depth >= 100"}   # bigger floors: more cars
  - {room: elevator, size: [4, 4], when: "floors_total >= 2 and width + depth >= 150"}

entrances:
  main: {width: 4}
  service: {width: 2}
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: corp_lobby, place: entrance, area: [100, 220], priority: required}
      - {room: security_room, count: 1, near: entrance, priority: required}
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: meeting_room, count: [1, 3]}
      - {room: server_room, count: 1}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: generator_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: spider_room, count: 1, near: core, security: [corporate, aaa], priority: optional}
      - {room: host_room, count: 1, when: "floors_below == 0", security: [corporate, aaa], priority: optional}
      - {room: vault, count: [0, 1], when: "floors_below == 0", security: [corporate, aaa], priority: optional}
      - {room: drone_bay, count: 1, near: service, when: "floors_below == 0", security: [corporate, aaa], priority: optional}
      - {room: archive, count: [0, 1], area: [60, 120], when: "floors_below == 0"}
      - {room: office, fill: true}
      - {room: meeting_room, fill: true}      # interior rows without facade
      - {room: huddle_room, fill: true}      # thin interior rows: huddle and focus rooms,
      - {room: focus_room, fill: true, weight: 0.5}   # a copy room and a break room
      - {room: staff_room, fill: true, limit: 1}
      - {room: copy_room, fill: true, limit: 1}
  executive:
    applies: [top]
    when: "floors_above >= 3"
    rooms:
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: board_room, count: 1, priority: required}
      - {room: security_room, count: 1, near: core}
      - {room: kitchenette, count: 1, near: core}
      - {room: executive_quarters, count: [0, 1], priority: optional}
      - {room: safe_room, count: 1, priority: optional}
      - {room: executive_office, fill: true}
      - {room: meeting_room, fill: true}      # interior rows without facade
      - {room: huddle_room, fill: true}      # thin interior rows: huddle and focus rooms,
      - {room: focus_room, fill: true, weight: 0.5}   # a copy room and a break room
      - {room: staff_room, fill: true, limit: 1}
      - {room: copy_room, fill: true, limit: 1}
  cubicles:
    applies: [upper, top]
    rooms:
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: kitchenette, count: 1, near: core}
      - {room: meeting_room, count: [1, 3]}
      - {room: cubicle_farm, share: 0.5}
      - {room: network_closet, count: [0, 1], near: core, priority: optional}
      - {room: office, fill: true}
      - {room: meeting_room, fill: true}      # interior rows without facade
      - {room: huddle_room, fill: true}      # thin interior rows: huddle and focus rooms,
      - {room: focus_room, fill: true, weight: 0.5}   # a copy room and a break room
      - {room: staff_room, fill: true, limit: 1}
      - {room: copy_room, fill: true, limit: 1}
  basement:
    applies: [basement]
    rooms:
      - {room: server_room, count: 1, priority: required}
      - {room: utility, count: 1, priority: required}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: generator_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: mechanical_room, count: [0, 1], when: "level + 1 == 0", priority: optional}
      - {room: host_room, count: 1, when: "level + 1 == 0", security: [corporate, aaa], priority: optional}
      - {room: vault, count: [0, 1], when: "level + 1 == 0", security: [corporate, aaa], priority: optional}
      - {room: drone_bay, count: 1, when: "level + 1 == 0", security: [corporate, aaa], priority: optional}
      - {room: archive, count: [0, 1], area: [60, 120]}
      - {room: storage, count: [0, 1], near: core}
      - {room: server_room, fill: true}
      - {room: mechanical_room, fill: true}
