# Units are cells: lengths in cells, areas in number of cells.
building: apartment
catalogs: [common, residential]
layout: corridor

corridor:
  width: 3
  hallway_width: 3
strip_depth: [14, 22]      # apartments reach from the corridor to the facade
facade:
  module: 3
  window: 2
cluster_filler: storage
service_stub: true         # a back room to the yard (parcel drones, laundry), not a flat
service_rooms: [drone_bay, laundry, storage, utility]

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2 and width + depth >= 90", place: far}   # second escape route
  - {room: elevator, size: [4, 4], when: "floors_total >= 5"}
  - {room: elevator, size: [4, 4], when: "floors_total >= 5 and width + depth >= 100"}   # bigger floors: more cars
  - {room: elevator, size: [4, 4], when: "floors_total >= 5 and width + depth >= 150"}

entrances:
  main: {width: 2}
  service: {width: 2}
  emergency: {width: 2}
  roof: {width: 2}

units:
  apartment:
    hall: hallway
    front: [bathroom, kitchen]
    back: [living_room]
    back_fill: bedroom
    front_fill: closet
  studio:
    hall: hallway
    front: [bathroom, kitchen]
    back: [living_room]
    front_fill: closet

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: mailroom, count: 1, near: entrance}
      - {room: security_room, count: 1, near: entrance, security: [aaa]}   # concierge
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: vending_room, count: [0, 1], near: entrance, wealth: [squatter, low, middle], priority: optional}
      - {room: storage, count: [0, 1], near: core, priority: optional, when: "floors_below == 0"}
      - {room: apartment, fill: true}
      - {room: studio, fill: true, priority: optional}   # widths too narrow for a flat
      - {room: laundry, fill: true}            # interior rows without facade
      - {room: drone_bay, fill: true}          # parcel drones
      - {room: mechanical_room, fill: true}
  residential:
    applies: [upper, top]
    rooms:
      - {room: apartment, fill: true}
      - {room: studio, fill: true, priority: optional}   # widths too narrow for a flat
      - {room: laundry, fill: true}            # interior rows without facade
      - {room: mechanical_room, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: utility, count: 1, priority: required}
      - {room: laundry, count: 1, wealth: [low, middle, high, luxury]}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: mechanical_room, count: [0, 1], when: "level + 1 == 0", wealth: [middle, high, luxury], priority: optional}
      - {room: car_park, place: end, area: [900, 1800], when: "level + 1 == 0 and width + depth >= 80"}   # guests, tenants, staff
      - {room: storage, count: [1, 2], near: core}
      - {room: laundry, count: [0, 1]}
      - {room: storage, fill: true}       # tenants' cellar boxes, most of the basement

wealth:
  squatter: {area: 0.7, corridor: 1.0, furniture: 0.5}
