# Units are cells: lengths in cells, areas in number of cells.
# Chop shop (a warehouse variant): a workshop hall with cars on lifts and parts everywhere,
# an office, a paint booth and parts storage at the back.
building: chop_shop
catalogs: [common, office, retail, industry]
layout: hall

corridor:
  width: 3
  hallway_width: 3
strip_depth: [8, 12]
hall:
  min_depth: 14
  corridor_from: 48        # smaller shops: back rooms open onto the workshop
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 9], when: "floors_total >= 2"}

entrances:
  main: {width: 2}
  service: {width: 2}      # back door; the workshop has its own roller door
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: workshop_floor, place: hall}
      - {room: shipping_office, count: 1, priority: required}
      - {room: paint_booth, count: [0, 1]}
      - {room: wc, count: 1, near: core}
      - {room: staff_room, count: [0, 1]}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: rigger_workshop, count: [0, 1], priority: optional}
      - {room: contraband_store, count: [0, 1], priority: optional}
      - {room: stockroom, fill: true}          # stolen parts
      - {room: paint_booth, fill: true}
  upper:
    applies: [upper, top]
    rooms:
      - {room: stockroom, place: hall}
      - {room: office, count: [0, 1]}
      - {room: rigger_workshop, count: [0, 1], priority: optional}
      - {room: staff_room, fill: true}
      - {room: office, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: stockroom, place: hall}
      - {room: utility, count: 1, priority: required}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: contraband_store, count: [0, 1], priority: optional}
      - {room: rigger_workshop, count: [0, 1], priority: optional}
      - {room: storage, count: [0, 1], near: core}
      - {room: mechanical_room, fill: true}
