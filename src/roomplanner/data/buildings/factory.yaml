# Units are cells: lengths in cells, areas in number of cells.
# Factory: production hall with conveyors and machines; control room, offices, lockers,
# canteen and loading dock at the back.
building: factory
catalogs: [common, office, retail, hospitality, industry]
layout: hall

corridor:
  width: 4
  hallway_width: 3
strip_depth: [8, 14]
hall:
  min_depth: 16
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [6, 8], when: "floors_total >= 2"}   # freight lift

entrances:
  main: {width: 2}         # the staff entrance
  service: {width: 8}      # trucks
  emergency: {width: 3}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: factory_floor, place: hall}
      - {room: loading_bay, count: [1, 2], near: service, priority: required}
      - {room: control_room, count: 1}
      - {room: toilet, count: 1, near: core, priority: required}
      - {room: locker_room, count: [1, 2]}
      - {room: staff_room, count: 1}
      - {room: shipping_office, count: 1}
      - {room: paint_booth, count: [0, 1]}
      - {room: security_room, count: 1, security: [corporate, aaa]}
      - {room: storage, fill: true}
  upper:
    applies: [upper, top]
    rooms:
      - {room: factory_floor, place: hall}
      - {room: toilet, count: 1, near: core}
      - {room: control_room, count: [0, 1]}
      - {room: office, count: [0, 3]}
      - {room: storage, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: stockroom, place: hall}
      - {room: utility, count: [1, 2], priority: required}
      - {room: storage, fill: true}
