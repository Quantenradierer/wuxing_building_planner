building: office
catalogs: [common, office]
layout: corridor

corridor:
  width_m: 2.0
  hallway_width_m: 1.5
strip_depth_m: [5, 9]      # depth of a row of rooms between corridor and facade
facade:
  module_m: 2.0            # partitions along facades snap to this grid
  window_m: 1.0            # one window centred in each module
cluster_filler: storage    # fills leftover space next to toilet/storage clusters

core:
  - {room: stairwell, size_m: [2.5, 5], when: "floors_total >= 2"}
  - {room: elevator, size_m: [2, 2], when: "floors_total >= 3"}

entrances:
  main: {width_m: 2.0}
  service: {width_m: 1.0}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: lobby, place: entrance, area_m2: [20, 40], priority: required}
      - {room: toilet, count: [1, 2], near: core, priority: required}
      - {room: meeting_room, count: [0, 1]}
      - {room: storage, count: 1, priority: optional}
      - {room: office, fill: true}
      - {room: storage, fill: true}           # interior rows without facade
  standard:
    applies: [upper, top]
    rooms:
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: kitchenette, count: 1, near: core}
      - {room: meeting_room, count: [1, 3]}
      - {room: open_office, share: 0.4}
      - {room: storage, count: [0, 1], priority: optional}
      - {room: office, fill: true}
      - {room: meeting_room, fill: true}      # interior rows without facade
      - {room: archive, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: utility, count: 1, priority: required}
      - {room: server_room, count: [0, 1]}
      - {room: archive, count: [0, 1]}
      - {room: storage, fill: true}
