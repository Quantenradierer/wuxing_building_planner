# Units are cells: lengths in cells, areas in number of cells.
building: office
catalogs: [common, office]
layout: corridor

corridor:
  width: 4
  hallway_width: 3
strip_depth: [10, 14]      # depth of a row of rooms between corridor and facade
facade:
  module: 3                # partitions along facades snap to this grid (1.5 m)
  window: 2                # one window per module; partitions may touch its ends
cluster_filler: storage    # fills leftover space next to toilet/storage clusters

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [4, 4], when: "floors_total >= 3"}
  - {room: elevator, size: [4, 4], when: "floors_total >= 3 and width + depth >= 100"}   # bigger floors: more cars
  - {room: elevator, size: [4, 4], when: "floors_total >= 3 and width + depth >= 150"}

entrances:
  main: {width: 4}
  service: {width: 2}
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: lobby, place: entrance, area: [80, 160], priority: required, wealth: [squatter, low, middle, high]}
      - {room: lobby, place: entrance, area: [150, 300], priority: required, wealth: [luxury]}
      - {room: toilet, count: 1, near: core, priority: required}
      - {room: toilet, share: 0.03}          # more toilets on bigger floors
      - {room: meeting_room, count: [0, 1]}
      - {room: security_room, count: 1, near: entrance, priority: required, security: [corporate, aaa]}
      - {room: storage, count: 1, priority: optional, when: "floors_below == 0"}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: spider_room, count: 1, security: [corporate, aaa], priority: optional}
      - {room: drone_bay, count: [0, 1], when: "floors_below == 0", security: [aaa], priority: optional}
      - {room: archive, count: [0, 1], area: [60, 120], when: "floors_below == 0"}
      - {room: office, fill: true}
      - {room: meeting_room, fill: true}      # interior rows without facade
      - {room: focus_room, fill: true}        # thin interior rows
      - {room: copy_room, fill: true, priority: optional}
  executive:
    applies: [top]
    when: "floors_above >= 3"
    wealth: [high, luxury]
    rooms:
      - {room: toilet, count: 1, near: core, priority: required}
      - {room: toilet, share: 0.03}
      - {room: board_room, count: 1, priority: required}
      - {room: kitchenette, count: 1, near: core}
      - {room: meeting_room, count: [1, 2]}
      - {room: executive_quarters, count: [0, 1], priority: optional}
      - {room: safe_room, count: [0, 1], security: [corporate, aaa], priority: optional}
      - {room: executive_office, fill: true}
      - {room: meeting_room, fill: true}      # interior rows without facade
      - {room: focus_room, fill: true}        # thin interior rows
      - {room: copy_room, fill: true, priority: optional}
  standard:
    applies: [upper, top]
    rooms:
      - {room: toilet, count: 1, near: core, priority: required}
      - {room: toilet, share: 0.03}
      - {room: kitchenette, count: 1, near: core, wealth: [low, middle, high, luxury]}
      - {room: meeting_room, count: [1, 3], wealth: [middle, high, luxury]}
      - {room: meeting_room, count: [0, 1], wealth: [squatter, low]}
      - {room: open_office, share: 0.6, wealth: [squatter, low]}
      - {room: open_office, share: 0.4, wealth: [middle, high]}
      - {room: open_office, share: 0.2, wealth: [luxury]}
      - {room: network_closet, count: [0, 1], near: core, priority: optional}
      - {room: office, fill: true}
      - {room: meeting_room, fill: true}      # interior rows without facade
      - {room: focus_room, fill: true}        # thin interior rows
      - {room: copy_room, fill: true, priority: optional}
  basement:
    applies: [basement]
    rooms:
      - {room: utility, count: 1, priority: required}
      - {room: server_room, count: [0, 1]}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: mechanical_room, count: [0, 1], when: "level + 1 == 0", priority: optional}
      - {room: generator_room, count: [0, 1], when: "level + 1 == 0", priority: optional}
      - {room: drone_bay, count: [0, 1], when: "level + 1 == 0", security: [aaa], priority: optional}
      - {room: archive, count: [0, 1], area: [60, 120]}
      - {room: storage, count: 1, near: core}
      - {room: server_room, fill: true}
      - {room: mechanical_room, fill: true}
