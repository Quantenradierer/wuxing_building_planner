# Units are cells: lengths in cells, areas in number of cells.
# Stuffer Shack: a 24-hour convenience store, one small sales floor and a stock room.
building: stuffer_shack
catalogs: [common, retail, industry]
layout: hall

corridor:
  width: 3
  hallway_width: 3
strip_depth: [5, 8]
hall:
  min_depth: 8
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 8], when: "floors_total >= 2"}

entrances:
  main: {width: 2}
  service: {width: 2}
  emergency: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: shop_floor, place: hall}
      - {room: toilet, count: 1, priority: required}
      - {room: manager_office, count: [0, 1]}
      - {room: cold_storage, count: [0, 1]}
      - {room: cashier_booth, count: 1, near: entrance}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: stockroom, fill: true}
  upper:
    applies: [upper, top]
    rooms:
      - {room: stockroom, place: hall}
      - {room: storage, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: stockroom, place: hall}
      - {room: storage, fill: true}
