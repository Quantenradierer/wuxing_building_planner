# Units are cells: lengths in cells, areas in number of cells.
# Parking garage: one parking deck per level joined by ramps, a pay booth, stairs and lift.
building: parking_garage
catalogs: [common, office, industry]
layout: hall

corridor:
  width: 3
  hallway_width: 3
strip_depth: [6, 8]        # a thin row of stairs, booth and technical rooms
hall:
  min_depth: 20            # a row of cars and the lane; 25 fit a row on each side
facade:
  module: 3
  window: 2
cluster_filler: storage
service_rooms: [utility, storage]

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [4, 5], when: "floors_total >= 2"}
  - {room: elevator, size: [4, 5], when: "floors_total >= 2 and width + depth >= 100"}   # bigger floors: more cars

entrances:
  main: {width: 8}         # the car entrance
  service: {width: 2}      # pedestrians
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: parking_deck, place: hall}
      - {room: attendant_booth, count: 1, priority: required}
      - {room: toilet, count: [0, 1], near: core}
      - {room: security_room, count: 1, security: [corporate, aaa]}
      - {room: utility, count: 1}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: electrical_room, fill: true}
      - {room: mechanical_room, fill: true}
  deck:
    applies: [upper, top, basement]
    rooms:
      - {room: parking_deck, place: hall}
      - {room: electrical_room, fill: true}
      - {room: mechanical_room, fill: true}
