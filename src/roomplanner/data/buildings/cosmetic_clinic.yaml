# Units are cells: lengths in cells, areas in number of cells.
# Cosmetic clinic: no emergency department. Lounge-like reception, consultations,
# an OP for procedures, cyberware fitting, private recovery suites upstairs.
building: cosmetic_clinic
catalogs: [common, clinic, industry]
layout: corridor

corridor:
  width: 4
  hallway_width: 3
strip_depth: [10, 16]
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [5, 6], when: "floors_total >= 2"}   # bed elevator
  - {room: elevator, size: [5, 6], when: "floors_total >= 2 and width + depth >= 100"}   # bigger floors: more cars

entrances:
  main: {width: 4}
  service: {width: 2}
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: reception_lobby, place: entrance, area: [80, 180], priority: required}
      - {room: waiting_room, count: 1, near: entrance, priority: required}
      - {room: toilet, count: 1, near: entrance, priority: required}
      - {room: toilet, count: 1, near: entrance}   # a second one where it fits
      - {room: operating_room, count: 1, priority: required}
      - {room: sterilization, count: 1, priority: required}
      - {room: fitting_room, count: [0, 2]}
      - {room: security_room, count: 1, near: entrance, security: [corporate, aaa]}
      - {room: storage, count: 1, near: service}   # supplies in through the back door
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: cyberware_storage, count: [0, 1], priority: optional}
      - {room: consultation_room, fill: true}
      - {room: treatment_room, fill: true}       # interior rows without facade
  suites:
    applies: [upper, top]
    rooms:
      - {room: nurse_station, count: 1, near: core, priority: required}
      - {room: toilet, count: 1, near: core}
      - {room: operating_room, count: [0, 1]}
      - {room: fitting_room, count: [0, 1]}
      - {room: staff_room, count: 1}
      - {room: cyber_surgery, count: [0, 1], priority: optional}
      - {room: recovery_suite, fill: true}
      - {room: treatment_room, fill: true}       # interior rows without facade
  basement:
    applies: [basement]
    rooms:
      - {room: utility, count: 1, priority: required}
      - {room: pharmacy, count: [0, 1]}
      - {room: fitting_room, count: [0, 1]}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: generator_room, count: [0, 1], when: "level + 1 == 0", priority: optional}
      - {room: body_bank, count: [0, 1], priority: optional}
      - {room: storage, count: [1, 2], near: core}
      - {room: fitting_room, fill: true}
      - {room: mechanical_room, fill: true}
