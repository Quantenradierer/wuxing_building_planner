# Units are cells: lengths in cells, areas in number of cells.
# Warehouse: racked storage hall, loading docks, a strip of offices and staff rooms.
building: warehouse
catalogs: [common, office, retail, industry]
layout: hall

corridor:
  width: 3
  hallway_width: 3
strip_depth: [8, 12]
hall:
  min_depth: 14
  corridor_from: 1000      # never: the back rooms open straight onto the floor
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [6, 8], when: "floors_total >= 2"}   # freight lift
  - {room: elevator, size: [6, 8], when: "floors_total >= 2 and width + depth >= 100"}   # bigger floors: more cars

entrances:
  main: {width: 2}
  service: {width: 8}      # truck dock
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: warehouse_floor, place: hall}
      - {room: loading_bay, count: [1, 2], near: service}
      - {room: shipping_office, count: 1, priority: required}
      - {room: toilet, count: 1, near: core, priority: required}
      - {room: staff_room, count: 1}
      - {room: security_room, count: 1, security: [corporate, aaa]}
      - {room: manager_office, count: [0, 1]}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: contraband_store, count: [0, 1], wealth: [squatter, low, middle], priority: optional}
      - {room: loading_bay, fill: true}
      - {room: office, fill: true}
  upper:
    applies: [upper, top]
    rooms:
      - {room: warehouse_floor, place: hall}
      - {room: toilet, count: [0, 1], near: core}
      - {room: office, count: [0, 2]}
      - {room: office, fill: true}
      - {room: mechanical_room, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: warehouse_floor, place: hall}
      - {room: utility, count: 1, priority: required}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: contraband_store, count: [0, 1], priority: optional}
      - {room: storage, count: [0, 1], near: core}
      - {room: mechanical_room, fill: true}
