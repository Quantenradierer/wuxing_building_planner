# Units are cells: lengths in cells, areas in number of cells.
# Corporate research facility: labs, clean rooms, test chambers, server room.
building: corp_lab
catalogs: [common, office, clinic, industry]
layout: corridor

corridor:
  width: 4
  hallway_width: 3
strip_depth: [12, 18]
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [5, 6], when: "floors_total >= 2"}   # freight

entrances:
  main: {width: 4}
  service: {width: 4}
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: corp_lobby, place: entrance, area: [80, 180], priority: required}
      - {room: security_room, count: 1, near: entrance, priority: required}
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: meeting_room, count: [1, 2]}
      - {room: server_room, count: 1}
      - {room: wet_lab, count: [1, 2]}
      - {room: specimen_storage, count: [1, 2]}
      - {room: office, fill: true}
      - {room: test_chamber, fill: true}       # interior rows without facade
      - {room: storage, fill: true}
  labs:
    applies: [upper, top]
    rooms:
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: clean_room, count: [1, 2], priority: required}
      - {room: specimen_storage, count: [1, 3]}
      - {room: kitchenette, count: 1, near: core}
      - {room: office, count: [1, 3]}
      - {room: wet_lab, fill: true}
      - {room: clean_room, fill: true}         # interior rows without facade
      - {room: test_chamber, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: server_room, count: [1, 2], priority: required}
      - {room: utility, count: 1, priority: required}
      - {room: test_chamber, count: [1, 2]}
      - {room: specimen_storage, count: [1, 2]}
      - {room: storage, fill: true}
