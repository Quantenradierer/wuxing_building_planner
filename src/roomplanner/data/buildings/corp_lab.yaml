# Units are cells: lengths in cells, areas in number of cells.
# Corporate research facility: labs, clean rooms, test chambers, server room.
building: corp_lab
catalogs: [common, office, clinic, industry]
layout: corridor

corridor:
  width: 4
  hallway_width: 3
strip_depth: [10, 16]
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [5, 6], when: "floors_total >= 2"}   # freight
  - {room: elevator, size: [5, 6], when: "floors_total >= 2 and width + depth >= 100"}   # bigger floors: more cars

entrances:
  main: {width: 4}
  service: {width: 4}
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: corp_lobby, place: entrance, area: [80, 180], priority: required}
      - {room: security_room, count: 1, near: entrance, priority: required}
      - {room: guard_room, count: 1, near: entrance, priority: required}   # guards off patrol
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: meeting_room, count: [1, 2]}
      - {room: server_room, count: 1}
      - {room: wet_lab, count: [1, 2]}
      - {room: specimen_storage, count: [1, 2]}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: generator_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: spider_room, count: 1, near: core, security: [corporate, aaa], priority: optional}
      - {room: host_room, count: [0, 1], when: "floors_below == 0", security: [corporate, aaa], priority: optional}
      - {room: drone_bay, count: [0, 1], near: service, when: "floors_below == 0", security: [corporate, aaa], priority: optional}
      - {room: decon_room, count: [0, 1], priority: optional}
      - {room: subject_holding, count: [0, 1], when: "floors_below == 0", priority: optional}
      - {room: office, fill: true}
      - {room: test_chamber, fill: true}       # interior rows without facade
  labs:
    applies: [upper, top]
    rooms:
      - {room: toilet, count: 2, near: core, priority: required}
      - {room: clean_room, count: [1, 2], priority: required}
      - {room: specimen_storage, count: [1, 3]}
      - {room: kitchenette, count: 1, near: core}
      - {room: office, count: [1, 3]}
      - {room: decon_room, count: [0, 1], priority: optional}
      - {room: network_closet, count: [0, 1], near: core, priority: optional}
      - {room: wet_lab, fill: true}
      - {room: clean_room, fill: true}         # interior rows without facade
      - {room: test_chamber, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: server_room, count: [1, 2], priority: required}
      - {room: utility, count: 1, priority: required}
      - {room: test_chamber, count: [1, 2]}
      - {room: specimen_storage, count: [1, 2]}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: generator_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: mechanical_room, count: [0, 1], when: "level + 1 == 0", priority: optional}
      - {room: host_room, count: [0, 1], when: "level + 1 == 0", security: [corporate, aaa], priority: optional}
      - {room: drone_bay, count: [0, 1], when: "level + 1 == 0", security: [corporate, aaa], priority: optional}
      - {room: subject_holding, count: [0, 1], priority: optional}
      - {room: body_bank, count: [0, 1], priority: optional}
      - {room: vault, count: [0, 1], security: [aaa], priority: optional}
      - {room: storage, count: [1, 2], near: core}
      - {room: test_chamber, fill: true}
      - {room: server_room, fill: true}
      - {room: mechanical_room, fill: true}
