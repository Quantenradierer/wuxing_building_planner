# Units are cells: lengths in cells, areas in number of cells.
# Church: the nave with pews and altar, sacristy and parish hall at the side; a choir loft
# upstairs and a crypt below.
building: church
catalogs: [common, office, retail, hospitality, public]
layout: hall

corridor:
  width: 3
  hallway_width: 3
strip_depth: [8, 12]
hall:
  min_depth: 14
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 8], when: "floors_total >= 2"}

entrances:
  main: {width: 4}         # the portal, straight into the nave
  service: {width: 2}
  emergency: {width: 2}
  roof: {width: 2}         # the bell tower

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: nave, place: hall}
      - {room: sacristy, count: 1, priority: required}
      - {room: toilet, count: 1, near: core}
      - {room: parish_hall, count: [0, 1]}
      - {room: manager_office, count: [0, 1]}   # the priest's office
      - {room: kitchenette, count: [0, 1]}
      - {room: storage, fill: true}
  upper:
    applies: [upper, top]
    rooms:
      - {room: choir_loft, place: hall}
      - {room: storage, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: crypt, place: hall}
      - {room: utility, count: 1, priority: required}
      - {room: storage, fill: true}
