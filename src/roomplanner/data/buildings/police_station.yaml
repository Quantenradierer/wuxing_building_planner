# Units are cells: lengths in cells, areas in number of cells.
# Police precinct (Lone Star, Knight Errant): front desk, squad room, interview rooms with
# observation, a cell block, evidence and armory; offices and briefing upstairs.
building: police_station
catalogs: [common, office, retail, hospitality, public]
layout: corridor

corridor:
  width: 4
  hallway_width: 3
strip_depth: [10, 14]
facade:
  module: 3
  window: 2
cluster_filler: storage
service_rooms: [sally_port, evidence_room, locker_room, storage, utility]

core:
  - {room: stairwell, size: [5, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [4, 5], when: "floors_total >= 3"}

entrances:
  main: {width: 4}
  service: {width: 4}      # the sally port: prisoners come in the back
  emergency: {width: 2}
  roof: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: lobby, place: entrance, area: [60, 140], priority: required}
      - {room: reception, count: 1, near: entrance, priority: required}
      - {room: cell_block, count: 1, near: service, priority: required}
      - {room: interview_room, count: [1, 3], priority: required}
      - {room: observation_room, count: [1, 2]}
      - {room: armory, count: 1, near: core, priority: required}
      - {room: evidence_room, count: 1}
      - {room: security_room, count: 1, priority: required}
      - {room: toilet, count: [1, 2], near: core, priority: required}
      - {room: locker_room, count: 1}
      - {room: booking_room, count: 1, near: service}
      - {room: electrical_room, count: 1, near: service, when: "floors_below == 0", priority: optional}
      - {room: sally_port, count: 1, near: service}
      - {room: generator_room, count: [0, 1], near: service, when: "floors_below == 0", priority: optional}
      - {room: drone_bay, count: [0, 1], when: "floors_below == 0", priority: optional}
      - {room: records_room, count: [0, 1]}
      - {room: squad_room, fill: true}
      - {room: briefing_room, fill: true}     # interior rows without facade
      - {room: locker_room, fill: true}
  upper:
    applies: [upper, top]
    rooms:
      - {room: toilet, count: 1, near: core, priority: required}
      - {room: briefing_room, count: 1, priority: required}
      - {room: manager_office, count: [1, 2]}  # the captain's office
      - {room: kitchenette, count: 1, near: core}
      - {room: interview_room, count: [0, 2]}
      - {room: observation_room, count: [0, 1]}
      - {room: forensics_lab, count: [0, 1], priority: optional}
      - {room: network_closet, count: [0, 1], near: core, priority: optional}
      - {room: squad_room, fill: true}
      - {room: office, fill: true}
      - {room: briefing_room, fill: true}     # interior rows without facade
      - {room: interview_room, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: utility, count: 1, priority: required}
      - {room: cell_block, count: [0, 1]}
      - {room: evidence_room, count: [1, 2]}
      - {room: electrical_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: generator_room, count: 1, when: "level + 1 == 0", priority: optional}
      - {room: server_room, count: [0, 1], priority: optional}
      - {room: garage, count: [0, 1], when: "level + 1 == 0", priority: optional}
      - {room: drone_bay, count: [0, 1], priority: optional}
      - {room: forensics_lab, count: [0, 1], priority: optional}
      - {room: storage, count: 1, near: core}
      - {room: locker_room, count: [0, 1]}
      - {room: cell_block, fill: true}
      - {room: mechanical_room, fill: true}
