# Units are cells: lengths in cells, areas in number of cells.
# A large clinic: emergency department, imaging, ICU, surgery, wards, morgue.
building: hospital
catalogs: [common, clinic, industry]
layout: corridor

corridor:
  width: 6                 # two beds pass each other
  hallway_width: 3
strip_depth: [12, 18]
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [6, 10], when: "floors_total >= 2"}
  - {room: elevator, size: [5, 7], when: "floors_total >= 2"}   # bed elevator

entrances:
  main: {width: 4}
  service: {width: 6}      # ambulance bay
  emergency: {width: 3}
  roof: {width: 2}         # helipad access

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: lobby, place: entrance, area: [80, 200], priority: required}
      - {room: reception, count: 1, near: entrance, priority: required}
      - {room: waiting_room, count: [1, 2], near: entrance, priority: required}
      - {room: trauma_bay, count: 1, priority: required}
      - {room: trauma_bay, count: [1, 3]}
      - {room: imaging, count: 1}
      - {room: xray, count: [0, 1]}
      - {room: toilet, count: 2, near: entrance, priority: required}
      - {room: nurse_station, count: 1, near: core}
      - {room: security_room, count: 1, near: entrance, security: [low, corporate, aaa]}
      - {room: cafeteria, count: [0, 1], wealth: [middle, high, luxury]}
      - {room: exam_room, fill: true}
      - {room: treatment_room, fill: true}       # interior rows without facade
      - {room: storage, fill: true}
  surgery:
    applies: [upper]
    when: "level == 1 and floors_above >= 3"
    rooms:
      - {room: operating_room, count: [2, 4], priority: required}
      - {room: sterilization, count: [1, 2], priority: required}
      - {room: icu, count: 1, priority: required}
      - {room: nurse_station, count: 1, near: core, priority: required}
      - {room: toilet, count: 2, near: core}
      - {room: staff_room, count: 1}
      - {room: recovery_room, fill: true}
      - {room: sterilization, fill: true}
      - {room: storage, fill: true}
  wards:
    applies: [upper, top]
    rooms:
      - {room: nurse_station, count: [1, 2], near: core, priority: required}
      - {room: toilet, count: 2, near: core}
      - {room: doctor_office, count: [1, 3]}
      - {room: staff_room, count: 1}
      - {room: ward, fill: true}
      - {room: treatment_room, fill: true}       # interior rows without facade
      - {room: storage, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: morgue, count: 1, priority: required}
      - {room: utility, count: [1, 2], priority: required}
      - {room: pharmacy, count: 1}
      - {room: lab, count: [1, 2]}
      - {room: storage, fill: true}
