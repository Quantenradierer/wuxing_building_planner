# Units are cells: lengths in cells, areas in number of cells.
# Street doc: a cover business out front, a back-room OR and recovery cots behind it.
building: street_doc
catalogs: [common, clinic, industry]
layout: corridor

corridor:
  width: 3
  hallway_width: 3
strip_depth: [8, 14]
facade:
  module: 3
  window: 2
cluster_filler: storage

core:
  - {room: stairwell, size: [5, 8], when: "floors_total >= 2"}

entrances:
  main: {width: 2}
  service: {width: 2}      # the back door patients are carried through
  emergency: {width: 2}

floor_roles:
  ground:
    applies: [ground]
    rooms:
      - {room: storefront, place: entrance, area: [40, 100], priority: required}
      - {room: back_room_or, count: 1, priority: required}
      - {room: recovery_room, count: [1, 2], priority: required}
      - {room: toilet, count: 1, priority: required}
      - {room: pharmacy, count: [0, 1]}
      - {room: storage, count: [1, 2]}
      - {room: recovery_room, fill: true}
      - {room: storage, fill: true}
  upstairs:
    applies: [upper, top]
    rooms:
      - {room: toilet, count: 1}
      - {room: treatment_room, count: [0, 1]}
      - {room: recovery_room, fill: true}
      - {room: storage, fill: true}
  basement:
    applies: [basement]
    rooms:
      - {room: back_room_or, count: [0, 1]}
      - {room: morgue, count: [0, 1]}
      - {room: utility, count: 1}
      - {room: storage, fill: true}

wealth:
  squatter: {area: 0.8, corridor: 1.0, furniture: 0.6}
  luxury: {area: 1.1, corridor: 1.0, furniture: 1.2}   # a street doc stays a street doc
