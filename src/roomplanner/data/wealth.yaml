# Global multipliers per wealth tier (Shadowrun lifestyles). Building programs may override
# single tiers under `wealth:`, rooms under their own `wealth:` key.
#   area:      room areas (with fixed building size: bigger rooms mean fewer rooms)
#   corridor:  corridor width
#   furniture: furniture density (furnishing layer)
tiers:
  squatter: {area: 0.75, corridor: 0.75, furniture: 0.5}
  low:      {area: 0.9,  corridor: 1.0,  furniture: 0.75}
  middle:   {area: 1.0,  corridor: 1.0,  furniture: 1.0}
  high:     {area: 1.15, corridor: 1.1,  furniture: 1.25}
  luxury:   {area: 1.35, corridor: 1.25, furniture: 1.5}
