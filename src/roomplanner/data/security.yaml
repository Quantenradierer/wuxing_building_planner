# Security levels. Locks: none, mechanical, maglock, cardreader, biometric.
# Door materials: standard, glass, security, blast. Ratings are generic 1-8 values;
# map them to your game system's device ratings.
fire_doors: [stairwell]   # fire-rated leaf (DIN EN 16034) on the stair housing, at every tier
tiers:
  none:
    rating: 1
    exterior: {lock: mechanical}
    rooms:
      unit: {lock: mechanical}           # front doors of apartments
      police_lobby: {lock: mechanical}   # into the station from the public front office
      count_room: {lock: mechanical}     # casino: behind the cage
  low:
    rating: 2
    exterior: {lock: mechanical}
    rooms:
      unit: {lock: mechanical}
      police_lobby: {lock: maglock}
      server_room: {lock: mechanical}
      pharmacy: {lock: mechanical}
      security_room: {lock: mechanical}
      manager_office: {lock: mechanical}
      vault: {lock: mechanical, material: security}
      host_room: {lock: mechanical}
      spider_room: {lock: mechanical}
      gear_room: {lock: mechanical}
      cashier_booth: {lock: mechanical, material: security}
      data_hall: {lock: mechanical, material: security}
      mantrap: {lock: mechanical}
      count_room: {lock: mechanical, material: security}
      surveillance_room: {lock: mechanical}
    cameras: {entrances: true, rooms: [sales_floor, gaming_floor]}
  corporate:
    rating: 4
    exterior: {lock: maglock, material: security}
    interior: {lock: none}
    rooms:
      unit: {lock: maglock, material: security}
      police_lobby: {lock: cardreader, material: security}
      server_room: {lock: cardreader, material: security, rating: 5}
      security_room: {lock: cardreader, material: security}
      guard_room: {lock: cardreader}
      archive: {lock: cardreader}
      host_room: {lock: cardreader, material: security, rating: 5}
      spider_room: {lock: cardreader, material: security}
      gear_room: {lock: maglock, material: security}
      vault: {lock: cardreader, material: security, rating: 6}
      safe_room: {lock: maglock, material: security, rating: 6}
      drone_bay: {lock: cardreader}
      electrical_room: {lock: mechanical}
      generator_room: {lock: mechanical}
      mechanical_room: {lock: mechanical}
      sally_port: {lock: cardreader, material: security}
      subject_holding: {lock: maglock, material: security}
      cyber_surgery: {lock: cardreader}
      body_bank: {lock: cardreader}
      forensics_lab: {lock: cardreader}
      cashier_booth: {lock: maglock, material: security}
      data_hall: {lock: cardreader, material: security, rating: 5}
      mantrap: {lock: cardreader, material: security, rating: 5}
      noc: {lock: cardreader}
      meet_me_room: {lock: cardreader, material: security}
      ups_room: {lock: mechanical}
      cooling_plant: {lock: mechanical}
      count_room: {lock: cardreader, material: security, rating: 5}
      surveillance_room: {lock: cardreader, material: security}
      executive_office: {lock: cardreader}
      board_room: {lock: cardreader}
      pharmacy: {lock: cardreader, material: security}
      operating_room: {lock: cardreader}
      morgue: {lock: maglock}
      lab: {lock: cardreader}
      manager_office: {lock: maglock}
      stockroom: {lock: maglock}
      utility: {lock: mechanical}
    cameras: {entrances: true, corridor_per: 120, rooms: [lobby, reception_lobby, police_lobby, sales_floor, server_room, waiting_room,
                                                       data_hall, mantrap, gaming_floor, cash_cage,
                                                       count_room]}
    alarm_panels: true
    motion_sensors: [server_room, archive, host_room, vault, data_hall]
    floodlights: {kind: flood, radius: 10, colour: "#f4fbff", intensity: 0.9}
    furniture:
      lobby:
        - {object: guard_post, placement: wall, faces_door: true, displace: [bench, sofa, lounge_set, plant, trash_bin, wall_screen, display_case, medkit]}   # close to a wall, looking at the entrance
      reception_lobby:
        - {object: guard_post, placement: wall, faces_door: true, displace: [bench, sofa, lounge_set, plant, trash_bin, wall_screen, display_case, medkit]}   # close to a wall, looking at the entrance
      corp_lobby:
        - {object: guard_post, placement: wall, faces_door: true, displace: [bench, sofa, lounge_set, plant, trash_bin, wall_screen, display_case, medkit]}   # close to a wall, looking at the entrance
      security_room:
        - {object: terminal, placement: wall, count: [2, 4]}
        - {object: weapon_locker, placement: wall}
        - {object: rigger_cocoon, placement: wall, count: [0, 1]}   # the security spider
  aaa:
    rating: 7
    exterior: {lock: biometric, material: security, rating: 8}
    interior: {lock: cardreader}
    rooms:
      unit: {lock: cardreader, material: security}
      police_lobby: {lock: biometric, material: security}
      server_room: {lock: biometric, material: blast, rating: 8}
      security_room: {lock: biometric, material: security}
      guard_room: {lock: cardreader, material: security}
      archive: {lock: biometric, material: security}
      host_room: {lock: biometric, material: blast, rating: 8}
      spider_room: {lock: biometric, material: security}
      gear_room: {lock: biometric, material: security}
      vault: {lock: biometric, material: blast, rating: 8}
      safe_room: {lock: biometric, material: blast, rating: 8}
      drone_bay: {lock: cardreader, material: security}
      electrical_room: {lock: cardreader}
      generator_room: {lock: cardreader, material: security}
      mechanical_room: {lock: cardreader}
      sally_port: {lock: biometric, material: security}
      subject_holding: {lock: biometric, material: security}
      cyber_surgery: {lock: biometric}
      body_bank: {lock: biometric, material: security}
      forensics_lab: {lock: biometric}
      cashier_booth: {lock: cardreader, material: security}
      data_hall: {lock: biometric, material: blast, rating: 8}
      mantrap: {lock: biometric, material: security, rating: 7}
      noc: {lock: biometric, material: security}
      meet_me_room: {lock: biometric, material: security}
      ups_room: {lock: cardreader}
      cooling_plant: {lock: cardreader}
      count_room: {lock: biometric, material: security, rating: 7}
      surveillance_room: {lock: biometric, material: security}
      executive_office: {lock: biometric}
      board_room: {lock: biometric}
      pharmacy: {lock: biometric, material: security}
      lab: {lock: biometric, material: security}
      operating_room: {lock: biometric}
      morgue: {lock: cardreader}
      stairwell: {lock: cardreader}
      stockroom: {lock: cardreader}
      utility: {lock: cardreader, material: security}
      corridor: {lock: cardreader}
    cameras: {entrances: true, corridor_per: 60, rooms: [lobby, reception_lobby, police_lobby, sales_floor, server_room, waiting_room, stairwell, security_room, archive, lab, executive_office,
                                                      data_hall, mantrap, noc, gaming_floor, cash_cage,
                                                      count_room, vault]}
    alarm_panels: true
    motion_sensors: [server_room, archive, executive_office, board_room, lab, stairwell, storage,
                     host_room, vault, drone_bay, data_hall, meet_me_room, count_room]
    floodlights: {kind: flood, radius: 12, colour: "#f4fbff", intensity: 1.0}
    furniture:
      lobby:
        - {object: security_gate, placement: gates, count: 2, margin: 3}   # one gate 3-5 cells inside each entrance door
        - {object: guard_post, placement: wall, faces_door: true, displace: [bench, sofa, lounge_set, plant, trash_bin, wall_screen, display_case, medkit]}   # close to a wall, looking at the entrance
      reception_lobby:
        - {object: security_gate, placement: gates, count: 2, margin: 3}   # one gate 3-5 cells inside each entrance door
        - {object: guard_post, placement: wall, faces_door: true, displace: [bench, sofa, lounge_set, plant, trash_bin, wall_screen, display_case, medkit]}   # close to a wall, looking at the entrance
      corp_lobby:
        - {object: guard_post, placement: wall, faces_door: true, displace: [bench, sofa, lounge_set, plant, trash_bin, wall_screen, display_case, medkit]}   # close to a wall, looking at the entrance
      security_room:
        - {object: terminal, placement: wall, count: [3, 6]}
        - {object: weapon_locker, placement: wall, count: [1, 2]}
        - {object: rigger_cocoon, placement: wall}                  # the security spider
