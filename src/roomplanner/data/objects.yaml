# Furniture and fixtures. size: [cells along the wall / row, cells deep].
# cover is for the (postponed) tactical layer; glyph is the ASCII debug character.
# walkable objects can be walked over and may stand in front of doors (stairs).
objects:
  stairs:          {size: [6, 4], walkable: true, glyph: "#"}
  elevator_car:    {size: [3, 3], walkable: true, glyph: "%"}
  rug:             {size: [4, 3], walkable: true, glyph: "~"}
  roof_hatch:      {size: [2, 2], walkable: true, glyph: "^"}
  guard_desk:      {size: [4, 2], cover: heavy, glyph: G}
  security_gate:   {size: [1, 3], cover: light, glyph: "!"}
  weapon_locker:   {size: [2, 1], cover: heavy, glyph: L}
  debris:          {size: [2, 2], cover: light, glyph: ","}
  trash_pile:      {size: [2, 1], cover: light, glyph: ";"}
  rubble:          {size: [3, 2], cover: heavy, glyph: "&"}
  rubble_heap:     {size: [4, 4], cover: heavy, glyph: "@"}
  collapsed_ceiling: {size: [5, 3], cover: heavy, glyph: "@"}
  filing_cabinet:  {size: [2, 1], cover: heavy, glyph: F}
  armchair:        {size: [2, 2], cover: light, glyph: A}
  crate:           {size: [2, 2], cover: heavy, glyph: K}
  trash_bin:       {size: [1, 1], cover: light, glyph: U}
  copier:          {size: [2, 1], cover: heavy, glyph: P}
  desk:            {size: [3, 2], cover: light, glyph: d}
  chair:           {size: [1, 1], cover: none,  glyph: c}
  table:           {size: [2, 2], cover: light, glyph: t}
  meeting_table:   {size: [6, 3], cover: light, glyph: T}
  shelf:           {size: [2, 1], cover: heavy, glyph: s}
  cabinet:         {size: [1, 1], cover: heavy, glyph: k}
  counter:         {size: [4, 1], cover: heavy, glyph: n}
  reception_desk:  {size: [5, 2], cover: heavy, glyph: R}
  bed:             {size: [2, 4], cover: light, glyph: b}
  double_bed:      {size: [4, 4], cover: light, glyph: B}
  sofa:            {size: [4, 2], cover: light, glyph: o}
  wardrobe:        {size: [3, 1], cover: heavy, glyph: a}
  wc:              {size: [1, 1], cover: none,  glyph: w}
  sink:            {size: [1, 1], cover: none,  glyph: i}
  shower:          {size: [2, 2], cover: none,  glyph: h}
  stove:           {size: [2, 1], cover: heavy, glyph: v}
  fridge:          {size: [1, 1], cover: heavy, glyph: f}
  server_rack:     {size: [2, 1], cover: heavy, glyph: S}
  gondola:         {size: [8, 2], cover: heavy, glyph: g}
  checkout:        {size: [2, 4], cover: heavy, glyph: C}
  freezer:         {size: [4, 2], cover: heavy, glyph: z}
  pallet:          {size: [2, 2], cover: heavy, glyph: p}
  rack:            {size: [6, 2], cover: heavy, glyph: r}
  hospital_bed:    {size: [2, 4], cover: light, glyph: H}
  exam_table:      {size: [2, 4], cover: light, glyph: e}
  operating_table: {size: [2, 4], cover: light, glyph: O}
  medical_cabinet: {size: [2, 1], cover: heavy, glyph: m}
  morgue_drawers:  {size: [4, 2], cover: heavy, glyph: M}
  locker:          {size: [1, 1], cover: heavy, glyph: l}
  bench:           {size: [4, 1], cover: light, glyph: q}
  plant:           {size: [1, 1], cover: light, glyph: "*"}
  machinery:       {size: [3, 2], cover: heavy, glyph: X}
  washing_machine: {size: [1, 1], cover: heavy, glyph: x}
  mailboxes:       {size: [3, 1], cover: heavy, glyph: u}
  terminal:        {size: [1, 1], cover: none,  glyph: j}
  vending_machine: {size: [2, 1], cover: heavy, glyph: y}
  capsule:         {size: [2, 4], cover: heavy, glyph: Q}   # 1 m wide, 2 m long, side by side
  bar_counter:     {size: [8, 2], cover: heavy, glyph: N}
  dj_booth:        {size: [4, 2], cover: heavy, glyph: J}
  speaker:         {size: [1, 1], cover: heavy, glyph: E}
  pool_table:      {size: [5, 3], cover: light, glyph: Y}
  forklift:        {size: [2, 4], cover: heavy, glyph: Z}
  lab_bench:       {size: [6, 2], cover: light, glyph: V}
  fume_hood:       {size: [3, 1], cover: heavy, glyph: W}
  specimen_fridge: {size: [2, 1], cover: heavy, glyph: I}
  cubicle:         {size: [3, 3], cover: light, glyph: "["}
  scanner:         {size: [4, 6], cover: heavy, glyph: "]"}
  # Small things that go beside other objects (placement: at) or fill walls.
  stool:           {size: [1, 1], cover: none,  glyph: c}
  nightstand:      {size: [1, 1], cover: light, glyph: "1"}
  side_table:      {size: [1, 1], cover: light, glyph: "}"}
  wall_screen:     {size: [3, 1], cover: none,  glyph: "2"}   # trideo / camera feeds / holo display
  whiteboard:      {size: [3, 1], cover: none,  glyph: ">"}
  coffee_machine:  {size: [1, 1], cover: heavy, glyph: "3"}
  water_cooler:    {size: [1, 1], cover: light, glyph: "4"}
  iv_stand:        {size: [1, 1], cover: none,  glyph: "5"}
  vital_monitor:   {size: [1, 1], cover: light, glyph: "?"}
  medical_cart:    {size: [2, 1], cover: light, glyph: "6"}
  gurney:          {size: [2, 4], cover: light, glyph: "7"}
  barrel:          {size: [1, 1], cover: heavy, glyph: "8"}
  workbench:       {size: [4, 2], cover: heavy, glyph: "9"}
  display_case:    {size: [3, 1], cover: light, glyph: D}
  atm:             {size: [1, 1], cover: heavy, glyph: $}
  coat_rack:       {size: [1, 1], cover: none,  glyph: (}
  safe:            {size: [1, 1], cover: heavy, glyph: )}
  urinal:          {size: [1, 1], cover: none,  glyph: w}
  dryer:           {size: [1, 1], cover: heavy, glyph: x}
  laundry_cart:    {size: [1, 2], cover: light, glyph: "{"}
  arcade_machine:  {size: [2, 1], cover: heavy, glyph: "`"}
  stage:           {size: [8, 4], walkable: true, glyph: _}

# Objects placed together as one. Drawn against a wall to the north (the group faces S);
# `at` is [along, deep] inside the group, `facing` relative to the group (S = the group's).
groups:
  workstation:          # desk with its chair
    size: [3, 3]
    parts:
      - {object: desk, at: [0, 0]}
      - {object: chair, at: [1, 2], facing: N}
  desk_with_visitors:   # desk, the owner's chair behind it, two visitor chairs
    size: [3, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: desk, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
      - {object: chair, at: [2, 3], facing: N}
  dining_set:           # table with two chairs on each of two sides, a gap beside it
    size: [3, 4]
    parts:
      - {object: chair, at: [0, 0]}
      - {object: chair, at: [1, 0]}
      - {object: table, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
      - {object: chair, at: [1, 3], facing: N}
  cafe_table:           # table with a chair on each of two sides
    size: [2, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: table, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
  meeting_set:          # meeting table, four chairs along each long side
    size: [6, 5]
    parts:
      - {object: meeting_table, at: [0, 1]}
      - {object: chair, at: [1, 0]}
      - {object: chair, at: [2, 0]}
      - {object: chair, at: [3, 0]}
      - {object: chair, at: [4, 0]}
      - {object: chair, at: [1, 4], facing: N}
      - {object: chair, at: [2, 4], facing: N}
      - {object: chair, at: [3, 4], facing: N}
      - {object: chair, at: [4, 4], facing: N}
  board_set:            # boardroom table: six chairs per side and one at each head
    size: [8, 5]
    parts:
      - {object: meeting_table, at: [1, 1]}
      - {object: chair, at: [1, 0]}
      - {object: chair, at: [2, 0]}
      - {object: chair, at: [3, 0]}
      - {object: chair, at: [4, 0]}
      - {object: chair, at: [5, 0]}
      - {object: chair, at: [6, 0]}
      - {object: chair, at: [1, 4], facing: N}
      - {object: chair, at: [2, 4], facing: N}
      - {object: chair, at: [3, 4], facing: N}
      - {object: chair, at: [4, 4], facing: N}
      - {object: chair, at: [5, 4], facing: N}
      - {object: chair, at: [6, 4], facing: N}
      - {object: chair, at: [0, 2], facing: E}
      - {object: chair, at: [7, 2], facing: W}
  bar_set:              # bar counter with a row of stools
    size: [8, 3]
    parts:
      - {object: bar_counter, at: [0, 0]}
      - {object: stool, at: [1, 2], facing: N}
      - {object: stool, at: [3, 2], facing: N}
      - {object: stool, at: [5, 2], facing: N}
      - {object: stool, at: [7, 2], facing: N}
  sofa_set:             # sofa, side tables, coffee table in front
    size: [6, 4]
    parts:
      - {object: side_table, at: [0, 0]}
      - {object: sofa, at: [1, 0]}
      - {object: side_table, at: [5, 0]}
      - {object: table, at: [2, 2]}
  bed_set:              # single bed between two nightstands
    size: [4, 4]
    parts:
      - {object: nightstand, at: [0, 0]}
      - {object: bed, at: [1, 0]}
      - {object: nightstand, at: [3, 0]}
  double_bed_set:
    size: [6, 4]
    parts:
      - {object: nightstand, at: [0, 0]}
      - {object: double_bed, at: [1, 0]}
      - {object: nightstand, at: [5, 0]}
  patient_bed:          # hospital bed with IV stand and vital monitor
    size: [4, 4]
    parts:
      - {object: iv_stand, at: [0, 0]}
      - {object: hospital_bed, at: [1, 0]}
      - {object: vital_monitor, at: [3, 0]}
  reception_post:       # reception desk with the receptionist's chair behind it
    size: [5, 3]
    parts:
      - {object: chair, at: [2, 0]}
      - {object: reception_desk, at: [0, 1]}
  guard_post:
    size: [4, 3]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: guard_desk, at: [0, 1]}
