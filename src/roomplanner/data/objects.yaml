# Furniture and fixtures. size: [cells along the wall / row, cells deep].
# glyph is the ASCII debug character.
# walkable objects can be walked over and may stand in front of doors (stairs).
objects:
  stairs:          {size: [6, 4], walkable: true, glyph: "#"}
  elevator_car:    {size: [3, 3], walkable: true, glyph: e}
  rug:             {size: [4, 3], walkable: true, glyph: "~"}
  roof_hatch:      {size: [2, 2], walkable: true, glyph: "^"}
  guard_desk:      {size: [4, 2], glyph: G}
  security_gate:   {size: [1, 3], glyph: "!"}
  weapon_locker:   {size: [2, 1], glyph: L}
  debris:          {size: [2, 2], glyph: ","}
  trash_pile:      {size: [2, 1], glyph: ";"}
  rubble:          {size: [3, 2], glyph: "&"}
  rubble_heap:     {size: [4, 4], glyph: "@"}
  collapsed_ceiling: {size: [5, 3], glyph: "@"}
  filing_cabinet:  {size: [2, 1], glyph: F}
  armchair:        {size: [2, 2], glyph: A}
  crate:           {size: [2, 2], glyph: K}
  trash_bin:       {size: [1, 1], glyph: U}
  copier:          {size: [2, 1], glyph: P}
  desk:            {size: [3, 2], glyph: d}
  chair:           {size: [1, 1], glyph: c}
  table:           {size: [2, 2], glyph: t}
  meeting_table:   {size: [6, 3], glyph: T}
  shelf:           {size: [2, 1], glyph: s}
  cabinet:         {size: [1, 1], glyph: k}
  counter:         {size: [4, 1], glyph: n}
  reception_desk:  {size: [5, 2], glyph: R}
  bed:             {size: [2, 4], glyph: b}
  double_bed:      {size: [4, 4], glyph: B}
  sofa:            {size: [4, 2], glyph: o}
  wardrobe:        {size: [3, 1], glyph: a}
  wc:              {size: [2, 2], glyph: w}   # 1 x 1 m: bigger than real, reads better
  sink:            {size: [2, 1], glyph: i}
  shower:          {size: [2, 2], glyph: h}
  stove:           {size: [2, 1], glyph: v}
  fridge:          {size: [1, 1], glyph: f}
  server_rack:     {size: [2, 1], glyph: S}
  gondola:         {size: [8, 2], glyph: g}
  checkout:        {size: [2, 4], glyph: C}
  freezer:         {size: [4, 2], glyph: z}
  pallet:          {size: [2, 2], glyph: p}
  rack:            {size: [6, 2], glyph: r}
  hospital_bed:    {size: [2, 4], glyph: H}
  exam_table:      {size: [2, 4], glyph: e}
  operating_table: {size: [2, 4], glyph: o}
  medical_cabinet: {size: [2, 1], glyph: m}
  morgue_drawers:  {size: [4, 2], glyph: M}
  locker:          {size: [1, 1], glyph: l}
  bench:           {size: [4, 1], glyph: q}
  plant:           {size: [1, 1], glyph: "*"}
  machinery:       {size: [3, 2], glyph: m}
  washing_machine: {size: [1, 1], glyph: x}
  mailboxes:       {size: [3, 1], glyph: u}
  terminal:        {size: [1, 1], glyph: j}
  vending_machine: {size: [2, 1], glyph: y}
  capsule:         {size: [2, 4], glyph: Q}   # 1 m wide, 2 m long, side by side
  bar_counter:     {size: [8, 2], glyph: N}
  dj_booth:        {size: [4, 2], glyph: J}
  speaker:         {size: [1, 1], glyph: E}
  pool_table:      {size: [5, 3], glyph: Y}
  forklift:        {size: [2, 4], glyph: Z}
  lab_bench:       {size: [6, 2], glyph: V}
  fume_hood:       {size: [3, 1], glyph: W}
  specimen_fridge: {size: [2, 1], glyph: I}
  cubicle:         {size: [3, 3], glyph: "["}
  scanner:         {size: [4, 6], glyph: "]"}
  # Small things that go beside other objects (placement: at) or fill walls.
  stool:           {size: [1, 1], glyph: c}
  nightstand:      {size: [1, 1], glyph: n}
  side_table:      {size: [1, 1], glyph: "}"}
  wall_screen:     {size: [3, 1], glyph: "<"}   # trideo / camera feeds / holo display
  whiteboard:      {size: [3, 1], glyph: ">"}
  coffee_machine:  {size: [1, 1], glyph: "'"}
  water_cooler:    {size: [1, 1], glyph: w}
  iv_stand:        {size: [1, 1], glyph: i}
  vital_monitor:   {size: [1, 1], glyph: v}
  medical_cart:    {size: [2, 1], glyph: m}
  gurney:          {size: [2, 4], glyph: g}
  barrel:          {size: [1, 1], glyph: o}
  workbench:       {size: [4, 2], glyph: b}
  display_case:    {size: [3, 1], glyph: d}
  atm:             {size: [1, 1], glyph: $}
  coat_rack:       {size: [1, 1], glyph: (}
  safe:            {size: [1, 1], glyph: )}
  dryer:           {size: [1, 1], glyph: x}
  laundry_cart:    {size: [1, 2], glyph: "{"}
  arcade_machine:  {size: [2, 1], glyph: "`"}
  stage:           {size: [8, 4], walkable: true, glyph: _}

  # Vehicles, industry, church.
  car:             {size: [4, 9], glyph: c}   # 2 x 4.5 m, nose to the wall
  car_lift:        {size: [5, 10], glyph: L}  # a car up on a lift
  ramp:            {size: [6, 14], walkable: true, glyph: '\'} # to the next parking level
  pay_station:     {size: [1, 1], glyph: $}
  conveyor:        {size: [8, 2], glyph: "."}
  robot_arm:       {size: [2, 2], glyph: r}
  tool_rack:       {size: [3, 1], glyph: s}
  pew:             {size: [8, 2], glyph: q}
  altar:           {size: [4, 2], glyph: n}
  pulpit:          {size: [2, 2], glyph: n}
  candle_stand:    {size: [1, 1], glyph: "*"}
  confessional:    {size: [4, 2], glyph: k}
  organ:           {size: [4, 2], glyph: N}
  tomb:            {size: [3, 5], glyph: M}

  # Tables and desks by use (same sizes, their own sprites).
  office_desk:     {size: [3, 2], glyph: d}
  executive_desk:  {size: [3, 2], glyph: d}
  home_desk:       {size: [3, 2], glyph: d}
  console_desk:    {size: [3, 2], glyph: d}   # security / control consoles
  dining_table:    {size: [2, 2], glyph: t}   # restaurants, parish halls
  bar_table:       {size: [2, 2], glyph: t}   # bars, clubs
  canteen_table:   {size: [2, 2], glyph: t}   # cafeterias, staff rooms
  kitchen_table:   {size: [2, 2], glyph: t}   # homes, kitchenettes
  interview_table: {size: [2, 2], glyph: t}   # bolted down
  coffee_table:    {size: [2, 2], glyph: t}   # in front of sofas
  huddle_table:    {size: [2, 2], glyph: t}   # small meeting table, 1 m square
  board_table:     {size: [6, 3], glyph: T}
  round_table:     {size: [4, 4], glyph: T}   # round meeting table, 2 m across

  # Building services, security tech, Sixth World details.
  electrical_panel: {size: [2, 1], glyph: E}    # switchboard / breaker cabinet
  battery_bank:    {size: [3, 1], glyph: b}    # UPS batteries
  hvac_unit:       {size: [4, 3], glyph: H}      # air handler
  condenser:       {size: [2, 2], glyph: C}      # rooftop air-conditioning condenser, one fan
  satellite_dish:  {size: [3, 3], glyph: Q}      # uplink dish on a stand
  generator:       {size: [5, 3], glyph: G}      # backup diesel generator
  fuel_tank:       {size: [3, 2], glyph: f}
  suppression_tanks: {size: [3, 1], glyph: "<"}  # inert gas bottles of a fire suppression system
  fire_extinguisher: {size: [1, 1], glyph: "'"}
  rigger_cocoon:   {size: [2, 3], glyph: Q}      # reclined rigger / decker chair with trodes
  drone_dock:      {size: [2, 2], glyph: d}    # charging pad with a parked drone
  drone_rack:      {size: [3, 1], glyph: s}      # small drones and spare parts on a wall rack
  deposit_boxes:   {size: [4, 1], glyph: F}      # wall of safe deposit boxes
  sim_rig:         {size: [2, 3], glyph: A}      # simsense recliner (BTL chips in the Barrens)
  autokitchen:     {size: [2, 1], glyph: v}      # nuke-it autokitchen
  mattress:        {size: [2, 4], glyph: b}      # on the floor
  fire_barrel:     {size: [1, 1], glyph: f}
  cyberware_rack:  {size: [3, 1], glyph: m}      # cyberlimbs and implants on hooks
  cryo_pod:        {size: [2, 4], glyph: H}
  ambulance:       {size: [4, 10], glyph: a}   # DocWagon armoured ambulance, nose to the wall
  evidence_locker: {size: [2, 1], glyph: L}
  shipping_container: {size: [5, 12], glyph: "["}
  crac_unit:       {size: [4, 2], glyph: W}      # data hall air conditioner: cold air into the raised floor
  chiller:         {size: [6, 3], glyph: G}      # water chiller of the cooling plant

  # Casino.
  card_table:      {size: [4, 2], glyph: Z}   # blackjack / poker, dealer on the flat side
  roulette_table:  {size: [5, 3], glyph: W}   # wheel at one end, betting layout
  craps_table:     {size: [7, 3], glyph: Y}   # players stand round it
  slot_machine:    {size: [2, 1], glyph: $}
  cash_cart:       {size: [2, 1], glyph: m}   # locked trolley for cash boxes and chips
  count_table:     {size: [6, 2], glyph: T}   # long table with bill counters and scales

# Objects placed together as one. Drawn against a wall to the north (the group faces S);
# `at` is [along, deep] inside the group, `facing` relative to the group (S = the group's).
groups:
  desk_pair:            # two desks joined on their long side, a chair on each outer side
    size: [6, 3]
    parts:
      - {object: chair, at: [0, 1], facing: E}
      - {object: office_desk, at: [1, 0], facing: W}
      - {object: office_desk, at: [3, 0], facing: E}
      - {object: chair, at: [5, 1], facing: W}
  desk_trio:            # a desk pair with a third desk across its end, facing the wall
    size: [6, 6]
    parts:
      - {object: chair, at: [0, 1], facing: E}
      - {object: office_desk, at: [1, 0], facing: W}
      - {object: office_desk, at: [3, 0], facing: E}
      - {object: chair, at: [5, 1], facing: W}
      - {object: office_desk, at: [1, 3]}
      - {object: chair, at: [2, 5], facing: N}
  workstation:          # desk with its chair
    size: [3, 3]
    parts:
      - {object: office_desk, at: [0, 0]}
      - {object: chair, at: [1, 2], facing: N}
  desk_with_visitors:   # desk, the owner's chair behind it, two visitor chairs
    size: [3, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: office_desk, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
      - {object: chair, at: [2, 3], facing: N}
  dining_set:           # table with two chairs on each of two sides, a gap beside it
    size: [3, 4]
    parts:
      - {object: chair, at: [0, 0]}
      - {object: chair, at: [1, 0]}
      - {object: dining_table, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
      - {object: chair, at: [1, 3], facing: N}
  cafe_table:           # table with a chair on each of two sides
    size: [2, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: bar_table, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
  meeting_set:          # meeting table, four chairs along each long side
    size: [6, 5]
    parts:
      - {object: meeting_table, at: [0, 1]}
      - {object: chair, at: [1, 0]}
      - {object: chair, at: [2, 0]}
      - {object: chair, at: [3, 0]}
      - {object: chair, at: [4, 0]}
      - {object: chair, at: [1, 4], facing: N}
      - {object: chair, at: [2, 4], facing: N}
      - {object: chair, at: [3, 4], facing: N}
      - {object: chair, at: [4, 4], facing: N}
  round_meeting_set:    # round table, two chairs on each side
    size: [6, 6]
    parts:
      - {object: round_table, at: [1, 1]}
      - {object: chair, at: [2, 0]}
      - {object: chair, at: [3, 0]}
      - {object: chair, at: [2, 5], facing: N}
      - {object: chair, at: [3, 5], facing: N}
      - {object: chair, at: [0, 2], facing: E}
      - {object: chair, at: [0, 3], facing: E}
      - {object: chair, at: [5, 2], facing: W}
      - {object: chair, at: [5, 3], facing: W}
  long_meeting_set:     # two meeting tables end to end, six chairs per side
    size: [12, 5]
    parts:
      - {object: meeting_table, at: [0, 1]}
      - {object: meeting_table, at: [6, 1]}
      - {object: chair, at: [1, 0]}
      - {object: chair, at: [3, 0]}
      - {object: chair, at: [5, 0]}
      - {object: chair, at: [6, 0]}
      - {object: chair, at: [8, 0]}
      - {object: chair, at: [10, 0]}
      - {object: chair, at: [1, 4], facing: N}
      - {object: chair, at: [3, 4], facing: N}
      - {object: chair, at: [5, 4], facing: N}
      - {object: chair, at: [6, 4], facing: N}
      - {object: chair, at: [8, 4], facing: N}
      - {object: chair, at: [10, 4], facing: N}
  u_meeting_set:        # three tables in a U open towards the front, chairs outside
    size: [14, 8]
    parts:
      - {object: meeting_table, at: [1, 1], facing: E}
      - {object: meeting_table, at: [4, 1]}
      - {object: meeting_table, at: [10, 1], facing: W}
      - {object: chair, at: [4, 0]}
      - {object: chair, at: [6, 0]}
      - {object: chair, at: [7, 0]}
      - {object: chair, at: [9, 0]}
      - {object: chair, at: [0, 2], facing: E}
      - {object: chair, at: [0, 4], facing: E}
      - {object: chair, at: [0, 6], facing: E}
      - {object: chair, at: [13, 2], facing: W}
      - {object: chair, at: [13, 4], facing: W}
      - {object: chair, at: [13, 6], facing: W}
  board_set:            # boardroom table: six chairs per side and one at each head
    size: [8, 5]
    parts:
      - {object: board_table, at: [1, 1]}
      - {object: chair, at: [1, 0]}
      - {object: chair, at: [2, 0]}
      - {object: chair, at: [3, 0]}
      - {object: chair, at: [4, 0]}
      - {object: chair, at: [5, 0]}
      - {object: chair, at: [6, 0]}
      - {object: chair, at: [1, 4], facing: N}
      - {object: chair, at: [2, 4], facing: N}
      - {object: chair, at: [3, 4], facing: N}
      - {object: chair, at: [4, 4], facing: N}
      - {object: chair, at: [5, 4], facing: N}
      - {object: chair, at: [6, 4], facing: N}
      - {object: chair, at: [0, 2], facing: E}
      - {object: chair, at: [7, 2], facing: W}
  bar_set:              # back bar on the wall, 1 m for the bartender, counter, stools
    size: [8, 6]
    parts:
      - {object: shelf, at: [0, 0]}
      - {object: fridge, at: [2, 0]}
      - {object: shelf, at: [3, 0]}
      - {object: fridge, at: [5, 0]}
      - {object: shelf, at: [6, 0]}
      - {object: bar_counter, at: [0, 3]}
      - {object: stool, at: [1, 5], facing: N}
      - {object: stool, at: [3, 5], facing: N}
      - {object: stool, at: [5, 5], facing: N}
      - {object: stool, at: [7, 5], facing: N}
  sofa_set:             # sofa, side tables, coffee table in front
    size: [6, 4]
    parts:
      - {object: side_table, at: [0, 0]}
      - {object: sofa, at: [1, 0]}
      - {object: side_table, at: [5, 0]}
      - {object: coffee_table, at: [2, 2]}
  bed_set:              # single bed between two nightstands
    size: [4, 4]
    parts:
      - {object: nightstand, at: [0, 0]}
      - {object: bed, at: [1, 0]}
      - {object: nightstand, at: [3, 0]}
  double_bed_set:
    size: [6, 4]
    parts:
      - {object: nightstand, at: [0, 0]}
      - {object: double_bed, at: [1, 0]}
      - {object: nightstand, at: [5, 0]}
  patient_bed:          # hospital bed with IV stand and vital monitor
    size: [4, 4]
    parts:
      - {object: iv_stand, at: [0, 0]}
      - {object: hospital_bed, at: [1, 0]}
      - {object: vital_monitor, at: [3, 0]}
  reception_post:       # reception desk with the receptionist's chair behind it
    size: [5, 3]
    parts:
      - {object: chair, at: [2, 0]}
      - {object: reception_desk, at: [0, 1]}
  coat_check:           # a club's cloakroom counter at the door: coats and checked weapons
    size: [6, 3]
    parts:
      - {object: coat_rack, at: [0, 0]}
      - {object: coat_rack, at: [1, 0]}
      - {object: weapon_locker, at: [2, 0]}
      - {object: weapon_locker, at: [4, 0]}
      - {object: counter, at: [1, 2]}
  guard_post:
    size: [4, 3]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: guard_desk, at: [0, 1]}
  home_workstation:     # desk with its chair at home or in a hotel room
    size: [3, 3]
    parts:
      - {object: home_desk, at: [0, 0]}
      - {object: chair, at: [1, 2], facing: N}
  console:              # security / control console with its chair
    size: [3, 3]
    parts:
      - {object: console_desk, at: [0, 0]}
      - {object: chair, at: [1, 2], facing: N}
  executive_desk_set:   # executive desk, chair behind, two visitor chairs
    size: [3, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: executive_desk, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
      - {object: chair, at: [2, 3], facing: N}
  huddle_set:           # small meeting table, two chairs on each of two sides
    size: [4, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: chair, at: [2, 0]}
      - {object: huddle_table, at: [1, 1]}
      - {object: chair, at: [1, 3], facing: N}
      - {object: chair, at: [2, 3], facing: N}
  canteen_set:          # canteen table, two chairs on each of two sides, a gap beside it
    size: [3, 4]
    parts:
      - {object: chair, at: [0, 0]}
      - {object: chair, at: [1, 0]}
      - {object: canteen_table, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
      - {object: chair, at: [1, 3], facing: N}
  kitchen_table_set:
    size: [2, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: kitchen_table, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
  interview_set:        # suspect and detective across a bolted table
    size: [2, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: interview_table, at: [0, 1]}
      - {object: chair, at: [0, 3], facing: N}
  card_table_set:       # card table, the dealer behind it, four players in front
    size: [4, 4]
    parts:
      - {object: chair, at: [1, 0]}
      - {object: card_table, at: [0, 1]}
      - {object: stool, at: [0, 3], facing: N}
      - {object: stool, at: [1, 3], facing: N}
      - {object: stool, at: [2, 3], facing: N}
      - {object: stool, at: [3, 3], facing: N}
  roulette_set:         # roulette table, the croupier at the wheel end, players in front
    size: [5, 5]
    parts:
      - {object: chair, at: [4, 0]}
      - {object: roulette_table, at: [0, 1]}
      - {object: stool, at: [0, 4], facing: N}
      - {object: stool, at: [1, 4], facing: N}
      - {object: stool, at: [2, 4], facing: N}
      - {object: stool, at: [3, 4], facing: N}
  slot_bank:            # slot machines back to back, a stool in front of each
    size: [8, 4]
    parts:
      - {object: stool, at: [0, 0], facing: S}
      - {object: stool, at: [2, 0], facing: S}
      - {object: stool, at: [4, 0], facing: S}
      - {object: stool, at: [6, 0], facing: S}
      - {object: slot_machine, at: [0, 1], facing: N}
      - {object: slot_machine, at: [2, 1], facing: N}
      - {object: slot_machine, at: [4, 1], facing: N}
      - {object: slot_machine, at: [6, 1], facing: N}
      - {object: slot_machine, at: [0, 2]}
      - {object: slot_machine, at: [2, 2]}
      - {object: slot_machine, at: [4, 2]}
      - {object: slot_machine, at: [6, 2]}
      - {object: stool, at: [0, 3], facing: N}
      - {object: stool, at: [2, 3], facing: N}
      - {object: stool, at: [4, 3], facing: N}
      - {object: stool, at: [6, 3], facing: N}
