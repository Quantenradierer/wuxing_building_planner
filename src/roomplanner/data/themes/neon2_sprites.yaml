# The second cyberpunk sprite set (tools/sprite_prompts_neon2.yaml: the modern2 guides redrawn
# cyberpunk, picked in the sprite studio): the neon look with sprites from data/sprites/neon2/.
extends: neon_sprites
name: neon2_sprites
sprites: neon2
# Floors: fine grain, tiles and boards that differ a little in shade, joints with a lit lip,
# wood grain running along the boards. Each material is listed whole (merged one level deep).
noise: 0.1
grain_px: 3
