# Default theme: dark concrete, neon accents. Lengths in cells, colours #rrggbb[aa].
name: neon
background: "#07080c"
outside_pattern: grate
outside_lines: "#ffffff0a"
noise: 0.35
shadow: "#000000b0"
glow_radius: 0.35
label: "#e6e9f2"
grid: "#ffffff30"

walls:
  colour: "#9aa1b2"
  edge: "#1a1c24"
  exterior: 0.45
  interior: 0.22

doors:
  leaf: "#ffb347"
  exterior_leaf: "#ff4f9a"
  swing: "#ffb34766"

windows:
  frame: "#2a3040"
  glass: "#7ff3ff"
  glow: "#00606e"

default_material: concrete
materials:
  concrete:   {floor: "#262a33", pattern: tiles, tile: 4, lines: "#00000040"}
  corridor:   {floor: "#20242d", pattern: tiles, tile: 2, lines: "#00000048", accent: "#00e5ff"}
  lobby:      {floor: "#2b2733", pattern: tiles, tile: 3, lines: "#00000040", accent: "#ff3fa4"}
  carpet:     {floor: "#2b3040", pattern: plain}
  executive:  {floor: "#3a2f2a", pattern: planks, tile: 1, lines: "#00000050", accent: "#ffcc66"}
  wood:       {floor: "#3b3029", pattern: planks, tile: 1, lines: "#00000048"}
  wet:        {floor: "#2c3a3f", pattern: tiles, tile: 1, lines: "#ffffff14"}
  sterile:    {floor: "#39424a", pattern: tiles, tile: 2, lines: "#ffffff18", accent: "#6dffb0"}
  industrial: {floor: "#1d1f24", pattern: grate, lines: "#ffffff10"}
  tech:       {floor: "#161a24", pattern: tiles, tile: 2, lines: "#2de2ff22", accent: "#7c4dff"}
  shop:       {floor: "#2e3136", pattern: tiles, tile: 2, lines: "#00000038", accent: "#ff2e88"}
  stairs:     {floor: "#23262d", pattern: plain}

rooms:
  corridor: corridor
  hallway: wood
  lobby: lobby
  waiting_room: lobby
  reception: lobby
  stairwell: stairs
  elevator: stairs
  toilet: wet
  bathroom: wet
  kitchen: wet
  kitchenette: wet
  laundry: wet
  office: carpet
  open_office: carpet
  meeting_room: carpet
  doctor_office: carpet
  manager_office: carpet
  executive_office: executive
  board_room: executive
  living_room: wood
  bedroom: wood
  staff_room: wood
  exam_room: sterile
  treatment_room: sterile
  trauma_bay: sterile
  operating_room: sterile
  sterilization: sterile
  ward: sterile
  nurse_station: sterile
  pharmacy: sterile
  lab: sterile
  xray: sterile
  morgue: sterile
  utility: industrial
  loading_bay: industrial
  stockroom: industrial
  cold_storage: industrial
  storage: concrete
  archive: concrete
  mailroom: concrete
  server_room: tech
  security_room: tech
  sales_floor: shop
  prep_kitchen: wet

