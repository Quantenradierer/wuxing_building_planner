  stairs:          {shape: stairs, fill: "#2f3440", stroke: "#11131a", detail: "#aab2c5"}
  elevator_car:    {shape: elevator, fill: "#1c2029", stroke: "#ffb347", detail: "#ffb34799"}
  desk:            {shape: desk, fill: "#4a4038", stroke: "#15120f", detail: "#1b1f2a", glow: "#29b6f6"}
