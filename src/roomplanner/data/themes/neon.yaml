# Default theme: dark concrete, neon accents. Lengths in cells, colours #rrggbb[aa].
name: neon
background: "#07080c"
outside_pattern: grate
outside_lines: "#ffffff0a"
noise: 0.35
shadow: "#000000b0"
glow_radius: 0.35
label: "#e6e9f2"
grid: "#ffffff30"

walls:
  colour: "#9aa1b2"
  edge: "#1a1c24"
  exterior: 0.45
  interior: 0.22
  railing: 0.3
  open_air: [balcony, roof]

doors:
  leaf: "#ffb347"
  exterior_leaf: "#ff4f9a"
  swing: "#ffb34766"
  barricade: "#8a6a44"
  materials:
    glass: "#9fe8ffcc"
    security: "#aab4c6"
    blast: "#6f7a8c"
  locks:
    mechanical: "#c9cfdb"
    maglock: "#00e5ff"
    cardreader: "#ffb347"
    biometric: "#ff3fa4"

condition:
  rubble: "#5f5a52"
  stain: "#140c0660"
  graffiti: ["#ff3fa4", "#00e5ff", "#c6ff00", "#ffb347"]
  decals: {maintained: 0.02, run_down: 0.3, derelict: 0.6, ruined: 0.9}

devices:
  camera: "#ff3b30"
  motion_sensor: "#ffb347"
  alarm_panel: "#ff3fa4"

light_strength: 0.12
ambient: 0.72

windows:
  frame: "#2a3040"
  glass: "#7ff3ff"
  glow: "#00606e"

