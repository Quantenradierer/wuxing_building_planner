# Modern theme with painted object sprites (generated by tools/sprites_local.py, the local
# ComfyUI pipeline). A clean contemporary palette — light walls and floors, no neon glow —
# and the modern sprite set. Objects without a sprite keep their procedural shapes.
extends: neon
name: modern_sprites
sprites: modern

# A brighter, cleaner base than neon.
background: "#e9ebef"
outside_pattern: grate
outside_lines: "#0000000c"
noise: 0.12
shadow: "#00000055"
glow_radius: 0.0
light_strength: 0.0
ambient: 0.96
grid: "#00000018"
label: "#1a1d24"

walls:
  colour: "#3a3f4a"
  edge: "#c9cdd6"

doors:
  leaf: "#8a94a6"
  exterior_leaf: "#5b6478"
  swing: "#8a94a655"

condition:
  graffiti: ["#8a8f98", "#9aa0aa", "#b0b4bc"]
  decals: {maintained: 0.01, run_down: 0.15, derelict: 0.4, ruined: 0.7}

devices:
  camera: "#c0392b"
  motion_sensor: "#e0a030"
  alarm_panel: "#c0392b"

windows:
  frame: "#aeb4be"
  glass: "#cfe6ef"
  glow: "#00000000"

# Light, neon-free floors. Same keys as the base so every room type resolves; accents dropped.
materials:
  concrete:   {floor: "#d5d8de", pattern: tiles, tile: 4, lines: "#00000018"}
  corridor:   {floor: "#cdd0d7", pattern: tiles, tile: 2, lines: "#00000020"}
  lobby:      {floor: "#dcd6cc", pattern: tiles, tile: 3, lines: "#0000001c"}
  carpet:     {floor: "#c7cad3", pattern: plain}
  executive:  {floor: "#b89b7c", pattern: planks, tile: 1, lines: "#00000030"}
  wood:       {floor: "#caac85", pattern: planks, tile: 1, lines: "#00000028"}
  wet:        {floor: "#dde6e6", pattern: tiles, tile: 1, lines: "#00000018"}
  sterile:    {floor: "#eef2f4", pattern: tiles, tile: 2, lines: "#00000014"}
  industrial: {floor: "#bcbfc4", pattern: grate, lines: "#00000018"}
  tech:       {floor: "#c2c7cf", pattern: tiles, tile: 2, lines: "#0000001e"}
  shop:       {floor: "#d4d7db", pattern: tiles, tile: 2, lines: "#0000001c"}
  stairs:     {floor: "#c9ccd2", pattern: plain}
  club:       {floor: "#c6c1cb", pattern: tiles, tile: 2, lines: "#00000020"}
  pods:       {floor: "#cdd2da", pattern: tiles, tile: 2, lines: "#0000001c"}
  lab:        {floor: "#eef3f7", pattern: tiles, tile: 2, lines: "#00000014"}
  terrace:    {floor: "#c3b8a0", pattern: planks, tile: 1, lines: "#00000030"}
  rooftop:    {floor: "#cbced3", pattern: tiles, tile: 4, lines: "#0000001c"}

# Stand-ins mapping the many desk/table/bed variants onto the sprites we have so far.
sprite_fallbacks:
  office_desk: desk
  executive_desk: desk
  home_desk: desk
  console_desk: desk
  dining_table: table
  bar_table: table
  canteen_table: table
  kitchen_table: table
  interview_table: table
  coffee_table: table
  huddle_table: table
  board_table: meeting_table
  round_table: meeting_table
  table: meeting_table
  double_bed: bed
  mattress: bed
  weapon_rack: tool_rack
  reagent_shelf: shelf
  ramen_counter: bar_counter
  stock_pot: barrel
  clothes_rack: wardrobe
  mannequin: coat_rack
  display_table: table
  deli_counter: display_case
  butcher_block: table
  meat_rail: tool_rack

# Neutralise the base theme's neon on procedural objects that have no sprite yet (a sprite
# overrides these). No glow keys; muted modern fills. Merge is per-kind, so only these change.
default_object: {shape: box, fill: "#b9bec6", stroke: "#6b7079", detail: "#8a929e"}
objects:
  cubicle:         {shape: cubicle, fill: "#9aa0a8", stroke: "#5b616b", detail: "#c0c5cc"}
  rug:             {shape: rug, fill: "#cfd3da", stroke: "#a7abb2", detail: "#e2e5ea"}
  terminal:        {shape: screen, fill: "#2b2f38", stroke: "#15171d", detail: "#7b8595"}
