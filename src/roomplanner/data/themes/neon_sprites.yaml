  executive_desk: desk
  home_desk: desk
  console_desk: guard_desk
  dining_table: table
  bar_table: table
  canteen_table: table
  huddle_table: meeting_table
  kitchen_table: table
  interview_table: table
  coffee_table: table
  board_table: meeting_table
  round_table: meeting_table
  battery_bank: server_rack
  hvac_unit: machinery
  generator: machinery
  condenser: machinery
  satellite_dish: machinery
  fuel_tank: barrel
  suppression_tanks: server_rack
  drone_rack: tool_rack
  deposit_boxes: filing_cabinet
  sim_rig: armchair
  autokitchen: stove
  mattress: bed
  fire_barrel: barrel
  cyberware_rack: medical_cabinet
  cryo_pod: hospital_bed
  ambulance: car
  evidence_locker: weapon_locker
