# The neon theme with painted object sprites (generated by tools/sprites.py). Objects
# without a sprite (stairs, elevators, wall screens, ...) keep their neon shapes.
extends: neon
name: neon_sprites
sprites: midjourney
# Stand-ins for kinds that have no sprite yet (used only while <kind>.png is missing).
sprite_fallbacks:
  office_desk: desk
  executive_desk: desk
  home_desk: desk
  console_desk: guard_desk
  dining_table: table
  bar_table: table
  canteen_table: table
  kitchen_table: table
  interview_table: table
  coffee_table: table
  board_table: meeting_table
