# Prisons and detention centres (Lone Star, Knight Errant). Units are cells (1 cell = 0.5 m).
rooms:
  prison_lobby:         # the public entrance: visitors sign in and go through the scanner
    area: [40, 300]       # the program asks for less; a slice across the building is bigger
    min_side: 6
    transit: false        # visitors go no further than the visiting room
    stalls: {room: wc, width: 3, depth: 4, max: 1, rest_area: 40}   # a WC for visitors
    furniture:
      - {object: reception_post, placement: facing_exit}   # facing the entrance
      - {object: security_gate, placement: near_exit, count: [1, 2]}
      - {object: locker, placement: perimeter, count: [4, 10]}   # visitors' belongings
      - {object: bench, placement: wall, count: [1, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: trash_bin, placement: wall, count: [0, 1]}
  visiting_room:        # booths with a glass partition: visitors from the lobby, inmates from inside
    area: [60, 160]
    min_side: 6
    windows: forbidden
    access: [prison_lobby]
    connect: [prison_lobby]   # the visitors' door; the inmates come from the corridor
    furniture:
      - {object: visitor_booth_set, placement: rows, aisle: 2, margin: 1}
      - {object: guard_post, placement: wall, count: [0, 1]}
  prison_block:         # a housing unit: cells along both sides of the dayroom
    area: [120, 700]
    min_side: 10
    windows: forbidden
    door_width: 3
    vestibule: block_sallyport   # in through two interlocked doors
    stalls: {room: prison_cell, sides: 2, max: 10, passage: 5, rest: dayroom, single: dayroom}
  dayroom:              # what's left of a cell block: bolted tables, the trid, a guard post
    area: [24, 700]
    min_side: 4
    windows: forbidden
    furniture:
      - {object: guard_post, placement: near_exit, count: [0, 1]}
      - {object: canteen_set, placement: grid, per: 40, count: [1, 6], aisle: 2, margin: 1}
      - {object: wall_screen, placement: wall, count: [1, 2]}
      - {object: terminal, placement: wall, count: [0, 2]}   # the commcall terminals
      - {object: shower, placement: wall, count: [0, 2]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  prison_cell:          # 2 x 3 m: a bunk bed, a steel toilet with the basin on top
    area: [20, 40]
    min_side: 4
    windows: forbidden
    transit: false
    door_width: 2
    door_opens_out: true  # cell doors open into the dayroom
    templates:            # drawn with the door in the south wall
      - size: [4, 6]
        door: 2
        parts:
          - {object: bunk, at: [0, 0]}
          - {object: cell_toilet, at: [2, 0]}
      - size: [5, 6]      # a row's last cell, widened by a gap too narrow to use
        door: 3
        parts:
          - {object: bunk, at: [0, 0]}
          - {object: shelf, at: [3, 0]}
          - {object: cell_toilet, at: [3, 1]}
    furniture:            # other shapes
      - {object: bunk, placement: wall}
      - {object: cell_toilet, placement: corner}
  block_sallyport:      # between the corridor and a cell block: one door opens at a time
    area: [12, 120]
    min_side: 4
    windows: forbidden
    transit: true
    furniture:
      - {object: security_gate, placement: wall, count: [0, 1]}
      - {object: fire_extinguisher, placement: wall, count: [0, 1]}
  block_control:        # the guards' bubble beside a cell block: consoles and door controls
    area: [32, 60]
    min_side: 4
    windows: forbidden
    next_to: [prison_block]
    connect: [dayroom]    # a door straight into the block
    furniture:
      - {object: console, placement: wall, per: 40, count: [1, 2], scale: false}
      - {object: wall_screen, placement: wall, count: [1, 2]}
      - {object: weapon_locker, placement: wall, count: [0, 1]}
      - {object: coffee_machine, placement: corner, count: [0, 1]}
  segregation_unit:     # solitary: single cells along one wall, a narrow walk in front
    area: [40, 160]
    min_side: 8
    windows: forbidden
    door_width: 2
    stalls: {room: solitary_cell, max: 6, passage: 3, rest: segregation_walk, single: solitary_cell}
  segregation_walk:     # what's left of the segregation unit
    area: [12, 160]
    min_side: 3
    windows: forbidden
    furniture:
      - {object: guard_desk, placement: wall, count: [0, 1]}
  solitary_cell:        # 2 x 2.5 m: a bunk and a steel toilet, nothing else
    area: [16, 40]
    min_side: 4
    windows: forbidden
    transit: false
    door_width: 2
    door_opens_out: true
    templates:
      - size: [4, 5]
        door: 2
        parts:
          - {object: cot, at: [0, 0]}
          - {object: cell_toilet, at: [2, 0]}
    furniture:
      - {object: cot, placement: wall}
      - {object: cell_toilet, placement: corner}
  intake_room:          # strip search, scans and the prison jumpsuit
    area: [24, 70]
    min_side: 5
    windows: forbidden
    next_to: [sally_port]
    furniture:
      - {object: scanner, placement: wall, count: [0, 1]}
      - {object: counter, placement: wall}
      - {object: bench, placement: wall, count: [1, 2]}
      - {object: shelf, placement: wall, count: [0, 2]}   # jumpsuits and sandals
      - {object: terminal, placement: wall, count: [0, 1]}
  property_room:        # inmates' clothes and belongings in sealed bins
    area: [20, 80]
    min_side: 4
    windows: forbidden
    cluster: true
    furniture:
      - {object: shelf, placement: rows, aisle: 2, margin: 1}
      - {object: counter, placement: wall, count: [0, 1]}
  infirmary:            # beds behind a locked door, an exam table, the medicine cabinet
    area: [48, 160]
    min_side: 6
    windows: optional
    door_width: 3
    furniture:
      - {object: hospital_bed, placement: wall, per: 20, count: [2, 6]}
      - {object: exam_table, placement: wall, count: [0, 1]}
      - {object: medical_cabinet, placement: wall, count: [1, 2]}
      - {object: sink, placement: wall}
      - {object: medical_cart, placement: wall, count: [0, 1]}
  mess_hall:            # the inmates' canteen: bolted tables in rows, the servery hatch
    area: [80, 320]
    min_side: 8
    windows: optional
    door_width: 3
    furniture:
      - {object: counter, placement: wall, count: [1, 2]}
      - {object: canteen_set, placement: rows, aisle: 2, margin: 2}
      - {object: trash_bin, placement: wall, count: [1, 2]}
      - {object: guard_post, placement: wall, count: [0, 1]}
  prison_kitchen:       # cooks for the whole facility; inmates work here
    area: [40, 140]
    min_side: 6
    windows: optional
    next_to: [mess_hall]
    connect: [mess_hall]    # the servery
    furniture:
      - {object: stove, placement: wall, count: [2, 4]}
      - {object: counter, placement: wall, count: [2, 4]}
      - {object: fridge, placement: wall, count: [1, 3]}
      - {object: sink, placement: wall, count: [1, 2]}
      - {object: shelf, placement: wall, count: [0, 2]}
      - {object: fire_extinguisher, placement: wall}
  prison_laundry:       # industrial machines; inmate work detail
    area: [30, 100]
    min_side: 5
    windows: forbidden
    furniture:
      - {object: washing_machine, placement: wall, count: [3, 8]}
      - {object: dryer, placement: wall, count: [2, 4]}
      - {object: laundry_cart, placement: scatter, count: [1, 3]}
      - {object: counter, placement: center, count: [0, 1]}   # folding table
  prison_gym:           # weights and a punching bag instead of the yard
    area: [60, 200]
    min_side: 7
    windows: optional
    door_width: 3
    furniture:
      - {object: weight_bench, placement: wall, per: 30, count: [2, 5]}
      - {object: bench, placement: wall, count: [0, 2]}
      - {object: guard_post, placement: wall, count: [0, 1]}
  warden_office:        # the warden's desk, a screen with every camera
    wealth_shift: +1
    area: [30, 80]
    min_side: 5
    windows: required
    furniture:
      - {object: executive_desk_set, placement: back}
      - {object: wall_screen, placement: wall}
      - {object: filing_cabinet, placement: wall, count: [1, 3]}
      - {object: safe, placement: corner, count: [0, 1]}
      - {object: plant, placement: corner, count: [0, 1]}
