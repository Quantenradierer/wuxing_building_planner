# Units are cells: lengths in cells, areas in number of cells.
rooms:
  sales_floor:          # the hall; shelves and checkouts come with the furnishing layer
    area: [100, 100000]
    min_side: 10
    door_width: 3
    furniture:
      - {object: checkout, placement: near_exit, count: [1, 4]}
      - {object: freezer, placement: wall, count: [0, 3]}
      - {object: gondola, placement: rows, aisle: 3, margin: 3}
      - {object: guard_post, placement: near_exit, count: [0, 1], security: [low, corporate, aaa]}
      - {object: display_case, placement: wall, count: [0, 2]}
      - {object: atm, placement: wall, count: [0, 1]}
      - {object: pay_station, placement: wall, count: [0, 2]}   # credstick readers
  public_stairs:        # open stairs on the sales floor, against its back edge
    area: [40, 120]
    min_side: 5
    open: 1               # no walls to the hall on its long side and one end
    transit: false
    furniture:
      - {object: stairs, placement: fill, landing: 2, reach: 8}   # from the open end
  stockroom:
    area: [40, 100000]
    min_side: 6
    windows: forbidden
    door_width: 3
    furniture:
      - {object: rack, placement: rows, aisle: 3, margin: 2}
      - {object: pallet, placement: scatter, count: [0, 4]}
      - {object: crate, placement: scatter, count: [0, 3]}
      - {object: fire_extinguisher, placement: wall, count: [1, 2]}
  cold_storage:
    area: [16, 80]
    min_side: 4
    cluster: true
    access: [stockroom, prep_kitchen]
    windows: forbidden
    furniture:
      - {object: shelf, placement: wall, count: [2, 6]}
  loading_bay:
    area: [48, 160]
    min_side: 8
    windows: forbidden
    door_width: 4
    facade_door: 6         # the delivery dock
    next_to: [warehouse_floor, stockroom]
    connect: [stockroom, warehouse_floor]
    furniture:
      - {object: pallet, placement: scatter, count: [2, 6]}
      - {object: forklift, placement: scatter, count: [0, 1]}
      - {object: crate, placement: scatter, count: [0, 3]}
      - {object: barrel, placement: scatter, count: [0, 2]}
  manager_office:
    area: [32, 60]          # 8 m2: one workplace (ASR A1.2)
    min_side: 5
    furniture:
      - {object: desk_with_visitors, placement: wall}
      - {object: cabinet, placement: corner, count: [1, 2]}
      - {object: terminal, placement: corner, count: [0, 1]}
      - {object: safe, placement: corner, count: [0, 1]}
      - {object: filing_cabinet, placement: wall, count: [0, 1]}
  prep_kitchen:         # deli / bakery / soykaf bar
    area: [30, 90]
    min_side: 5
    next_to: [sales_floor, shop_floor]
    furniture:
      - {object: counter, placement: wall, count: [2, 3]}
      - {object: stove, placement: wall, count: [1, 2]}
      - {object: fridge, placement: wall, count: [1, 2]}
      - {object: sink, placement: wall}
      - {object: coffee_machine, placement: wall, count: [0, 1]}
  cashier_booth:        # armoured till behind a bulletproof pay window
    area: [9, 24]
    min_side: 3
    windows: forbidden
    transit: false
    next_to: [shop_floor, sales_floor]
    furniture:
      - {object: counter, placement: wall}
      - {object: safe, placement: corner}
      - {object: terminal, placement: corner, count: [0, 1]}
      - {object: stool, placement: at, at: counter, count: [0, 1]}
