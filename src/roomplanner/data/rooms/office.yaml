# Units are cells: lengths in cells, areas in number of cells.
rooms:
  office:
    area: [56, 110]
    min_side: 7
    max_aspect: 1.6           # roughly square, not a corridor of desks
    windows: required
    furniture:
      # 3-7 desks: pairs against the walls, an odd desk across the end of a pair.
      - {object: desk_pair, placement: wall, per: 16, count: [3, 7], head: desk_trio}
      - {object: filing_cabinet, placement: wall, per: 40, count: [1, 3]}
      - {object: cabinet, placement: corner, count: [0, 2]}
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: trash_bin, placement: scatter, count: [0, 1]}
  open_office:
    area: [160, 1200]
    min_side: 10
    windows: required
    door_width: 3
    furniture:
      - {object: workstation, placement: rows, aisle: 2, paired: true}
      - {object: copier, placement: wall, count: [1, 2]}
      - {object: filing_cabinet, placement: wall, per: 80, count: [1, 6]}
      - {object: plant, placement: corner, count: [1, 4]}
      - {object: water_cooler, placement: wall, count: [0, 1]}
      - {object: whiteboard, placement: wall, count: [0, 2]}
  meeting_room:
    area: [64, 128]
    min_side: 8               # 4 m: the table with its chairs and room to walk round them
    max_aspect: 2
    furniture:
      # The table fits the room: round in small ones, long or a U in big ones.
      - {object: meeting_set, placement: center,
         choose: [round_meeting_set, long_meeting_set, u_meeting_set]}
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: cabinet, placement: wall, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: whiteboard, placement: wall, count: [0, 1]}
  focus_room:               # windowless quiet room for one or two: calls, focused work
    area: [20, 48]
    min_side: 4
    furniture:
      - {object: workstation, placement: back}   # one desk, away from the door
      - {object: armchair, placement: corner, count: [0, 1]}
      - {object: plant, placement: corner, count: [0, 1]}
  copy_room:                # printers, paper, mail
    area: [20, 48]
    min_side: 4
    furniture:
      - {object: copier, placement: wall, count: [1, 2]}
      - {object: counter, placement: wall, count: [0, 1]}
      - {object: shelf, placement: wall, count: [1, 3]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  kitchenette:
    area: [24, 60]
    min_side: 4
    furniture:
      - {object: counter, placement: wall, count: 1}
      - {object: fridge, placement: wall, count: 1}
      - {object: kitchen_table_set, placement: center, count: [0, 1]}
      - {object: vending_machine, placement: wall, count: [0, 1]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
      - {object: coffee_machine, placement: wall}
      - {object: autokitchen, placement: wall, count: [0, 1]}
      - {object: sink, placement: wall, count: [0, 1]}
  server_room:
    area: [40, 160]
    min_side: 6
    windows: forbidden
    furniture:
      - {object: suppression_tanks, placement: wall, count: [0, 1]}
      - {object: server_rack, placement: rows, aisle: 2, margin: 1}
      - {object: fire_extinguisher, placement: corner}
  archive:
    area: [60, 240]
    min_side: 6
    windows: forbidden
    furniture:
      - {object: shelf, placement: rows, aisle: 2, margin: 1}
  executive_office:
    wealth_shift: +1          # fancier than the rest of the building
    area: [80, 160]
    min_side: 8
    windows: required
    furniture:
      - {object: executive_desk_set, placement: center}
      - {object: sofa_set, placement: wall}
      - {object: cabinet, placement: corner, count: [1, 2]}
      - {object: plant, placement: corner, count: [1, 2]}
      - {object: safe, placement: corner, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: shelf, placement: wall, count: [0, 2]}
  board_room:
    wealth_shift: +1          # fancier than the rest of the building
    area: [100, 240]
    min_side: 8
    windows: required
    door_width: 3
    furniture:
      - {object: board_set, placement: center}
      - {object: plant, placement: corner, count: [1, 2]}
      - {object: wall_screen, placement: wall}
  executive_quarters:   # the exec's private bedroom and shower for long nights
    wealth_shift: +1          # fancier than the rest of the building
    area: [40, 90]
    min_side: 5
    windows: optional
    transit: false
    access: [executive_office]
    next_to: [executive_office]
    furniture:
      - {object: double_bed_set, placement: wall}
      - {object: shower, placement: corner}
      - {object: sink, placement: wall}
      - {object: wardrobe, placement: wall, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
