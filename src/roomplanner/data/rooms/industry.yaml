# Warehouses, corp labs, corporate floors, hospitals, street docs.
rooms:
  warehouse_floor:      # the warehouse's hall
    area: [100, 100000]
    min_side: 10
    windows: optional
    door_width: 4
    facade_door: 6         # forklifts and vans straight into the hall
    furniture:
      - {object: rack, placement: rows, aisle: 4, margin: 3}
      - {object: pallet, placement: scatter, per: 120, count: [1, 10]}
      - {object: shipping_container, placement: wall, per: 500, count: [0, 3]}
      - {object: drone_dock, placement: scatter, count: [1, 3], security: [corporate, aaa]}
      - {object: forklift, placement: scatter, count: [0, 2]}
      - {object: crate, placement: scatter, per: 150, count: [0, 6]}
      - {object: barrel, placement: scatter, per: 150, count: [0, 6]}
      - {object: workbench, placement: wall, count: [0, 1]}
      - {object: fire_extinguisher, placement: wall, per: 300, count: [1, 4]}
  shipping_office:
    area: [24, 60]
    min_side: 5
    furniture:
      - {object: workstation, placement: wall, count: [1, 2]}
      - {object: filing_cabinet, placement: wall, count: [1, 3]}
      - {object: terminal, placement: corner}
      - {object: rigger_cocoon, placement: wall, count: [0, 1]}   # rigs the forklifts and drones
      - {object: coffee_machine, placement: corner, count: [0, 1]}
  clean_room:
    area: [60, 200]
    min_side: 7
    windows: forbidden
    door_width: 2
    vestibule: airlock
    furniture:
      - {object: lab_bench, placement: rows, aisle: 3, margin: 2}
      - {object: fume_hood, placement: wall, count: [1, 2]}
      - {object: stool, placement: at, at: lab_bench, count: [0, 1]}
      - {object: terminal, placement: wall, count: [0, 1]}
  wet_lab:
    area: [60, 160]
    min_side: 6
    furniture:
      - {object: lab_bench, placement: rows, aisle: 3, margin: 2}
      - {object: fume_hood, placement: wall, count: [1, 3]}
      - {object: specimen_fridge, placement: wall, count: [1, 2]}
      - {object: sink, placement: wall}
      - {object: stool, placement: at, at: lab_bench, count: [0, 1]}
      - {object: terminal, placement: wall, count: [0, 1]}
      - {object: fire_extinguisher, placement: wall}
  specimen_storage:
    area: [16, 48]
    min_side: 4
    windows: forbidden
    cluster: true
    access: [wet_lab, clean_room, lab]
    annex: 1.0                # always behind a lab if one fits
    furniture:
      - {object: specimen_fridge, placement: wall, per: 5, count: [2, 8]}
  test_chamber:
    area: [60, 160]
    min_side: 7
    windows: forbidden
    door_width: 3
    furniture:
      - {object: machinery, placement: center}
      - {object: terminal, placement: wall, count: [1, 3]}
      - {object: machinery, placement: wall, count: [0, 2]}
      - {object: workbench, placement: wall, count: [0, 1]}
      - {object: crate, placement: scatter, count: [0, 2]}
  corp_lobby:           # reception with a security checkpoint
    area: [80, 400]
    min_side: 8
    circulation: true
    furniture:
      - {object: reception_post, placement: center}
      - {object: security_gate, placement: near_exit, count: [2, 3]}
      - {object: plant, placement: corner, count: [2, 4]}
      - {object: bench, placement: wall, count: [1, 2]}
      - {object: wall_screen, placement: wall, count: [0, 2]}
      - {object: display_case, placement: wall, count: [0, 2]}
  cubicle_farm:
    area: [160, 1200]
    min_side: 10
    windows: required
    circulation: true         # no wall to the corridor: the traffic passes the cubicles
    door_width: 3
    furniture:
      - {object: cubicle, placement: rows, aisle: 2, paired: true, block: 30}   # back to back
      - {object: copier, placement: wall, count: [1, 2]}
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: water_cooler, placement: wall, count: [0, 1]}
      - {object: filing_cabinet, placement: wall, count: [0, 2]}
  airlock:              # gowning / air shower in front of a clean room
    area: [12, 40]
    min_side: 3
    windows: forbidden
    furniture:
      - {object: locker, placement: wall, count: [1, 3]}
      - {object: bench, placement: wall, count: [0, 1]}
  icu:
    area: [80, 200]
    min_side: 8
    next_to: [operating_room]
    windows: required
    door_width: 3
    furniture:
      - {object: patient_bed, placement: wall, per: 24, count: [2, 8]}
      - {object: machinery, placement: wall, per: 30, count: [1, 6]}
      - {object: medical_cabinet, placement: wall, count: [1, 2]}
  imaging:
    area: [60, 140]
    min_side: 7
    windows: forbidden
    door_width: 3
    furniture:
      - {object: scanner, placement: center}
      - {object: terminal, placement: wall, count: [1, 2]}
      - {object: medical_cabinet, placement: wall, count: [0, 1]}
      - {object: chair, placement: at, at: terminal, count: [0, 1]}
  cafeteria:
    area: [80, 300]
    min_side: 8
    windows: required
    door_width: 3
    furniture:
      - {object: canteen_set, placement: rows, aisle: 2, margin: 2}
      - {object: counter, placement: wall, count: [1, 2]}
      - {object: vending_machine, placement: wall, count: [1, 2]}
      - {object: trash_bin, placement: wall, count: [1, 2]}
      - {object: coffee_machine, placement: wall, count: [0, 1]}
  storefront:           # street doc's cover business (pawn shop, noodle bar)
    area: [40, 120]
    min_side: 6
    circulation: true
    furniture:
      - {object: counter, placement: wall}
      - {object: shelf, placement: wall, per: 8, count: [2, 8]}
      - {object: vending_machine, placement: wall, count: [0, 1]}
      - {object: display_case, placement: wall, count: [0, 2]}
      - {object: stool, placement: at, at: counter, count: [0, 1]}
      - {object: atm, placement: wall, count: [0, 1]}
  recovery_room:
    area: [30, 90]
    min_side: 5
    next_to: [operating_room]
    furniture:
      - {object: bed, placement: wall, per: 15, count: [1, 4]}
      - {object: medical_cabinet, placement: wall, count: [0, 1]}
      - {object: iv_stand, placement: at, at: bed, beside: [flanks], count: [0, 1]}
  back_room_or:         # the street doc's operating table
    area: [40, 100]
    min_side: 6
    windows: forbidden
    furniture:
      - {object: operating_table, placement: center}
      - {object: medical_cabinet, placement: wall, count: [1, 3]}
      - {object: cyberware_rack, placement: wall, count: [0, 1]}
      - {object: machinery, placement: wall, count: [0, 1]}
      - {object: sink, placement: wall}
      - {object: vital_monitor, placement: at, at: operating_table, beside: [flanks], count: [0, 1]}
      - {object: iv_stand, placement: at, at: operating_table, beside: [flanks], count: [0, 1]}
      - {object: crate, placement: scatter, count: [0, 1]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  shop_floor:           # convenience store hall
    area: [40, 100000]
    min_side: 6
    door_width: 2
    furniture:
      # Shelves first: a checkout in the middle of a small shop leaves room for two.
      - {object: gondola, placement: rows, aisle: 2, margin: 2}   # cramped, 1 m aisles
      - {object: checkout, placement: near_exit}
      - {object: pay_station, placement: wall, count: [0, 1]}   # credstick reader
      - {object: freezer, placement: wall, count: [1, 2]}
      - {object: vending_machine, placement: wall, count: [0, 2]}
      - {object: atm, placement: wall, count: [0, 1]}
      - {object: trash_bin, placement: wall, count: [0, 1]}
  # --- factory ---
  factory_floor:        # the production hall
    area: [100, 100000]
    min_side: 10
    windows: optional
    door_width: 4
    facade_door: 6         # a roller door
    furniture:
      - {object: conveyor, placement: rows, aisle: 4, margin: 3}
      - {object: machinery, placement: wall, per: 60, count: [2, 10]}
      - {object: robot_arm, placement: scatter, per: 150, count: [0, 6]}
      - {object: workbench, placement: wall, per: 150, count: [1, 4]}
      - {object: pallet, placement: scatter, per: 200, count: [0, 6]}
      - {object: forklift, placement: scatter, count: [0, 2]}
      - {object: drone_dock, placement: scatter, count: [1, 2], security: [corporate, aaa]}
      - {object: fire_extinguisher, placement: wall, per: 300, count: [1, 4]}
  control_room:         # overlooks the floor: screens and consoles
    area: [24, 70]
    min_side: 5
    next_to: [factory_floor]
    furniture:
      - {object: console, placement: wall, count: [1, 3]}
      - {object: rigger_cocoon, placement: wall, count: [0, 1]}   # rigs the forklifts and arms
      - {object: wall_screen, placement: wall, count: [1, 2]}
      - {object: server_rack, placement: wall, count: [0, 1]}
  paint_booth:
    area: [40, 120]
    min_side: 6
    windows: forbidden
    door_width: 4
    furniture:
      - {object: machinery, placement: wall, count: [1, 2]}
      - {object: barrel, placement: scatter, count: [1, 4]}
      - {object: fire_extinguisher, placement: corner}
  # --- parking garage ---
  parking_deck:         # one level of the garage: rows of cars, a ramp to the next level
    area: [100, 100000]
    min_side: 12
    windows: optional
    door_width: 4
    furniture:
      - {object: ramp, placement: fixed}   # lines up with the ramp on the next level
      - {object: car, placement: rows, aisle: 7, margin: 0, block: 40}   # a one-way 3.5 m lane
      - {object: pay_station, placement: wall, count: [0, 2]}
      - {object: drone_dock, placement: scatter, count: [1, 2], security: [corporate, aaa]}
      - {object: fire_extinguisher, placement: wall, per: 400, count: [1, 4]}
  attendant_booth:
    area: [9, 30]
    min_side: 3
    furniture:
      - {object: console, placement: wall}
      - {object: wall_screen, placement: wall, count: [0, 1]}
  # --- chop shop ---
  workshop_floor:       # cars on lifts, tools, parts everywhere
    area: [80, 100000]
    min_side: 10
    windows: optional
    door_width: 4
    facade_door: 6         # the roller door the cars come in through
    furniture:
      - {object: car_lift, placement: wall, per: 120, count: [1, 4]}
      - {object: car, placement: scatter, per: 150, count: [0, 3]}
      - {object: workbench, placement: wall, per: 80, count: [1, 4]}
      - {object: tool_rack, placement: wall, per: 80, count: [1, 4]}
      - {object: barrel, placement: scatter, per: 100, count: [1, 6]}
      - {object: crate, placement: scatter, per: 150, count: [0, 4]}
      - {object: fire_extinguisher, placement: wall, count: [1, 2]}
  # --- Sixth World extras ---
  rigger_workshop:      # drones on the bench, a rigger chair in the corner
    area: [40, 120]
    min_side: 6
    furniture:
      - {object: workbench, placement: wall, count: [1, 3]}
      - {object: drone_rack, placement: wall, count: [1, 3]}
      - {object: drone_dock, placement: scatter, count: [0, 2]}
      - {object: rigger_cocoon, placement: wall, count: [0, 1]}
      - {object: tool_rack, placement: wall, count: [0, 2]}
      - {object: crate, placement: scatter, count: [0, 2]}
      - {object: fire_extinguisher, placement: corner}
  contraband_store:     # goods that aren't on the manifest
    wealth_shift: -1
    area: [20, 80]
    min_side: 4
    windows: forbidden
    cluster: true
    access: [warehouse_floor, stockroom, workshop_floor, shipping_office, manager_office]
    annex: 0.8
    transit: false
    furniture:
      - {object: crate, placement: scatter, per: 12, count: [2, 6]}
      - {object: shelf, placement: wall, count: [1, 3]}
      - {object: weapon_locker, placement: wall, count: [0, 1]}
      - {object: safe, placement: corner, count: [0, 1]}
  decon_room:           # decontamination showers between the labs and the rest
    area: [16, 48]
    min_side: 4
    windows: forbidden
    next_to: [wet_lab, test_chamber]
    furniture:
      - {object: shower, placement: wall, count: [1, 3]}
      - {object: locker, placement: wall, count: [1, 3]}
      - {object: bench, placement: wall, count: [0, 1]}
      - {object: trash_bin, placement: corner}
  subject_holding:      # test subjects, "volunteers"
    area: [30, 90]
    min_side: 5
    windows: forbidden
    transit: false
    next_to: [test_chamber]
    furniture:
      - {object: bed, placement: wall, per: 15, count: [1, 4]}
      - {object: wc, placement: corner}
      - {object: sink, placement: wall}
      - {object: wall_screen, placement: wall, count: [0, 1]}
