# Units are cells: lengths in cells, areas in number of cells.
rooms:
  apartment:            # a unit, subdivided per the building program's `units:`
    area: [180, 360]
    min_side: 11
    windows: required
    door_width: 2
  hallway:              # in a deep unit it runs along the whole unit (T-shaped)
    area: [9, 90]
    min_side: 3
    furniture:
      - {object: wardrobe, placement: wall, count: [0, 1]}
      - {object: coat_rack, placement: corner, count: [0, 1]}
  living_room:
    area: [60, 160]
    min_side: 6
    windows: required
    access: [hallway]
    furniture:
      - {object: rug, placement: center, count: [0, 1]}
      - {object: sofa_set, placement: wall}
      - {object: kitchen_table_set, placement: scatter, count: [0, 1]}
      - {object: armchair, placement: scatter, count: [0, 2]}
      - {object: shelf, placement: wall, count: [0, 2]}
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}   # the trid
      - {object: sim_rig, placement: wall, count: [0, 1], wealth: [low, middle, high, luxury]}
      - {object: mattress, placement: scatter, count: [1, 2], wealth: [squatter]}
      - {object: fire_barrel, placement: scatter, count: [0, 1], wealth: [squatter]}
  bedroom:
    area: [40, 70]
    min_side: 5
    windows: required
    access: [living_room, hallway]
    transit: false
    furniture:
      - {object: bed_set, placement: wall}
      - {object: home_workstation, placement: wall, count: [0, 1]}
      - {object: wardrobe, placement: wall, count: [0, 1]}
      - {object: cabinet, placement: wall, count: [0, 2]}
  bathroom:
    area: [12, 30]
    min_side: 3
    access: [hallway, bedroom, living_room]
    transit: false
    furniture:
      - {object: wc, placement: wall}
      - {object: sink, placement: wall}
      - {object: shower, placement: corner, count: [0, 1]}
      - {object: cabinet, placement: wall, count: [0, 1]}
  closet:               # walk-in closet or pantry beside the entry hall
    area: [6, 40]
    min_side: 3
    windows: forbidden
    access: [hallway, kitchen, bedroom, living_room]
    transit: false
    furniture:
      - {object: shelf, placement: wall, count: [1, 3]}
      - {object: wardrobe, placement: wall, count: [0, 1]}
  kitchen:
    area: [16, 40]
    min_side: 4
    access: [hallway, living_room]
    furniture:
      - {object: counter, placement: wall}
      - {object: stove, placement: wall, wealth: [squatter, high, luxury]}   # hot plate / real cooking
      - {object: autokitchen, placement: wall, wealth: [low, middle, high, luxury]}
      - {object: fridge, placement: wall}
      - {object: kitchen_table_set, placement: scatter, count: [0, 1]}
      - {object: sink, placement: wall, count: [0, 1]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  laundry:
    area: [24, 60]
    min_side: 4
    windows: forbidden
    furniture:
      - {object: washing_machine, placement: wall, count: [2, 6]}
      - {object: dryer, placement: wall, count: [1, 3]}
      - {object: laundry_cart, placement: scatter, count: [0, 1]}
      - {object: table, placement: center, count: [0, 1]}
  mailroom:
    area: [12, 30]
    min_side: 3
    cluster: true
    furniture:
      - {object: mailboxes, placement: wall, count: [1, 3]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
