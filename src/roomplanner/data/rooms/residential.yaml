# Units are cells: lengths in cells, areas in number of cells.
rooms:
  apartment:            # a unit, subdivided per the building program's `units:`
    area: [180, 360]
    min_side: 11
    windows: required
    door_width: 2
  studio:               # a small flat for widths too narrow for an apartment
    area: [80, 200]
    min_side: 7
    windows: required
    door_width: 2
  inner_flat:           # a windowless flat in the interior rows: a den instead of a living room
    area: [80, 200]
    min_side: 7
    windows: forbidden
    door_width: 2
  hallway:              # in a deep unit it runs along the whole unit (T-shaped)
    area: [9, 90]
    min_side: 3
    furniture:
      - {object: wardrobe, placement: wall, count: [0, 1]}
      - {object: coat_rack, placement: corner, count: [0, 1]}
  living_room:
    area: [60, 160]
    min_side: 6
    windows: required
    access: [hallway]
    furniture:
      - {object: rug, placement: center, count: [0, 1]}
      - {object: lounge_set, placement: wall}
      - {object: kitchen_table_set, placement: scatter, count: [0, 1]}
      - {object: shelf, placement: wall, count: [0, 2]}
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}   # the trid
      - {object: sim_rig, placement: wall, count: [0, 1], wealth: [low, middle, high, luxury]}
      - {object: mattress, placement: scatter, count: [1, 2], wealth: [squatter]}
      - {object: fire_barrel, placement: scatter, count: [0, 1], wealth: [squatter]}
  den:                  # living and sleeping room of an inner flat, lit by lamps and the trid
    area: [40, 140]
    min_side: 6
    windows: forbidden
    access: [hallway]
    furniture:
      - {object: bed_set, placement: wall, spaced: true}
      - {object: sofa_set, placement: wall}
      - {object: rug, placement: center, count: [0, 1]}
      - {object: shelf, placement: wall, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}   # the trid
      - {object: sim_rig, placement: wall, count: [0, 1], wealth: [low, middle, high, luxury]}
      - {object: wardrobe, placement: wall, count: [0, 1]}
      - {object: mattress, placement: scatter, count: [1, 2], wealth: [squatter]}
  studio_room:          # the one room of a studio: living, sleeping and trid by the window
    area: [40, 140]
    min_side: 6
    windows: required
    access: [hallway]
    furniture:
      - {object: bed_set, placement: wall, spaced: true}
      - {object: lounge_set, placement: wall}
      - {object: rug, placement: center, count: [0, 1]}
      - {object: shelf, placement: wall, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}   # the trid
      - {object: wardrobe, placement: wall, count: [0, 1]}
      - {object: mattress, placement: scatter, count: [1, 2], wealth: [squatter]}
  bedroom:
    area: [40, 70]
    min_side: 5
    windows: required
    access: [living_room, hallway]
    transit: false
    furniture:
      - {object: bed_set, placement: wall, spaced: true}
      - {object: home_workstation, placement: wall, count: [0, 1]}
      - {object: wardrobe, placement: wall, count: [0, 1]}
      - {object: cabinet, placement: wall, count: [0, 2]}
  bathroom:
    area: [15, 32]
    min_side: 3
    access: [hallway, bedroom, living_room, guest_room]
    transit: false
    furniture:
      - {object: wc, placement: wall}
      - {object: sink, placement: wall}
      - {object: shower, placement: corner, count: [0, 1]}
      - {object: cabinet, placement: wall, count: [0, 1]}
  closet:               # walk-in closet or pantry beside the entry hall
    area: [6, 40]
    min_side: 3
    windows: forbidden
    access: [hallway, kitchen, bedroom, living_room, guest_room]
    transit: false
    furniture:
      - {object: shelf, placement: wall, count: [1, 3]}
      - {object: wardrobe, placement: wall, count: [0, 1]}
  kitchen:
    area: [16, 40]
    min_side: 4
    access: [hallway, living_room]
    furniture:
      - {object: counter, placement: wall}
      - {object: stove, placement: wall, wealth: [squatter, high, luxury]}   # hot plate / real cooking
      - {object: autokitchen, placement: wall, wealth: [low, middle, high, luxury]}
      - {object: fridge, placement: wall}
      - {object: kitchen_table_set, placement: scatter, count: [0, 1]}
      - {object: sink, placement: wall, count: [0, 1]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  laundry:
    area: [24, 60]
    min_side: 4
    windows: forbidden
    furniture:
      - {object: washing_machine, placement: wall, count: [2, 6]}
      - {object: dryer, placement: wall, count: [1, 3]}
      - {object: laundry_cart, placement: wall, count: [0, 1]}
      - {object: table, placement: center, count: [0, 1]}
  mailroom:
    area: [12, 30]
    min_side: 3
    cluster: true
    furniture:
      - {object: mailboxes, placement: wall, count: [1, 3]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  # --- single dwellings: safehouse, hacker den, mage's flat ---
  entry_hall:           # the flat's front door opens into it; the hall runs on from it
    area: [9, 40]
    min_side: 3
    circulation: true
    furniture:
      - {object: coat_rack, placement: corner, count: [0, 1]}
      - {object: wardrobe, placement: wall, count: [0, 1]}
  bunk_room:            # the team sleeps here: bunks, a locker each
    area: [30, 80]
    min_side: 5
    windows: required
    transit: false
    furniture:
      - {object: bunk_bed, placement: perimeter, count: [2, 4], sideways: true}
      - {object: locker, placement: wall, count: [1, 4]}
      - {object: crate, placement: scatter, count: [0, 1]}
      - {object: mattress, placement: scatter, count: [0, 2], wealth: [squatter, low]}
  gear_room:            # the safehouse armoury: guns, ammo, armour, a bench to fix them
    area: [16, 50]
    min_side: 4
    windows: forbidden
    transit: false
    furniture:
      - {object: gun_rack, placement: wall, count: [1, 3]}
      - {object: weapon_locker, placement: wall, count: [1, 3]}
      - {object: workbench, placement: wall, count: [0, 1]}
      - {object: crate, placement: scatter, count: [0, 2]}
      - {object: shelf, placement: wall, count: [0, 2]}
  med_room:             # the med corner: a cot to patch a runner up on, the medkit cabinet
    area: [16, 40]
    min_side: 4
    transit: false
    furniture:
      - {object: gurney_set, placement: wall, count: [1, 2], spaced: true}
      - {object: medical_cabinet, placement: wall, count: [1, 2]}
      - {object: medical_cart, placement: wall, count: [0, 1]}
      - {object: sink, placement: wall, count: [0, 1]}
  stash:                # hidden stash behind the wardrobe: cash, fake SINs, spare guns
    area: [6, 16]
    min_side: 3
    windows: forbidden
    transit: false
    cluster: true
    access: [bedroom, bunk_room, closet, kitchen]
    annex: 1.0
    furniture:
      - {object: safe, placement: corner}
      - {object: crate, placement: wall, count: [0, 1]}
      - {object: weapon_locker, placement: wall, count: [0, 1]}
  rig_room:             # the decker's / rigger's den: cocoon, consoles, screens, drones
    area: [30, 90]
    min_side: 5
    windows: required         # blinds down, but a flat's room
    furniture:
      - {object: rigger_cocoon, placement: wall}
      - {object: console, placement: wall, per: 40, count: [1, 2], scale: false}
      - {object: server_rack, placement: wall, count: [1, 2]}
      - {object: wall_screen, placement: wall, count: [1, 3]}
      - {object: portable_ac, placement: corner, count: [1, 2]}
      - {object: drone_rack, placement: wall, count: [0, 1]}
      - {object: drone_dock, placement: scatter, count: [0, 2]}
      - {object: sim_rig, placement: wall, count: [0, 1]}
      - {object: cable_clutter, placement: scatter, count: [1, 3]}
      - {object: trash_pile, placement: scatter, count: [0, 1], wealth: [squatter, low]}
  server_closet:        # racks humming behind a door, cooled by whatever was cheap
    area: [9, 30]
    min_side: 3
    windows: forbidden
    transit: false
    cluster: true
    furniture:
      - {object: server_rack, placement: wall, count: [1, 4]}
      - {object: portable_ac, placement: corner, count: [1, 2]}
      - {object: battery_bank, placement: wall, count: [0, 1]}
      - {object: cable_clutter, placement: scatter, count: [0, 1]}
  library:              # the hermetic library: grimoires, a reading chair, the desk
    area: [30, 90]
    min_side: 5
    windows: required
    furniture:
      - {object: bookshelf, placement: perimeter, count: [3, 8]}
      - {object: home_workstation, placement: wall}
      - {object: armchair, placement: scatter, count: [1, 2]}
      - {object: side_table, placement: at, at: armchair, beside: [flanks], count: [0, 1]}
      - {object: rug, placement: center, count: [0, 1]}
      - {object: candle_stand, placement: corner, count: [0, 1]}
  lodge:                # the mage's ritual room: a circle on the floor, the altar at its head, candles
    area: [49, 120]
    min_side: 7
    windows: forbidden
    transit: false
    furniture:
      - {object: ritual_circle, placement: center}
      - {object: altar, placement: end}
      - {object: candle_stand, placement: corner, count: [2, 4]}
      - {object: ward_sigil, placement: corner, count: [0, 1]}
      - {object: shelf, placement: wall, count: [0, 2]}
  alchemy_lab:          # the alchemy corner: bench, reagents, herbs drying
    area: [16, 45]
    min_side: 4
    windows: optional
    furniture:
      - {object: alchemy_bench, placement: wall}
      - {object: shelf, placement: wall, count: [1, 3]}
      - {object: sink, placement: wall, count: [0, 1]}
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: fume_hood, placement: wall, count: [0, 1], wealth: [middle, high, luxury]}
