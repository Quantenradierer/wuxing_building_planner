# Rooms shared by most building types.
# Units are cells (1 cell = 0.5 m): lengths in cells, areas in number of cells.
rooms:
  corridor:
    area: [4, 40000]
    min_side: 3
    circulation: true
    furniture:       # code-mandated, sparse: one of each per long stretch of corridor
      - {object: fire_extinguisher, placement: wall, even: true, per: 150, count: [1, 12]}
      - {object: fire_alarm_panel, placement: wall, even: true, per: 400, count: [0, 2]}
      - {object: hydrant, placement: wall, even: true, per: 600, count: [0, 2]}
      - {object: medkit, placement: wall, even: true, per: 500, count: [0, 3]}
      - {object: trash_bin, placement: wall, even: true, per: 400, count: [0, 3]}
  lobby:
    area: [60, 800]
    min_side: 6
    circulation: true
    wealth:
      luxury: {area: [160, 400]}   # grand lobby
    furniture:
      - {object: plant, placement: corner, count: [1, 4]}
      - {object: bench, placement: wall, count: [1, 3]}
      - {object: lounge_set, placement: wall, per: 200, count: [0, 3]}
      - {object: trash_bin, placement: wall, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: atm, placement: wall, count: [0, 1]}
      - {object: fire_alarm_panel, placement: wall, count: [0, 1]}
      - {object: medkit, placement: wall, count: [0, 1]}
  reception_lobby:      # lobby with the reception desk facing the entrance
    area: [60, 800]
    min_side: 8
    circulation: true
    furniture:
      - {object: reception_post, placement: facing_exit}   # facing the entrance
      - {object: plant, placement: corner, count: [1, 4]}
      - {object: bench, placement: wall, count: [1, 3]}
      - {object: lounge_set, placement: wall, per: 200, count: [0, 3]}
      - {object: trash_bin, placement: wall, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: fire_alarm_panel, placement: wall, count: [0, 1]}
      - {object: medkit, placement: wall, count: [0, 1]}
  stairwell:
    area: [45, 240]       # 2.5 x 4.5 m flight with landings (DIN 18065)
    min_side: 5
    wealth:               # the code minimum does not shrink with the tier
      squatter: {area: [45, 180]}
      low: {area: [45, 216]}
    transit: false        # no rooms open into it (but the core's elevator may)
    furniture:
      - {object: stairs, placement: fill, landing: 2, reach: 8}   # at the door: same spot on every floor
  elevator:
    area: [12, 80]
    min_side: 3
    windows: forbidden
    transit: false        # rooms open onto a landing, not into the car
    door_slides: true
    furniture:
      - {object: elevator_car, placement: fill}   # the car is the shaft
  toilet:               # public toilet: stalls along one wall, sinks outside
    area: [24, 56]
    min_side: 3
    cluster: true
    stalls: {room: stall, max: 3, rest_area: 16, single: wc}
    furniture:
      # A wash row: side by side on one wall by the entrance, not against the stalls, one
      # sink per two stalls; the bin at its end.
      - {object: sink, placement: wall, line: true, not_against: [stall], count: [1, 3],
         per_room: [stall, 2]}
      - {object: trash_bin, placement: at, at: sink, beside: [flanks], limit: 1}
  stall:                # a toilet cubicle, 1 x 1.5 m, carved out of a public toilet
    area: [4, 12]
    min_side: 2
    door_width: 1       # a narrow cubicle door keeps its clearance off the wc
    windows: forbidden
    transit: false
    templates:          # drawn with the door in the south wall
      - size: [2, 3]
        door: 0
        parts:
          - {object: wc, at: [0, 0]}
    furniture:          # a stall widened by a gap too narrow to use
      - {object: wc, placement: back}
  wc:                   # single toilet room (a public toilet too small for stalls)
    area: [12, 32]
    min_side: 2
    transit: false
    furniture:
      - {object: wc, placement: wall}
      - {object: sink, placement: wall}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  storage:
    area: [12, 80]
    min_side: 3
    cluster: true
    # Also a closet inside one of these (entered through it), `annex` of the time (0.5).
    access: [office, executive_office, manager_office, kitchenette, kitchen, staff_room,
             stockroom, treatment_room, lab, nurse_station, meeting_room]
    furniture:
      - {object: shelf, placement: wall, per: 5, count: [2, 16]}
      - {object: crate, placement: wall, per: 30, count: [0, 3]}
      - {object: cabinet, placement: wall, count: [0, 2]}
  utility:
    wealth_shift: -1          # plainer than the rest of the building
    area: [32, 120]
    min_side: 4
    windows: forbidden
    furniture:
      - {object: sink, placement: wall}                      # the janitor's mop sink
      - {object: shelf, placement: wall, count: [1, 3]}      # cleaning supplies
      - {object: laundry_cart, placement: wall, count: [1, 2]}   # the janitor's cart
      - {object: trash_bin, placement: wall, count: [1, 2]}
      - {object: machinery, placement: wall, per: 60, count: [0, 2]}
      - {object: crate, placement: wall, count: [0, 2]}
      - {object: workbench, placement: wall, count: [0, 1]}
      - {object: fire_extinguisher, placement: wall}
  security_room:
    area: [32, 50]            # 8 m2: a guard at a desk (ASR A1.2)
    min_side: 4
    windows: forbidden
    furniture:
      - {object: wall_screen, placement: end}
      - {object: console, placement: rows, aisle: 1, margin: 1, block: 12, toward: wall_screen}
      - {object: terminal, placement: wall, count: [0, 2]}
      - {object: locker, placement: wall, count: [0, 2]}
      - {object: coffee_machine, placement: corner, count: [0, 1]}
  roof:                 # a flat roof: the core rises through it, climate plant around
    area: [20, 100000]
    min_side: 3
    circulation: true         # the stair housing opens onto it
    outdoor: true
    furniture:
      - {object: hvac_unit, placement: scatter, per: 250, count: [1, 6]}
      - {object: condenser, placement: scatter, per: 120, count: [2, 12]}
      - {object: electrical_panel, placement: wall, count: [1, 2]}   # against the stair housing
      - {object: satellite_dish, placement: scatter, count: [0, 2]}
  guard_room:           # the security staff's break room between patrols
    area: [30, 80]
    min_side: 5
    windows: forbidden
    next_to: [security_room]
    furniture:
      - {object: canteen_set, placement: center}
      - {object: locker, placement: perimeter, count: [4, 8]}
      - {object: weapon_locker, placement: wall, count: [1, 2]}
      - {object: bed_set, placement: wall, spaced: true, count: [0, 1]}             # a cot for the night shift
      - {object: wall_screen, placement: wall}                    # the camera feeds
      - {object: coffee_machine, placement: corner}
      - {object: fridge, placement: wall, count: [0, 1]}
      - {object: medkit, placement: wall, count: [0, 1]}
  reception:
    area: [16, 40]
    min_side: 4
    furniture:
      - {object: reception_post, placement: wall, faces_door: true}
      - {object: terminal, placement: corner, count: [0, 1]}
      - {object: plant, placement: corner, count: [0, 1]}
  staff_room:
    wealth_shift: -1          # plainer than the rest of the building
    area: [30, 70]
    min_side: 5
    furniture:
      - {object: canteen_set, placement: center}
      - {object: locker, placement: wall, count: [2, 6]}
      - {object: sofa, placement: wall, count: [0, 1]}
      - {object: coffee_machine, placement: wall, count: [0, 1]}
      - {object: fridge, placement: wall, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
  # --- building services and security tech (Sixth World) ---
  electrical_room:      # switchboards, UPS batteries, the building's network patch panels
    wealth_shift: -1
    area: [16, 48]
    min_side: 4
    transit: false        # technical rooms are no thoroughfares
    windows: forbidden
    cluster: true
    # Also a closet inside a back-of-house room, `annex` of the time.
    access: [utility, stockroom, loading_bay, staff_room, shipping_office, manager_office]
    annex: 0.6
    furniture:
      - {object: electrical_panel, placement: wall, per: 8, count: [2, 6]}
      - {object: server_rack, placement: wall, count: [0, 1]}
      - {object: battery_bank, placement: wall, count: [0, 2]}
      - {object: fire_extinguisher, placement: corner}
  network_closet:       # a floor's switches and Matrix access points
    area: [9, 24]
    min_side: 3
    transit: false
    windows: forbidden
    cluster: true
    furniture:
      - {object: server_rack, placement: wall, count: [1, 2]}
      - {object: electrical_panel, placement: wall, count: [0, 1]}
  mechanical_room:      # air handlers; ducts from here run through the whole building
    wealth_shift: -1
    area: [30, 160]
    min_side: 4
    transit: false
    windows: forbidden
    furniture:
      - {object: hvac_unit, placement: wall, per: 30, count: [1, 4]}
      - {object: electrical_panel, placement: wall, count: [1, 2]}
      - {object: machinery, placement: wall, count: [0, 1]}
      - {object: fire_extinguisher, placement: corner}
  generator_room:       # backup power: diesel generator, fuel, switchover panel
    wealth_shift: -1
    area: [32, 90]
    min_side: 6
    transit: false
    windows: forbidden
    furniture:
      - {object: generator, placement: center}
      - {object: fuel_tank, placement: wall, count: [1, 2]}
      - {object: electrical_panel, placement: wall, count: [1, 2]}
      - {object: battery_bank, placement: wall, count: [0, 2]}
      - {object: fire_extinguisher, placement: corner}
  host_room:            # the building's Matrix host: racks, cooling, gas suppression
    area: [40, 120]
    min_side: 6
    windows: forbidden
    furniture:
      - {object: server_rack, placement: rows, aisle: 2, margin: 2}
      - {object: console, placement: wall}
      - {object: suppression_tanks, placement: wall, count: [1, 2]}
      - {object: hvac_unit, placement: wall, count: [0, 1]}
  spider_room:          # security rigger / spider: drones and cameras, jacked in
    area: [24, 70]
    min_side: 5
    windows: forbidden
    furniture:
      - {object: rigger_cocoon, placement: wall, count: [1, 2]}
      - {object: wall_screen, placement: end}
      - {object: console, placement: rows, aisle: 1, margin: 1, block: 12, toward: wall_screen}
      - {object: wall_screen, placement: wall, count: [0, 2]}
      - {object: server_rack, placement: wall, count: [0, 1]}
      - {object: weapon_locker, placement: wall, count: [0, 1]}
  drone_bay:            # security drones charging in rows, spares on the wall
    area: [30, 100]
    min_side: 5
    windows: optional
    door_width: 3
    furniture:
      - {object: drone_dock, placement: grid, per: 12, count: [2, 8], aisle: 2, margin: 1}
      - {object: drone_rack, placement: perimeter, count: [1, 3]}
      - {object: workbench, placement: wall, count: [0, 1]}
      - {object: electrical_panel, placement: wall, count: [0, 1]}
      - {object: fire_extinguisher, placement: corner}
  vault:                # cash, paydata on chips, deposit boxes
    area: [16, 60]
    min_side: 4
    windows: forbidden
    transit: false
    access: [count_room]      # a casino vault: entered through the count room
    furniture:
      - {object: deposit_boxes, placement: wall, per: 6, count: [1, 6]}
      - {object: safe, placement: corner, count: [1, 2]}
      - {object: crate, placement: scatter, count: [0, 2]}
      - {object: suppression_tanks, placement: wall, count: [0, 1]}
  safe_room:            # panic room: supplies, a terminal, a way to call for help
    area: [12, 40]
    min_side: 4
    windows: forbidden
    transit: false
    cluster: true
    access: [executive_office, manager_office, board_room, vip_room, bedroom,
             bunk_room]
    annex: 0.8
    furniture:
      - {object: bench, placement: wall}
      - {object: terminal, placement: wall}
      - {object: shelf, placement: wall, count: [1, 2]}
      - {object: weapon_locker, placement: wall, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
  vending_room:         # soykaf, stuffer snacks, Nuke-It meals
    area: [12, 36]
    min_side: 3
    cluster: true
    open: 1                   # no walls to the corridor; machines line the other walls
    furniture:
      # Machines line the walls (the open sides stay free); big rooms get a back-to-back
      # double row in the middle; the bin takes what is left.
      - {object: vending_machine, placement: perimeter, count: 40}
      - {object: vending_machine, placement: rows, paired: true, margin: 3, aisle: 2, block: 10}
      - {object: trash_bin, placement: scatter}
  car_park:             # a building's basement parking: claims one whole end of the level first
    area: [600, 1800]
    min_side: 16
    max_aspect: 6
    windows: forbidden
    door_width: 4
    facade_door: 6         # the ramp up to the street
    connect: [storage, electrical_room, mechanical_room, utility]   # more than the one corridor door
    furniture:
      - {object: car, placement: rows, aisle: 10, gap: 1, lanes: true, margin: 0, block: 40,
         front_clear: 10, fill: 0.66}   # 2.5 m stalls facing 5 m drive lanes
      - {object: fire_extinguisher, placement: wall, per: 200, count: [1, 4]}
      - {object: pay_station, placement: wall, count: [0, 1]}
  garage:               # vehicle bay: patrol cars, vans, the boss's limo
    area: [100, 400]
    min_side: 10
    windows: optional
    door_width: 4
    facade_door: 6         # a roller door
    furniture:
      - {object: car, placement: rows, aisle: 8, margin: 0, block: 40}
      - {object: tool_rack, placement: wall, count: [0, 2]}
      - {object: fire_extinguisher, placement: wall}
