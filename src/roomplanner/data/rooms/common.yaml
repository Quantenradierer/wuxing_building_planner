# Rooms shared by most building types. Areas in m², lengths in m.
rooms:
  corridor:
    area_m2: [1, 10000]
    min_side_m: 1.5
    circulation: true
  lobby:
    area_m2: [15, 200]
    min_side_m: 3
    circulation: true
  stairwell:
    area_m2: [10, 60]
    min_side_m: 2.5
  elevator:
    area_m2: [3, 20]
    min_side_m: 1.5
    windows: forbidden
  toilet:
    area_m2: [3, 8]
    min_side_m: 1.5
  storage:
    area_m2: [3, 20]
    min_side_m: 1.5
  utility:
    area_m2: [8, 30]
    min_side_m: 2
    windows: forbidden
