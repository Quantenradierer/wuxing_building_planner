# Rooms shared by most building types.
# Units are cells (1 cell = 0.5 m): lengths in cells, areas in number of cells.
rooms:
  corridor:
    area: [4, 40000]
    min_side: 3
    circulation: true
  lobby:
    area: [60, 800]
    min_side: 6
    circulation: true
    wealth:
      luxury: {area: [160, 400]}   # grand lobby
    furniture:
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: bench, placement: wall, count: [0, 2]}
  stairwell:
    area: [40, 240]
    min_side: 5
  elevator:
    area: [12, 80]
    min_side: 3
    windows: forbidden
  toilet:
    area: [12, 32]
    min_side: 3
    furniture:
      - {object: wc, placement: wall, count: [1, 3]}
      - {object: sink, placement: wall, count: [1, 2]}
  storage:
    area: [12, 80]
    min_side: 3
    furniture:
      - {object: shelf, placement: wall, count: [3, 10]}
  utility:
    area: [32, 120]
    min_side: 4
    windows: forbidden
    furniture:
      - {object: machinery, placement: wall, count: [1, 3]}
