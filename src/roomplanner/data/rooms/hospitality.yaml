# Hotels, capsule hotels, bars and clubs. Units are cells (1 cell = 0.5 m).
rooms:
  hotel_room:           # a unit, subdivided per the program's `units:`
    area: [70, 140]
    min_side: 8
    windows: required
    wealth:
      luxury: {area: [140, 260], min_side: 10}   # suites
  guest_room:
    area: [36, 120]
    min_side: 5
    windows: required
    access: [hallway]
    furniture:
      - {object: double_bed_set, placement: wall}
      - {object: home_workstation, placement: wall, count: [0, 1]}
      - {object: cabinet, placement: wall, count: [1, 2]}
      - {object: armchair, placement: scatter, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: wardrobe, placement: wall, count: [0, 1]}
  capsule_dorm:         # rows of sleeping pods, back to back
    area: [240, 900]
    min_side: 10
    furniture:
      - {object: capsule, placement: rows, aisle: 3, margin: 0, paired: true}
  shower_room:
    area: [16, 48]
    min_side: 4
    cluster: true
    furniture:
      - {object: shower, placement: wall, per: 8, count: [1, 4]}
      - {object: sink, placement: wall, count: [1, 2]}
      - {object: bench, placement: center, count: [0, 1]}
  locker_room:
    wealth_shift: -1          # plainer than the rest of the building
    area: [16, 48]
    min_side: 4
    cluster: true
    furniture:
      - {object: locker, placement: wall, per: 3, count: [2, 16]}
      - {object: bench, placement: center, count: [0, 1]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  linen_room:
    area: [12, 30]
    min_side: 3
    cluster: true
    access: [staff_room]
    furniture:
      - {object: shelf, placement: wall, per: 5, count: [2, 8]}
      - {object: laundry_cart, placement: scatter, count: [0, 2]}
  restaurant:
    area: [80, 300]
    min_side: 8
    windows: required
    door_width: 3
    furniture:
      - {object: dining_set, placement: rows, aisle: 2, margin: 2}
      - {object: counter, placement: wall, count: [0, 1]}
      - {object: plant, placement: corner, count: [1, 3]}
      - {object: coat_rack, placement: corner, count: [0, 1]}
  commercial_kitchen:
    area: [40, 140]
    min_side: 6
    windows: optional
    next_to: [restaurant]
    connect: [restaurant]   # the pass: a door straight into the dining room
    furniture:
      - {object: stove, placement: wall, count: [2, 4]}
      - {object: counter, placement: wall, count: [2, 4]}
      - {object: fridge, placement: wall, count: [1, 3]}
      - {object: fire_extinguisher, placement: wall}
      - {object: counter, placement: center, count: [0, 1]}
      - {object: sink, placement: wall, count: [1, 2]}
      - {object: shelf, placement: wall, count: [0, 2]}
      - {object: trash_bin, placement: corner, count: [0, 1]}
  bar_room:
    area: [60, 200]
    min_side: 7
    door_width: 3
    furniture:
      - {object: bar_set, placement: wall}
      - {object: cafe_table, placement: grid, per: 24, count: [2, 8]}
      - {object: sofa, placement: wall, count: [0, 2]}
      - {object: arcade_machine, placement: wall, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: pool_table, placement: center, count: [0, 1]}
  dance_floor:          # the club's hall
    area: [100, 100000]
    min_side: 10
    door_width: 4
    furniture:
      - {object: bar_set, placement: wall, count: [1, 2]}
      - {object: guard_post, placement: near_exit}                      # bouncer at the door
      - {object: security_gate, placement: near_exit, count: [0, 2]}   # MAD scanner
      - {object: cafe_table, placement: grid, per: 60, count: [1, 6]}
      - {object: dj_booth, placement: wall}
      - {object: speaker, placement: corner, count: [2, 4]}
      - {object: sofa, placement: wall, count: [1, 4]}
      - {object: stage, placement: wall, count: [0, 1]}
  lounge:               # upper club floors
    area: [80, 100000]
    min_side: 10
    door_width: 3
    furniture:
      - {object: bar_set, placement: wall}
      - {object: sofa_set, placement: wall, per: 60, count: [1, 6]}
      - {object: cafe_table, placement: grid, per: 60, count: [0, 4]}
      - {object: pool_table, placement: center, count: [0, 2]}
      - {object: arcade_machine, placement: wall, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
  vip_room:
    wealth_shift: +1          # fancier than the rest of the building
    area: [30, 90]
    min_side: 5
    furniture:
      - {object: sofa, placement: wall, count: [1, 3]}
      - {object: sofa_set, placement: wall}
      - {object: rug, placement: center, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: counter, placement: wall, count: [0, 1]}
      - {object: plant, placement: corner, count: [0, 1]}
  backstage:
    wealth_shift: -1          # plainer than the rest of the building
    area: [30, 90]
    min_side: 5
    furniture:
      - {object: locker, placement: wall, count: [2, 6]}
      - {object: sofa, placement: wall, count: [0, 1]}
      - {object: crate, placement: scatter, count: [1, 3]}
      - {object: workstation, placement: wall, count: [0, 1]}
      - {object: coat_rack, placement: corner, count: [0, 2]}
  cloakroom:
    area: [12, 36]
    min_side: 4
    furniture:
      - {object: counter, placement: wall}
      - {object: shelf, placement: wall, count: [1, 3]}
      - {object: weapon_locker, placement: wall, count: [1, 3]}   # weapons are checked here
      - {object: coat_rack, placement: scatter, count: [1, 3]}
  coffin_unit:          # coffin motel / squat block: a bunk and a locker, ~2 x 2 m
    area: [12, 20]
    min_side: 4                 # the 2 m bunk must fit beside the door
    wealth:                     # a capsule can't shrink further: the bunk must still fit
      squatter: {area: [14, 20]}
      low: {area: [14, 20]}
    cluster: true         # stacked along side hallways where strips are deep
    max_aspect: 3
    furniture:
      - {object: bed, placement: wall}
      - {object: locker, placement: wall, count: [0, 1]}
      - {object: wall_screen, placement: wall, count: [0, 1]}   # a trid panel over the bunk
      - {object: trash_bin, placement: corner, count: [0, 1]}
  taproom:              # a dive bar's hall: bar, booths, pool table
    area: [60, 100000]
    min_side: 8
    windows: optional
    door_width: 3
    furniture:
      - {object: bar_set, placement: back}   # away from the street door
      - {object: guard_post, placement: near_exit, count: [0, 1]}   # the bouncer
      - {object: sofa_set, placement: wall, per: 80, count: [0, 3]}
      - {object: cafe_table, placement: grid, per: 30, count: [2, 10]}
      - {object: pool_table, placement: center, count: [0, 1]}
      - {object: arcade_machine, placement: wall, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 2]}
      - {object: sim_rig, placement: wall, count: [1, 2], wealth: [squatter, low]}   # BTL corner
      - {object: trash_bin, placement: corner, count: [1, 2]}
  fixer_room:           # the back booth where the fixer meets runners
    wealth_shift: -1
    area: [20, 50]
    min_side: 4
    windows: forbidden
    transit: false
    furniture:
      - {object: sofa_set, placement: wall}
      - {object: safe, placement: corner, count: [0, 1]}
      - {object: terminal, placement: corner, count: [0, 1]}
      - {object: weapon_locker, placement: wall, count: [0, 1]}
