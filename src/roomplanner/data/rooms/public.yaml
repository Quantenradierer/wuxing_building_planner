# Police stations and churches. Units are cells (1 cell = 0.5 m).
rooms:
  # --- police station (Lone Star / Knight Errant precinct) ---
  squad_room:           # open plan desks of the officers
    area: [120, 600]
    min_side: 10
    windows: required
    door_width: 3
    furniture:
      - {object: workstation, placement: rows, aisle: 2, paired: true}
      - {object: whiteboard, placement: wall, count: [1, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: filing_cabinet, placement: wall, per: 60, count: [1, 4]}
      - {object: coffee_machine, placement: corner, count: [0, 1]}
  briefing_room:
    area: [60, 160]
    min_side: 7
    furniture:
      - {object: bench, placement: rows, aisle: 2, margin: 2}
      - {object: wall_screen, placement: wall}
      - {object: whiteboard, placement: wall, count: [0, 1]}
  interview_room:       # a table between suspect and detective, a one-way mirror wall
    area: [24, 48]
    min_side: 4
    windows: forbidden
    next_to: [observation_room]
    connect: [observation_room]
    transit: false
    furniture:
      - {object: interview_set, placement: center}
  observation_room:     # behind the mirror
    area: [12, 36]
    min_side: 3
    windows: forbidden
    cluster: true
    furniture:
      - {object: terminal, placement: wall, count: [1, 2]}
      - {object: chair, placement: wall, count: [1, 2]}
  cell_block:           # holding cells along one wall, a guard post in front
    area: [80, 240]
    min_side: 8
    windows: forbidden
    door_width: 2
    stalls: {room: holding_cell, width: 4, depth: 4, max: 6, rest: lockup, single: holding_cell}
  lockup:               # what's left of a cell block: the walk in front of the cells
    area: [16, 200]
    min_side: 4
    windows: forbidden
    furniture:
      - {object: guard_post, placement: wall}
  police_lobby:         # public front office: the desk sergeant, one door into the station
    area: [40, 400]       # the program asks for less; a slice across the building is bigger
    min_side: 6
    transit: false        # the public goes no further
    furniture:
      - {object: reception_post, placement: back}
      - {object: bench, placement: wall, count: [1, 3]}
      - {object: plant, placement: corner, count: [0, 2]}
      - {object: wall_screen, placement: wall, count: [0, 1]}
      - {object: trash_bin, placement: wall, count: [0, 1]}
  holding_cell:         # 2 x 2 m: a bench, a toilet
    area: [16, 60]
    min_side: 4
    windows: forbidden
    transit: false
    furniture:
      - {object: wc, placement: corner}
      - {object: bench, placement: wall}
      - {object: sink, placement: wall, count: [0, 1]}
  evidence_room:
    area: [30, 120]
    min_side: 5
    windows: forbidden
    cluster: true
    furniture:
      - {object: evidence_locker, placement: wall, per: 8, count: [1, 4]}
      - {object: shelf, placement: rows, aisle: 2, margin: 1}
      - {object: counter, placement: wall, count: [0, 1]}
  records_room:         # case files and paper records, the front desk's back office
    area: [24, 120]
    min_side: 4
    windows: forbidden
    cluster: true
    furniture:
      - {object: filing_cabinet, placement: wall, per: 6, count: [2, 10]}
      - {object: shelf, placement: wall, per: 12, count: [0, 4]}
      - {object: workstation, placement: wall, count: [0, 1]}
  booking_room:         # fingerprints, retina scan, mugshot wall
    area: [24, 60]
    min_side: 4
    windows: forbidden
    furniture:
      - {object: counter, placement: wall}
      - {object: terminal, placement: wall, count: [1, 2]}
      - {object: bench, placement: wall}
  armory:
    area: [20, 60]
    min_side: 4
    windows: forbidden
    cluster: true
    furniture:
      - {object: weapon_locker, placement: wall, per: 4, count: [3, 10]}
      - {object: workbench, placement: wall, count: [0, 1]}
  # --- church ---
  nave:                 # the church hall: pews facing the altar
    area: [100, 100000]
    min_side: 10
    windows: required
    door_width: 4
    furniture:
      - {object: altar, placement: end}
      - {object: pulpit, placement: at, at: altar, beside: [flanks]}
      - {object: pew, placement: rows, aisle: 2, margin: 3, block: 24, toward: altar}
      - {object: candle_stand, placement: wall, count: [2, 6]}
      - {object: confessional, placement: wall, count: [0, 2]}
  choir_loft:           # the gallery upstairs
    area: [60, 100000]
    min_side: 8
    windows: required
    furniture:
      - {object: pew, placement: rows, aisle: 2, margin: 2, block: 24}
      - {object: organ, placement: back, count: [0, 1]}
  crypt:                # under the church
    area: [60, 100000]
    min_side: 8
    windows: forbidden
    furniture:
      - {object: tomb, placement: rows, aisle: 3, margin: 2}
      - {object: candle_stand, placement: wall, count: [2, 4]}
  sacristy:
    area: [24, 70]
    min_side: 5
    next_to: [nave]
    furniture:
      - {object: wardrobe, placement: wall, count: [1, 3]}
      - {object: cabinet, placement: wall, count: [1, 2]}
      - {object: table, placement: center, count: [0, 1]}
  parish_hall:          # community room, soup kitchen in the Barrens
    area: [60, 200]
    min_side: 7
    windows: required
    door_width: 3
    furniture:
      - {object: dining_set, placement: rows, aisle: 2, margin: 2}
      - {object: counter, placement: wall, count: [0, 1]}
  # --- police extras ---
  sally_port:           # secure vehicle bay: prisoners go from the car straight to booking
    area: [90, 180]
    min_side: 10
    windows: forbidden
    door_width: 4
    furniture:
      - {object: car, placement: wall}
      - {object: weapon_locker, placement: wall, count: [1, 2]}   # guns stay out of the cells
      - {object: bench, placement: wall, count: [0, 1]}
      - {object: fire_extinguisher, placement: wall}
  forensics_lab:        # Knight Errant / Lone Star crime lab
    area: [40, 100]
    min_side: 6
    windows: optional
    furniture:
      - {object: lab_bench, placement: wall, count: [1, 2]}
      - {object: fume_hood, placement: wall, count: [0, 1]}
      - {object: specimen_fridge, placement: wall, count: [1, 2]}
      - {object: evidence_locker, placement: wall, count: [1, 2]}
      - {object: terminal, placement: wall, count: [1, 2]}
      - {object: sink, placement: wall}
      - {object: stool, placement: at, at: lab_bench, count: [0, 1]}
  # --- church extras ---
  shelter:              # night shelter for the Barrens' homeless
    wealth_shift: -1
    area: [60, 200]
    min_side: 7
    windows: optional
    door_width: 3
    furniture:
      - {object: mattress, placement: rows, aisle: 2, margin: 1}
      - {object: locker, placement: wall, count: [0, 4]}
      - {object: fire_barrel, placement: scatter, count: [0, 1], wealth: [squatter]}
